                window.localStorage.setItem('overload_v3',seedJson);
                window.alert=()=>{};
                window.confirm=()=>true;
                window.scrollTo=()=>{};
              }
            });
            await wait(70);
            if(dom.window.HTMLElement)dom.window.HTMLElement.prototype.scrollIntoView=()=>{};
            return dom;
          };

          const run=async()=>{
            let dom=await boot();
            let w=dom.window;
            w.renderHome();
            let primary=w.document.getElementById('homePrimary').textContent;
            assert(primary.includes('What are we training today?'),'new user home should lead with Coach intent');
