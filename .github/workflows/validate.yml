            coachInput.value='30 minute legs';
            w.homeCoachBuildPrompt();
            await wait(10);
            assert(w.document.getElementById('modal').classList.contains('open'),'home Coach prompt should enter Quick Build flow');
            w.closeModal();

            const fixture=w.installRegressionFixturePlan();
            const fixtureState=JSON.parse(w.localStorage.getItem('overload_v3'));
            const rid=fixture.routines[0].id;
            const pid=fixture.program.id;
            dom.window.close();

            const savedState=JSON.parse(JSON.stringify(fixtureState));
            savedState.activeProgramId=null;
            savedState.activeWorkout=null;
            savedState.sessions=[];
            dom=await boot(savedState);w=dom.window;w.renderHome();
            primary=w.document.getElementById('homePrimary').textContent;
            assert(primary.includes('READY TO TRAIN'),'saved-routine user should get direct next-action hero');
            assert(primary.includes('Fixture Full Body A'),'home should surface a concrete saved routine');
            assert(w.document.getElementById('homeCoachLauncher').textContent.includes('Coach Swolecat'),'returning user should still have Coach close at hand');

            w.openRoutine(rid);await wait(15);
            const activeState=JSON.parse(w.localStorage.getItem('overload_v3'));
            dom.window.close();
            dom=await boot(activeState);w=dom.window;w.renderHome();
            primary=w.document.getElementById('homePrimary').textContent;
            assert(primary.includes('WORKOUT IN PROGRESS'),'active workout must dominate Home');
            assert(primary.includes('Resume'),'active workout home should be Resume-first');
            assert.equal(w.document.getElementById('homeCoachLauncher').textContent.trim(),'','Coach should not compete with an active workout');
            dom.window.close();

            const programState=JSON.parse(JSON.stringify(fixtureState));
            programState.activeWorkout=null;
            programState.activeProgramId=pid;
            programState.sessions=[];
            dom=await boot(programState);w=dom.window;w.renderHome();
            primary=w.document.getElementById('homePrimary').textContent;
            assert(primary.includes('UP NEXT'),'active program should surface next workout');
            assert(primary.includes('Fixture Full Body A'),'program home should name concrete next workout');
            dom.window.close();

            const historyState=JSON.parse(JSON.stringify(savedState));
            const ex=historyState.routines.find(r=>r.id===rid).exercises[0];
            historyState.sessions=[{id:'home_hist',routineId:rid,routineName:'Fixture Full Body A',status:'finished',date:new Date().toISOString(),durationMinutes:42,exercises:[{exerciseId:ex.exerciseId,sets:[{done:true,weight:100,reps:8,type:'working',pr:''}],notes:''}]}];
            dom=await boot(historyState);w=dom.window;w.renderHome();
            assert(w.document.getElementById('homeTelemetry').textContent.includes('THIS WEEK'),'history should reveal compact weekly signal');
            assert(w.document.getElementById('homeLatest').textContent.includes('LAST WORKOUT'),'history should reveal only the latest workout recap');

            w.stopRestTimer();
            dom.window.close();
            console.log('Swole Cat V50 adaptive home launchpad PASS');
          };
          run().catch(err=>{console.error(err);process.exit(1)});
