        run: |
          node <<'JS'
          const fs = require('fs');
          const assert = require('assert');
          const {JSDOM} = require('jsdom');

          const html = fs.readFileSync('index.html','utf8');
          const dom = new JSDOM(html,{
            runScripts:'dangerously',
            url:'https://swole-cat.test/',
            pretendToBeVisual:true,
            beforeParse(window){
              window.localStorage.setItem('overload_v3',JSON.stringify({ui:{onboardingDone:true,haptics:false,keepAwake:false}}));
              window.alert=()=>{};
              window.confirm=()=>true;
              window.scrollTo=()=>{};
            }
          });

          const wait=ms=>new Promise(r=>setTimeout(r,ms));
          const read=()=>JSON.parse(dom.window.localStorage.getItem('overload_v3'));

          const run=async()=>{
            await wait(35);
            const w=dom.window;
            if(w.HTMLElement)w.HTMLElement.prototype.scrollIntoView=()=>{};

            w.installRegressionFixturePlan();
            let state=read();
            const rid=state.routines[0].id;
            const pid=state.programs[0].id;
            assert(state.programs[0].routineIds.includes(rid),'starter program should contain routine');

            // Archive should not silently break a program.
            w.archiveRoutine(rid);
            state=read();
            assert.equal(state.routines[0].archivedAt,null,'routine should not archive until program dependency is resolved');
            assert(w.document.getElementById('modalBody').textContent.includes('currently used'),'archive warning should explain program dependency');

            w.archiveRoutineAndRemoveFromPrograms(rid);
            state=read();
            assert(state.routines[0].archivedAt,'routine should archive after explicit removal from programs');
            assert(!state.programs.find(p=>p.id===pid).routineIds.includes(rid),'archived routine should leave program rotation');
            assert(!w.activeRoutines().some(r=>r.id===rid),'archived routine should leave active routine list');
            assert(w.archivedRoutines().some(r=>r.id===rid),'archived routine should appear in archive list');

            // Archived routine cannot start.
            w.openRoutine(rid);
            state=read();
            assert.equal(state.activeWorkout,null,'archived routine should not start');

            // Restore makes it usable again, but does not silently reinsert it into old programs.
            w.restoreRoutine(rid);
            state=read();
            assert.equal(state.routines.find(r=>r.id===rid).archivedAt,null,'restored routine should become active');
            assert(!state.programs.find(p=>p.id===pid).routineIds.includes(rid),'restore should not silently alter program rotation');

            // Direct permanent delete of an active routine is refused.
            const beforeCount=state.routines.length;
            w.deleteRoutine(rid);
            state=read();
            assert.equal(state.routines.length,beforeCount,'active routine should not permanently delete without archive');

            // Create history, then archive and permanently delete the routine.
            w.openRoutine(rid);
            w.updateSet(0,0,'weight','100');
            w.updateSet(0,0,'reps','8');
            w.toggleSet(0,0);w.stopRestTimer();
            w.finalizeWorkout(false);w.closeModal();
            state=read();
            const sessionsBefore=state.sessions.filter(s=>s.routineId===rid).length;
            assert(sessionsBefore>=1,'routine should have completed history before deletion');

            w.archiveRoutine(rid);
            w.runConfirmedAction();
            state=read();
            assert(state.routines.find(r=>r.id===rid).archivedAt,'routine should archive after confirmation');

            w.deleteRoutine(rid);
            w.runConfirmedAction();
            state=read();
            assert(!state.routines.some(r=>r.id===rid),'archived routine should permanently delete after confirmation');
            assert.equal(state.sessions.filter(s=>s.routineId===rid).length,sessionsBefore,'permanent routine deletion must preserve completed history');

            dom.window.close();
            console.log('Swole Cat V32 routine archive safeguards PASS');
          };
          run().catch(err=>{console.error(err);dom.window.close();process.exit(1)});
          JS


