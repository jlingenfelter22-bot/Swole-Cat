      - name: Smoke test V40 contextual header controls
        run: |
          node <<'JS'
          const fs = require('fs');
          const assert = require('assert');
          const {JSDOM} = require('jsdom');

          const html = fs.readFileSync('index.html','utf8');
          const dom = new JSDOM(html,{
            runScripts:'dangerously',
            url:'https://swole-cat.test/',
            pretendToBeVisual:true,
            beforeParse(window){
              window.localStorage.setItem('overload_v3',JSON.stringify({ui:{onboardingDone:true,haptics:false,keepAwake:false}}));
              window.alert=()=>{};
              window.confirm=()=>true;
              window.scrollTo=()=>{};
            }
          });

          const wait=ms=>new Promise(r=>setTimeout(r,ms));
          const run=async()=>{
            await wait(40);
            const w=dom.window,d=w.document;

            const control=d.getElementById('resumeWorkoutBtn');
            const settings=d.querySelector('.settings-header-control');
            assert(control,'contextual workout control should exist');
            assert(settings,'settings control should exist');
            assert.equal(control.textContent.trim(),'','workout control should be icon-only');
            assert.equal(settings.textContent.trim(),'','settings control should be icon-only');
            assert(settings.querySelector('.settings-gear-icon'),'settings should use a recognizable gear SVG');
            assert.equal(settings.getAttribute('aria-label'),'Settings','settings icon should remain accessible');
            assert(!control.classList.contains('show'),'workout control should stay hidden with no active workout');

            w.installStarterPlan();
            const state=JSON.parse(w.localStorage.getItem('overload_v3'));
            w.openRoutine(state.routines[0].id);
            await wait(15);

            assert(control.classList.contains('show'),'workout control should show for an active workout');
            assert.equal(control.dataset.state,'pause','active workout screen should show pause state');
            assert(control.querySelector('[data-icon="pause"]'),'pause state should render pause glyph');
            assert(control.getAttribute('aria-label')?.startsWith('Pause '),'pause glyph should have contextual accessible label');

            // Make pause timing behavior measurable.
            w.eval("state.activeWorkout.startDate=new Date(Date.now()-10*60*1000).toISOString();state.activeWorkout.pausedDurationMs=2*60*1000");
            control.click();
            await wait(15);

            assert.equal(d.querySelector('.view.active')?.id,'home','pause control should leave workout screen');
            assert.equal(control.dataset.state,'resume','paused workout should flip same control to resume state');
            assert(control.querySelector('[data-icon="play"]'),'resume state should render play glyph');
            assert(w.eval('!!state.activeWorkout.pausedAt'),'pause should persist a paused timestamp');
            const elapsedPaused=w.eval('workoutElapsedMs()');
            assert(elapsedPaused>7.8*60*1000 && elapsedPaused<8.2*60*1000,'elapsed workout time should exclude prior paused duration and current pause');

            control.click();
            await wait(15);

            assert.equal(d.querySelector('.view.active')?.id,'workout','resume control should return to workout');
            assert.equal(control.dataset.state,'pause','same button should flip back to pause after resume');
            assert(!w.eval('state.activeWorkout.pausedAt'),'resume should clear paused timestamp');
            assert(w.eval('state.activeWorkout.pausedDurationMs')>=2*60*1000,'resume should accumulate paused duration');

            dom.window.close();
            console.log('Swole Cat V40 contextual header controls PASS');
          };
          run().catch(err=>{console.error(err);dom.window.close();process.exit(1)});
          JS



      - name: Smoke test V41 performance behavior
        run: |
          node <<'JS'
          const fs = require('fs');
          const assert = require('assert');
          const {JSDOM} = require('jsdom');

          const html = fs.readFileSync('index.html','utf8');
          let lastScroll=null;
          const dom = new JSDOM(html,{
            runScripts:'dangerously',
            url:'https://swole-cat.test/',
            pretendToBeVisual:true,
            beforeParse(window){
              window.localStorage.setItem('overload_v3',JSON.stringify({ui:{onboardingDone:true,haptics:false,keepAwake:false}}));
              window.alert=()=>{};
              window.confirm=()=>true;
              window.scrollTo=(opts)=>{lastScroll=opts};
            }
          });

          const wait=ms=>new Promise(r=>setTimeout(r,ms));
          const run=async()=>{
            await wait(45);
            const w=dom.window;

            // Warm navigation must not persist unchanged state.
            const savedBefore=JSON.parse(w.localStorage.getItem('overload_v3')).meta?.lastSavedAt||null;
            w.go('routines');
            w.go('home');
            const savedAfter=JSON.parse(w.localStorage.getItem('overload_v3')).meta?.lastSavedAt||null;
            assert.equal(savedAfter,savedBefore,'plain tab navigation should not write app state');
            assert.equal(lastScroll?.behavior,'auto','top-level navigation should scroll instantly');

            // Expensive views should render once while state is unchanged.
            let exerciseRenders=0;
            const originalRenderExercises=w.renderExercises;
            w.renderExercises=function(){exerciseRenders++;return originalRenderExercises()};
            w.go('exercises');
            w.go('history');
            w.go('exercises');
            assert.equal(exerciseRenders,1,'unchanged exercise view should reuse its rendered DOM');

            // A real state save invalidates the cached view.
            w.installStarterPlan();
            w.go('home');
            w.go('exercises');
            await wait(25);
            assert.equal(exerciseRenders,2,'state changes should refresh cached navigation views on the next frame');

            // Continuous typing should remain in memory briefly, then autosave.
            const state=JSON.parse(w.localStorage.getItem('overload_v3'));
            w.openRoutine(state.routines[0].id);
            await wait(10);
            const beforeWeight=JSON.parse(w.localStorage.getItem('overload_v3')).activeWorkout.exercises[0].sets[0].weight;
            w.updateSet(0,0,'weight','123');
            const immediateWeight=JSON.parse(w.localStorage.getItem('overload_v3')).activeWorkout.exercises[0].sets[0].weight;
            assert.equal(immediateWeight,beforeWeight,'continuous input should not synchronously rewrite local storage');
            await wait(270);
            const persistedWeight=JSON.parse(w.localStorage.getItem('overload_v3')).activeWorkout.exercises[0].sets[0].weight;
            assert.equal(Number(persistedWeight),123,'batched autosave should persist shortly after input settles');

            // Navigation should paint first instead of forcing a synchronous storage flush.
            w.updateSet(0,0,'reps','11');
            const repsBeforeNav=JSON.parse(w.localStorage.getItem('overload_v3')).activeWorkout.exercises[0].sets[0].reps;
            w.go('home');
            const repsImmediatelyAfterNav=JSON.parse(w.localStorage.getItem('overload_v3')).activeWorkout.exercises[0].sets[0].reps;
            assert.equal(Number(repsImmediatelyAfterNav),Number(repsBeforeNav),'navigation should not block on pending storage writes');
            await wait(270);
            const repsAfterDebounce=JSON.parse(w.localStorage.getItem('overload_v3')).activeWorkout.exercises[0].sets[0].reps;
            assert.equal(Number(repsAfterDebounce),11,'pending workout edits should still persist after navigation');

            // Exercise accordion changes should update existing DOM without rebuilding the workout.
            w.resumeActiveWorkout();
            await wait(10);
            let workoutRenders=0;
            const originalRenderWorkout=w.renderWorkout;
            w.renderWorkout=function(){workoutRenders++;return originalRenderWorkout()};
            w.toggleExercisePanel(0);
            assert.equal(workoutRenders,0,'accordion toggle should not rerender the entire workout');
            const firstCard=w.document.getElementById('workoutExercise-0');
            assert(firstCard.classList.contains('collapsed'),'accordion DOM should update directly');

            // Micro-step buttons should update the input directly without a whole-workout render.
            w.toggleExercisePanel(0);
            const weightInput=w.document.querySelector('#workoutExercise-0 .set-card[data-set-index="0"] input[aria-label="weight"]');
            const beforeStep=Number(weightInput.value||0);
            w.changeSetValue(0,0,'weight',5);
            assert.equal(workoutRenders,0,'weight micro-step should not rerender the entire workout');
            assert.equal(Number(weightInput.value),beforeStep+5,'weight micro-step should repaint the affected input immediately');

            assert(html.includes('content-visibility:auto'),'long lists should use offscreen rendering containment');
            assert(html.includes('.native-app nav'),'native navigation should have Android-specific paint tuning');
            assert(html.includes('backdrop-filter:none!important'),'native dock blur should be disabled for cheaper paint');

            dom.window.close();
            console.log('Swole Cat V41 performance behavior PASS');
          };
          run().catch(err=>{console.error(err);dom.window.close();process.exit(1)});
          JS


      - name: Smoke test V42 Android native behavior
        run: |
          node <<'JS'
          const fs=require('fs');
          const assert=require('assert');
          const {JSDOM}=require('jsdom');
          const html=fs.readFileSync('index.html','utf8');
          let backHandler=null,appStateHandler=null,exitCount=0;
          const dom=new JSDOM(html,{
            runScripts:'dangerously',
            url:'https://localhost/',
            pretendToBeVisual:true,
            beforeParse(window){
              window.localStorage.setItem('overload_v3',JSON.stringify({ui:{onboardingDone:true,haptics:false,keepAwake:false}}));
              window.alert=()=>{};
              window.scrollTo=()=>{};
              window.Capacitor={
                isNativePlatform:()=>true,
                getPlatform:()=> 'android',
                Plugins:{
                  App:{
                    addListener:async(name,fn)=>{
                      if(name==='backButton')backHandler=fn;
                      if(name==='appStateChange')appStateHandler=fn;
                      return {remove:async()=>{}};
                    },
                    exitApp:()=>{exitCount++}
                  }
                }
              };
            }
          });
          const wait=ms=>new Promise(r=>setTimeout(r,ms));
          const run=async()=>{
            await wait(50);
            const w=dom.window;
            assert(backHandler,'Android back listener should be registered');
            assert(appStateHandler,'Android app-state listener should be registered');

            w.go('routines');
            w.go('exercises');
            backHandler();
            assert.equal(w.activeViewId(),'routines','Back should navigate to previous Soulcat screen');
            backHandler();
            assert.equal(w.activeViewId(),'home','Back should eventually return to Home');

            w.openModal('Test','<input id="modalBackInput">');
            backHandler();
            assert(!w.document.getElementById('modal').classList.contains('open'),'Back should close modal before navigating');

            backHandler();
            assert.equal(exitCount,0,'First Back at Home must not exit');
            backHandler();
            assert.equal(exitCount,1,'Second Back at Home should exit');

            w.installStarterPlan();
            const starterState=JSON.parse(w.localStorage.getItem('overload_v3'));
            w.openRoutine(starterState.routines[0].id);
            await wait(10);
            w.updateNotes(0,'pending native lifecycle save');
            const beforeBackground=JSON.parse(w.localStorage.getItem('overload_v3')).activeWorkout?.exercises?.[0]?.notes||'';
            appStateHandler({isActive:false});
            const afterBackground=JSON.parse(w.localStorage.getItem('overload_v3')).activeWorkout?.exercises?.[0]?.notes||'';
            assert.notEqual(afterBackground,beforeBackground,'backgrounding should flush pending workout edits');

            dom.window.close();
            console.log('Swole Cat V42 Android native behavior PASS');
          };
          run().catch(err=>{console.error(err);dom.window.close();process.exit(1)});
          JS
