name: Validate Swole Cat

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build modular web app
        run: npm run build:web

      - name: Check app JavaScript syntax
        run: |
          node --check www/app.js
          for file in src/data/*.js src/js/*.js; do
            node --check "$file"
          done

      - name: Check service worker syntax
        run: node --check www/sw.js

      - name: Check PWA manifest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path("www/manifest.webmanifest").read_text(encoding="utf-8"))
          assert data["name"]=="Swole Cat"
          assert data["display"]=="standalone"
          print("PWA manifest OK")
          PY

      - name: Check modular source architecture
        run: |
          node <<'JS'
          const fs=require('fs');
          const assert=require('assert');
          const source=fs.readFileSync('index.html','utf8');
          assert(!/<style>[\s\S]*<\/style>/.test(source),'index.html should not contain the application stylesheet');
          assert(!/<script>[\s\S]*<\/script>/.test(source),'index.html should not contain the application runtime');
          const moduleTags=[...source.matchAll(/<script src="\.\/src\/js\/([^"]+)"><\/script>/g)].map(m=>m[1]);
          assert.equal(moduleTags.length,20,'source shell should load all JavaScript domain modules');
          assert(moduleTags.includes('04f-coach-routine-control.js'),'v0.61 Coach saved-routine control module must stay registered');
          assert(moduleTags.includes('04g-coach-history-insights.js'),'v0.62 Coach history intelligence module must stay registered');
          assert(moduleTags.includes('04h-coach-program-auditor.js'),'v0.63 Coach Program auditor module must stay registered');
          assert(moduleTags.includes('05b-sharing.js'),'v0.66 local sharing module must stay registered');
          assert(!moduleTags.includes('04-coach.js'),'legacy monolithic Coach module must stay removed');
          const dataTags=[...source.matchAll(/<script src="\.\/src\/data\/([^"]+)"><\/script>/g)].map(m=>m[1]);
          assert.deepEqual(dataTags,['exercises.js','anatomy.js','coach-knowledge.js'],'source shell should load static data modules in order');
          const styleTags=[...source.matchAll(/<link rel="stylesheet" href="\.\/src\/styles\/([^"]+)">/g)].map(m=>m[1]);
          assert.equal(styleTags.length,4,'source shell should load all stylesheet layers');
          const built=fs.readFileSync('www/index.html','utf8');
          assert(built.includes('./app.js'),'production shell should use bundled app.js');
          assert(built.includes('./app.css'),'production shell should use bundled app.css');
          assert(!built.includes('./src/js/'),'production shell should not depend on source modules');
          console.log('Swole Cat modular architecture OK');
          JS

      - name: Install DOM smoke-test dependency
        run: npm install --no-save --package-lock=false jsdom@24

      - name: Prepare bundled DOM smoke-test fixture
        run: |
          node <<'JS'
          const fs=require('fs');
          let html=fs.readFileSync('www/index.html','utf8');
          const css=fs.readFileSync('www/app.css','utf8').replace(/<\/style/gi,'<\\/style');
          const js=fs.readFileSync('www/app.js','utf8').replace(/<\/script/gi,'<\\/script');
          const testRuntime=fs.readFileSync('scripts/test-runtime-fixture.js','utf8').replace(/<\/script/gi,'<\\/script');
          html=html.replace('<link rel="stylesheet" href="./app.css">',()=>`<style>${css}</style>`);
          html=html.replace('<script src="./app.js"></script>',()=>`<script>${js}</script><script>${testRuntime}</script>`);
          fs.writeFileSync('/tmp/swole-cat-test.html',html);
          JS

      - name: Stress test Coach Swolecat prompt matrix
        run: node scripts/coach-stress.mjs

      - name: Stress test Coach Swolecat language resilience
        run: node scripts/coach-language-fuzz.mjs

      - name: Stress test v0.59 Coach training intelligence
        run: node scripts/coach-intelligence-stress.mjs

      - name: Stress test v0.60 adaptive progression intelligence
        run: node scripts/coach-adaptive-progression-stress.mjs

      - name: Stress test v0.61 saved-routine Coach control
        run: node scripts/coach-routine-control-stress.mjs

      - name: Stress test v0.62 training-history Q&A and insights
        run: node scripts/coach-history-insights-stress.mjs

      - name: Stress test v0.63 Program auditor and long-term planning
        run: node scripts/coach-program-auditor-stress.mjs

      - name: Battle test v0.64 Coach longitudinal intelligence
        run: node scripts/coach-battle-hardening-stress.mjs

      - name: Beta test live-workout orientation and auto-advance
        run: node scripts/beta-live-workout-flow-stress.mjs

      - name: Beta test first-time-user workout clarity
        run: node scripts/beta-first-user-clarity-stress.mjs

      - name: Stress test v0.65 Focus Mode workout flow
        run: node scripts/focus-mode-workout-stress.mjs

      - name: Stress test v0.65.2 Focus Mode visual stability
        run: node scripts/focus-mode-qol-stress.mjs

      - name: Stress test v0.66.0 local routine and program sharing
        run: node scripts/sharing-stress.mjs

      - name: Stress test v0.66.1 beta optimization hardening
        run: node scripts/beta-optimization-stress.mjs

      - name: Smoke test active workouts, set types, progression, and supersets
        run: |
          node <<'JS'
          const fs = require('fs');
          const assert = require('assert');
          const {JSDOM} = require('jsdom');

          const html = fs.readFileSync('/tmp/swole-cat-test.html','utf8');
          const dom = new JSDOM(html,{
            runScripts:'dangerously',
            url:'https://swole-cat.test/',
            pretendToBeVisual:true,
            beforeParse(window){
              window.localStorage.setItem('overload_v3',JSON.stringify({ui:{onboardingDone:true,haptics:false,keepAwake:false}}));
              window.alert=()=>{};
              window.confirm=()=>true;
              window.scrollTo=()=>{};
            }
          });

          const wait = ms => new Promise(r=>setTimeout(r,ms));
          const read = () => JSON.parse(dom.window.localStorage.getItem('overload_v3'));
          const run = async () => {
            await wait(30);
            const w=dom.window;
            if(w.HTMLElement)w.HTMLElement.prototype.scrollIntoView=()=>{};

            w.installRegressionFixturePlan();
            let state=read();
            assert.equal(state.routines.length,3,'regression fixture routines should install');
            const rid=state.routines[0].id;

            w.openRoutine(rid);
            state=read();
            assert(state.activeWorkout,'workout should become active');
            const firstWorkoutId=state.activeWorkout.id;

            w.addWorkoutSet(0,'warmup');
            state=read();
            assert.equal(state.activeWorkout.exercises[0].sets[0].type,'warmup','warm-up should insert before working sets');

            w.addWorkoutSet(0,'drop');
            state=read();
            assert.equal(state.activeWorkout.exercises[0].sets.at(-1).type,'drop','drop set should append');

            // Log a warm-up and drop set that must NOT affect next-session progression.
            w.updateSet(0,0,'weight','50');w.updateSet(0,0,'reps','5');w.toggleSet(0,0);w.stopRestTimer();
            state=read();
            const workingIndexes=state.activeWorkout.exercises[0].sets.map((s,i)=>s.type==='working'?i:-1).filter(i=>i>=0);
            assert.equal(workingIndexes.length,3,'routine should still have three working sets');
            for(const i of workingIndexes){
              w.updateSet(0,i,'weight','100');w.updateSet(0,i,'reps','8');w.toggleSet(0,i);w.stopRestTimer();
            }
            state=read();
            const dropIndex=state.activeWorkout.exercises[0].sets.findIndex(s=>s.type==='drop');
            w.updateSet(0,dropIndex,'weight','60');w.updateSet(0,dropIndex,'reps','20');w.toggleSet(0,dropIndex);w.stopRestTimer();

            // Navigating away and reopening the same routine must resume the same draft.
            w.go('exercises');
            w.openRoutine(rid);
            state=read();
            assert.equal(state.activeWorkout.id,firstWorkoutId,'same routine should resume, not overwrite active workout');

            w.stopRestTimer();
            w.finishWorkout(true);
            state=read();
            assert.equal(state.sessions.length,1,'finished workout should enter history');
            assert.equal(state.activeWorkout,null,'finished workout should clear active state');

            // Next session should progress from 100x8 working sets, ignoring 50x5 warm-up and 60x20 drop.
            w.openRoutine(rid);
            state=read();
            const next=state.activeWorkout.exercises[0];
            assert(next.sets.every(s=>s.type==='working'),'fresh routine sets should be working sets');
            assert(next.sets.slice(0,3).every(s=>Number(s.weight)===100),'special sets must not change next working weight');
            assert(next.sets.slice(0,3).every(s=>Number(s.reps)===9),'double progression should recommend +1 rep on every working set');

            // Live superset pairing can be saved back to the routine.
            w.linkSuperset(0,1,true);
            state=read();
            const a=state.activeWorkout.exercises[0],b=state.activeWorkout.exercises[1];
            assert(a.supersetId && a.supersetId===b.supersetId,'active exercises should share a superset id');
            assert(state.routines[0].exercises[0].supersetGroup===state.routines[0].exercises[1].supersetGroup,'saved routine should retain superset');

            // Completing A1 should rotate to B without losing the active workout.
            w.toggleSet(0,0);
            state=read();
            assert.equal(state.activeWorkout.exercises[1].expanded,true,'superset should rotate to the paired exercise');
            assert(state.activeWorkout,'superset rotation should preserve active workout');

            // Add/move/remove special sets should persist.
            w.addWorkoutSet(1,'failure');
            state=read();
            let failureIndex=state.activeWorkout.exercises[1].sets.findIndex(s=>s.type==='failure');
            assert(failureIndex>=0,'failure set should be addable');
            w.moveWorkoutSet(1,failureIndex,-1);
            state=read();
            failureIndex=state.activeWorkout.exercises[1].sets.findIndex(s=>s.type==='failure');
            assert(failureIndex<state.activeWorkout.exercises[1].sets.length-1,'set should be reorderable');
            w.removeWorkoutSet(1,failureIndex);
            state=read();
            assert(!state.activeWorkout.exercises[1].sets.some(s=>s.type==='failure'),'unfinished set should be removable');

            w.stopRestTimer();
            dom.window.close();
            console.log('Swole Cat V23 smoke test PASS');
          };
          run().catch(err=>{console.error(err);dom.window.close();process.exit(1)});
          JS


      - name: Smoke test workout editing and deletion
        run: |
          node <<'JS'
          const fs = require('fs');
          const assert = require('assert');
          const {JSDOM} = require('jsdom');

          const html = fs.readFileSync('/tmp/swole-cat-test.html','utf8');
          const dom = new JSDOM(html,{
            runScripts:'dangerously',
            url:'https://swole-cat.test/',
            pretendToBeVisual:true,
            beforeParse(window){
              window.localStorage.setItem('overload_v3',JSON.stringify({ui:{onboardingDone:true,haptics:false,keepAwake:false}}));
              window.alert=()=>{};
              window.confirm=()=>true;
              window.scrollTo=()=>{};
            }
          });

          const wait = ms => new Promise(r=>setTimeout(r,ms));
          const read = () => JSON.parse(dom.window.localStorage.getItem('overload_v3'));
          const run = async () => {
            await wait(30);
            const w=dom.window;
            if(w.HTMLElement)w.HTMLElement.prototype.scrollIntoView=()=>{};

            w.installRegressionFixturePlan();
            let state=read();
            const rid=state.routines[0].id;
            w.openRoutine(rid);
            w.updateSet(0,0,'weight','100');
            w.updateSet(0,0,'reps','8');
            w.toggleSet(0,0);
            w.stopRestTimer();
            w.finishWorkout(true);

            state=read();
            assert.equal(state.sessions.length,1,'test workout should be saved');
            const sid=state.sessions[0].id;

            w.editCompletedWorkout(sid);
            const weight=w.document.getElementById('sessWeight-0-0');
            assert(weight,'completed workout editor should render weight input');
            weight.value='123';
            w.saveCompletedWorkoutEdit();

            state=read();
            assert.equal(Number(state.sessions[0].exercises[0].sets[0].weight),123,'completed workout should be editable');

            w.deleteSession(sid);
            w.runConfirmedAction();
            state=read();
            assert.equal(state.sessions.length,0,'completed workout should be deletable');

            w.archiveRoutine(rid);
            state=read();
            if(!state.routines.find(r=>r.id===rid)?.archivedAt){
              w.archiveRoutineAndRemoveFromPrograms(rid);
            }
            state=read();
            assert(state.routines.find(r=>r.id===rid)?.archivedAt,'routine should archive before permanent deletion');

            w.deleteRoutine(rid);
            w.runConfirmedAction();
            state=read();
            assert.equal(state.routines.length,2,'archived routine should be permanently deletable without deleting other routines');

            dom.window.close();
            console.log('Swole Cat management smoke test PASS');
          };
          run().catch(err=>{console.error(err);dom.window.close();process.exit(1)});
          JS


      - name: Smoke test V25 active workout structure
        run: |
          node <<'JS'
          const fs = require('fs');
          const assert = require('assert');
          const {JSDOM} = require('jsdom');

          const html = fs.readFileSync('/tmp/swole-cat-test.html','utf8');
          const dom = new JSDOM(html,{
            runScripts:'dangerously',
            url:'https://swole-cat.test/',
            pretendToBeVisual:true,
            beforeParse(window){
              window.localStorage.setItem('overload_v3',JSON.stringify({ui:{onboardingDone:true,haptics:false,keepAwake:false}}));
              window.alert=()=>{};
              window.confirm=()=>true;
              window.scrollTo=()=>{};
            }
          });

          const wait = ms => new Promise(r=>setTimeout(r,ms));
          const read = () => JSON.parse(dom.window.localStorage.getItem('overload_v3'));

          const run = async () => {
            await wait(30);
            const w=dom.window;
            if(w.HTMLElement)w.HTMLElement.prototype.scrollIntoView=()=>{};

            w.installRegressionFixturePlan();
            let state=read();
            const rid=state.routines[0].id;
            const originalOrder=state.routines[0].exercises.map(e=>e.exerciseId);
            const originalCount=originalOrder.length;

            // Today-only structural edits must not rewrite the saved routine.
            w.openRoutine(rid);
            w.moveWorkoutExercise(0,1);
            w.toggleSkipWorkoutExercise(1);
            state=read();
            assert.equal(state.activeWorkout.structureDirty,true,'reordering should mark the workout structure changed');
            assert.equal(state.activeWorkout.exercises[1].skipped,true,'exercise should be skippable for today');
            const skippedId=state.activeWorkout.exercises[1].exerciseId;

            const removedTodayId=state.activeWorkout.exercises[2].exerciseId;
            w.removeWorkoutExercise(2);
            w.runConfirmedAction();
            state=read();
            assert.equal(state.activeWorkout.exercises.length,originalCount-1,'exercise should be removable from today');
            assert.deepEqual(state.routines[0].exercises.map(e=>e.exerciseId),originalOrder,'today-only edits must not rewrite routine');

            w.finalizeWorkout(false);
            state=read();
            assert.equal(state.activeWorkout,null,'today-only workout should finish normally');
            assert.deepEqual(state.routines[0].exercises.map(e=>e.exerciseId),originalOrder,'finishing today-only must preserve routine');
            assert(state.sessions[0].exercises.some(e=>e.exerciseId===skippedId && e.skipped),'skipped status should be recorded in that session');
            assert(!state.sessions[0].exercises.some(e=>e.exerciseId===removedTodayId),'removed today exercise should not enter session');
            w.closeModal();

            // A second workout can explicitly promote structural edits to the routine.
            w.openRoutine(rid);
            w.moveWorkoutExercise(0,1);
            w.toggleSkipWorkoutExercise(1);
            state=read();
            const skippedSavedId=state.activeWorkout.exercises[1].exerciseId;

            const beforeWorking=state.activeWorkout.exercises[0].sets.filter(s=>(s.type||'working')==='working').length;
            w.addWorkoutSet(0,'working');
            state=read();
            const afterWorking=state.activeWorkout.exercises[0].sets.filter(s=>(s.type||'working')==='working').length;
            assert.equal(afterWorking,beforeWorking+1,'working set should be addable');

            const removedSavedId=state.activeWorkout.exercises[2].exerciseId;
            w.removeWorkoutExercise(2);
            w.runConfirmedAction();
            state=read();
            const activeOrder=state.activeWorkout.exercises.map(e=>e.exerciseId);
            assert.equal(state.activeWorkout.structureDirty,true,'routine-update candidate should remain dirty until explicitly saved');

            w.finalizeWorkout(true);
            state=read();
            assert.deepEqual(state.routines[0].exercises.map(e=>e.exerciseId),activeOrder,'Finish + Update Routine should save active order and removals');
            assert(state.routines[0].exercises.some(e=>e.exerciseId===skippedSavedId),'skipped exercise must remain in saved routine');
            assert(!state.routines[0].exercises.some(e=>e.exerciseId===removedSavedId),'removed exercise should leave routine when update is chosen');
            assert.equal(state.routines[0].exercises[0].sets,afterWorking,'working-set count change should save to routine');
            assert.equal(state.sessions.length,2,'both structure test workouts should be saved');

            dom.window.close();
            console.log('Swole Cat V25 structure smoke test PASS');
          };
          run().catch(err=>{console.error(err);dom.window.close();process.exit(1)});
          JS


      - name: Smoke test V26 programs
        run: |
          node <<'JS'
          const fs = require('fs');
          const assert = require('assert');
          const {JSDOM} = require('jsdom');

          const html = fs.readFileSync('/tmp/swole-cat-test.html','utf8');
          const dom = new JSDOM(html,{
            runScripts:'dangerously',
            url:'https://swole-cat.test/',
            pretendToBeVisual:true,
            beforeParse(window){
              window.localStorage.setItem('overload_v3',JSON.stringify({ui:{onboardingDone:true,haptics:false,keepAwake:false}}));
              window.alert=()=>{};
              window.confirm=()=>true;
              window.scrollTo=()=>{};
            }
          });

          const wait = ms => new Promise(r=>setTimeout(r,ms));
          const read = () => JSON.parse(dom.window.localStorage.getItem('overload_v3'));

          const run = async () => {
            await wait(30);
            const w=dom.window;
            if(w.HTMLElement)w.HTMLElement.prototype.scrollIntoView=()=>{};

            // Starter now installs A/B/C as one active program.
            w.installRegressionFixturePlan();
            let state=read();
            assert.equal(state.routines.length,3,'starter should create three routines');
            assert.equal(state.programs.length,1,'starter should create one program');
            assert.equal(state.activeProgramId,state.programs[0].id,'starter program should become active');
            const pid=state.programs[0].id;
            const [a,b,c]=state.programs[0].routineIds;
            assert.equal(state.programs[0].nextIndex,0,'program should begin at Workout A');

            // Start A from the program and finish it.
            w.startProgramWorkout(pid);
            state=read();
            assert.equal(state.activeWorkout.routineId,a,'program should start Workout A');
            assert.equal(state.activeWorkout.programId,pid,'active workout should retain program id');
            w.updateSet(0,0,'weight','100');w.updateSet(0,0,'reps','8');w.toggleSet(0,0);w.stopRestTimer();
            w.finalizeWorkout(false);
            state=read();
            assert.equal(state.programs[0].nextIndex,1,'finishing A should advance to B');
            assert.equal(state.sessions[0].programId,pid,'finished program session should retain program id');
            w.closeModal();

            // Start B and finish it, then C becomes next.
            w.startProgramWorkout(pid);
            state=read();
            assert.equal(state.activeWorkout.routineId,b,'program should start Workout B next');
            w.updateSet(0,0,'weight','100');w.updateSet(0,0,'reps','8');w.toggleSet(0,0);w.stopRestTimer();
            w.finalizeWorkout(false);
            state=read();
            assert.equal(state.programs[0].nextIndex,2,'finishing B should advance to C');
            w.closeModal();

            // A manual routine start should not alter program sequencing.
            w.openRoutine(a);
            state=read();
            assert.equal(state.activeWorkout.programId,null,'manual routine should not be tagged as a program workout');
            w.updateSet(0,0,'weight','100');w.updateSet(0,0,'reps','8');w.toggleSet(0,0);w.stopRestTimer();
            w.finalizeWorkout(false);
            state=read();
            assert.equal(state.programs[0].nextIndex,2,'manual workout must not advance program');
            w.closeModal();

            // Finish C and ensure rotation wraps back to A.
            w.startProgramWorkout(pid);
            state=read();
            assert.equal(state.activeWorkout.routineId,c,'program should still be waiting on C');
            w.updateSet(0,0,'weight','100');w.updateSet(0,0,'reps','8');w.toggleSet(0,0);w.stopRestTimer();
            w.finalizeWorkout(false);
            state=read();
            assert.equal(state.programs[0].nextIndex,0,'program should wrap back to A after C');
            assert.equal(state.sessions.filter(s=>s.programId===pid).length,3,'program should count only program-launched sessions');
            w.closeModal();

            // Deleting a program must preserve routines and history.
            const routinesBefore=state.routines.length;
            const sessionsBefore=state.sessions.length;
            w.deleteProgram(pid);w.runConfirmedAction();
            state=read();
            assert.equal(state.programs.length,0,'program should be deletable');
            assert.equal(state.routines.length,routinesBefore,'deleting program must preserve routines');
            assert.equal(state.sessions.length,sessionsBefore,'deleting program must preserve history');
            assert.equal(state.activeProgramId,null,'deleting active program should clear active program id');

            // Custom program builder should allow a user-defined A/B rotation and preserve its order.
            w.newProgram();
            w.document.getElementById('programName').value='Custom AB';
            w.document.getElementById('programFrequency').value='2';
            w.addProgramRoutine(a);
            w.addProgramRoutine(b);
            w.toggleProgramDay(2);
            w.toggleProgramDay(4);
            w.saveProgram();
            state=read();
            assert.equal(state.programs.length,1,'custom program should save');
            assert.equal(state.programs[0].name,'Custom AB','custom program name should save');
            assert.deepEqual(state.programs[0].routineIds,[a,b],'custom program order should save');
            assert.equal(state.programs[0].frequency,2,'custom program frequency should save');
            assert.deepEqual(state.programs[0].preferredDays,[2,4],'preferred training days should save');
            assert.equal(state.activeProgramId,state.programs[0].id,'first custom program should become active');

            dom.window.close();
            console.log('Swole Cat V26 program smoke test PASS');
          };
          run().catch(err=>{console.error(err);dom.window.close();process.exit(1)});
          JS


      - name: Smoke test V27 exercise preferences
        run: |
          node <<'JS'
          const fs = require('fs');
          const assert = require('assert');
          const {JSDOM} = require('jsdom');

          const html = fs.readFileSync('/tmp/swole-cat-test.html','utf8');
          const dom = new JSDOM(html,{
            runScripts:'dangerously',
            url:'https://swole-cat.test/',
            pretendToBeVisual:true,
            beforeParse(window){
              window.localStorage.setItem('overload_v3',JSON.stringify({ui:{onboardingDone:true,haptics:false,keepAwake:false}}));
              window.alert=()=>{};
              window.confirm=()=>true;
              window.scrollTo=()=>{};
              window.fetch=()=>Promise.reject(new Error('offline test'));
            }
          });

          const wait = ms => new Promise(r=>setTimeout(r,ms));
          const read = () => JSON.parse(dom.window.localStorage.getItem('overload_v3'));

          const run = async () => {
            await wait(30);
            const w=dom.window;
            if(w.HTMLElement)w.HTMLElement.prototype.scrollIntoView=()=>{};

            w.installRegressionFixturePlan();
            let state=read();
            const bench=w.exById('lib_0');
            const dbBench=w.allExercises().find(x=>x.name==='Dumbbell Bench Press');
            const machine=w.allExercises().find(x=>x.name==='Chest Press Machine');
            const pushup=w.allExercises().find(x=>x.name==='Push-Up');
            const squat=w.allExercises().find(x=>x.name==='Back Squat');
            assert(bench&&dbBench&&machine&&pushup&&squat,'expected library exercises should exist');

            // Preference state persists.
            w.setExercisePreference(dbBench.id,'prefer');
            w.setExercisePreference(machine.id,'avoid');
            w.setExercisePreference(pushup.id,'hide');
            w.toggleFavorite(dbBench.id);
            state=read();
            assert.equal(state.exercisePreferences[dbBench.id],'prefer','Prefer should persist');
            assert.equal(state.exercisePreferences[machine.id],'avoid','Avoid should persist');
            assert.equal(state.exercisePreferences[pushup.id],'hide','Hide should persist');
            assert(state.favorites.includes(dbBench.id),'favorite should remain independent of preference');

            // Hidden exercises leave normal browsing and substitution suggestions.
            assert(!w.visibleExercises().some(x=>x.id===pushup.id),'hidden exercise should not be in visible exercise pool');
            let subs=w.recommendedSubs(bench.id);
            assert(!subs.some(row=>row.x.id===pushup.id),'hidden exercise should be excluded from substitutions');
            const preferPos=subs.findIndex(row=>row.x.id===dbBench.id);
            const avoidPos=subs.findIndex(row=>row.x.id===machine.id);
            assert(preferPos>=0&&avoidPos>=0,'preferred and avoided compatible substitutions should remain available');
            assert(preferPos<avoidPos,'preferred substitute should rank above avoided substitute');

            // Hidden filter remains a recovery path.
            w.go('exercises');
            w.setExerciseHistoryFilter('all');
            assert(!w.document.getElementById('exerciseList').innerHTML.includes("openExerciseProgress('"+pushup.id+"')"),'All should exclude hidden exercises');
            w.setExerciseHistoryFilter('hidden');
            assert(w.document.getElementById('exerciseList').innerHTML.includes("openExerciseProgress('"+pushup.id+"')"),'Hidden filter should expose hidden exercises for management');

            // Hiding an exercise must not delete it from an existing routine or stop that routine from starting.
            const routine=state.routines.find(r=>r.name==='Fixture Full Body A');
            assert(routine.exercises.some(e=>e.exerciseId===squat.id),'fixture routine should contain Back Squat');
            w.setExercisePreference(squat.id,'hide');
            state=read();
            assert(state.routines.find(r=>r.name==='Fixture Full Body A').exercises.some(e=>e.exerciseId===squat.id),'Hide must not remove exercise from saved routine');
            w.openRoutine(routine.id);
            state=read();
            assert(state.activeWorkout.exercises.some(e=>e.exerciseId===squat.id),'hidden routine exercise should still load in active workout');
            w.cancelWorkout();w.runConfirmedAction();

            // Neutral restores normal visibility.
            w.setExercisePreference(pushup.id,'neutral');
            state=read();
            assert(!state.exercisePreferences[pushup.id],'Neutral should clear stored preference');
            assert(w.visibleExercises().some(x=>x.id===pushup.id),'neutral exercise should return to normal browsing');

            dom.window.close();
            console.log('Swole Cat V27 exercise preference smoke test PASS');
          };
          run().catch(err=>{console.error(err);dom.window.close();process.exit(1)});
