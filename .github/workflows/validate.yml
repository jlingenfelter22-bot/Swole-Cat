            const squat=w.allExercises().find(ex=>ex.name==='Back Squat');
            const mkSession=(days,idA,idB)=>({
              id:'s'+days,date:new Date(Date.now()-days*86400000).toISOString(),routineName:'Logged Workout',
              exercises:[idA,idB].filter(Boolean).map(id=>({exerciseId:id,sets:[{type:'working',done:true,weight:100,reps:8}]}))
            });
