          assert(!html.includes('function installStarterPlan'),'starter product helper must be retired');

          const wait=ms=>new Promise(r=>setTimeout(r,ms));
          const boot=async(seed)=>{
            const seedJson=JSON.stringify(seed||{ui:{onboardingDone:true,haptics:false,keepAwake:false}});
            const dom=new JSDOM(html,{
              runScripts:'dangerously',
              url:'https://swole-cat.test/',
