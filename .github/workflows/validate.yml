            assert(!draft.selectedIds.includes(removedId),'removed exercise should leave the draft');

            result=w.coachRefineDraftText('add '+removedName);
            assert(result.ok,'Coach should understand adding a compatible named exercise back');
            draft=w.eval('coachBuildDraft');
            assert(draft.request.requiredExerciseIds.includes(removedId),'added exercise should become a persistent requested exercise');
            assert(draft.selectedIds.includes(removedId),'added exercise should return to the generated draft');

            const lateral=w.allExercises().find(ex=>ex.name==='Dumbbell Lateral Raise');
