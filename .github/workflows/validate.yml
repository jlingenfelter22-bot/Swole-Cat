          }});
          const wait=ms=>new Promise(r=>setTimeout(r,ms));
          const run=async()=>{
            await wait(100);
            const w=dom.window;

            const prompt='I need a good 60 minute chest, arm, and back workout';
            const req=w.coachParsePrompt(prompt,'hypertrophy');
            assert.equal(req.duration,60);
            assert(req.targetKeys.includes('chest'),'chest target should parse');
            assert(req.targetKeys.includes('arms'),'singular arm should normalize to arms');
            assert(req.targetKeys.includes('back'),'back target should parse');
            assert(req.targetRegions.includes('biceps')&&req.targetRegions.includes('triceps'),'arms must expand to both direct arm regions');

            const draft=w.coachGenerateWorkout(req);
            assert(draft,'Coach should generate the requested workout');
            const exercises=draft.selectedIds.map(id=>w.exById(id));
            const names=exercises.map(ex=>ex.name);
            const metas=exercises.map(ex=>w.exerciseMuscleMetadata(ex));
            const families=exercises.map(ex=>w.coachMovementFamily(ex));
            const familyCounts=families.reduce((m,f)=>(m[f]=(m[f]||0)+1,m),{});

            assert(exercises.some((ex,i)=>metas[i].primary.includes('chest')),'chest must receive primary work');
            assert(exercises.some((ex,i)=>metas[i].primary.includes('upper_back')||metas[i].primary.includes('lats')),'back must receive primary work');
            const directBiceps=exercises.filter((ex,i)=>ex.pattern==='elbow_flexion'&&metas[i].primary.includes('biceps'));
            const directTriceps=exercises.filter((ex,i)=>ex.pattern==='elbow_extension'&&metas[i].primary.includes('triceps')&&!/\\b(?:dip|push-?up|bench press|jm press|tate press)\\b/i.test(ex.name));
            assert(directBiceps.length>=1,'explicit arms target must include direct biceps work');
            assert(directTriceps.length>=1,'explicit arms target must include a true direct triceps isolation');
            assert((familyCounts.row||0)<=1,'multi-target workout must not stack multiple row variants');
            assert((familyCounts.lat_isolation||0)<=1,'multi-target workout must not stack cable and dumbbell pullovers as duplicate lat-isolation work');
            assert.equal(new Set(families).size,families.length,'multi-target workout should use distinct movement families when enough alternatives exist');
            assert(exercises.length>=7,'60-minute hypertrophy request should remain a substantial session');

            const redundantRows=names.filter(n=>/Row/i.test(n));
            assert(redundantRows.length<=1,'user feedback regression: no Barbell Row + Chest Supported DB Row + Chest Supported Row pileup');

            const backReq=w.coachParsePrompt('60 minute back workout','hypertrophy');
            const backDraft=w.coachGenerateWorkout(backReq);
            const backFamilies=backDraft.selectedIds.map(id=>w.coachMovementFamily(w.exById(id)));
            assert(backFamilies.filter(f=>f==='row').length<=2,'even a back-only day should not become a list of row variations');
            assert(backFamilies.includes('vertical_pull'),'back day should include a vertical-pull pattern when available');
            const backExercises=backDraft.selectedIds.map(id=>w.exById(id));
            assert(!backExercises.some(ex=>['hinge','olympic_pull'].includes(ex.pattern)),'hypertrophy back day should not pad itself with rack pulls or Olympic pulls when normal back patterns are available');

            const shortReq=w.coachParsePrompt('30 minute chest, arm, and back workout','hypertrophy');
            const shortDraft=w.coachGenerateWorkout(shortReq);
            const shortExercises=shortDraft.selectedIds.map(id=>w.exById(id));
            const shortMetas=shortExercises.map(ex=>w.exerciseMuscleMetadata(ex));
            assert(shortExercises.some((ex,i)=>shortMetas[i].primary.includes('chest')),'short multi-target workout must still keep primary chest work');
            assert(shortExercises.some((ex,i)=>shortMetas[i].primary.includes('upper_back')||shortMetas[i].primary.includes('lats')),'short multi-target workout must still keep primary back work');
            assert(shortExercises.some((ex,i)=>ex.pattern==='elbow_flexion'&&shortMetas[i].primary.includes('biceps')),'short explicit arm request must still keep direct biceps work');
            assert(shortExercises.some((ex,i)=>ex.pattern==='elbow_extension'&&shortMetas[i].primary.includes('triceps')&&!/\\b(?:dip|push-?up|bench press|jm press|tate press)\\b/i.test(ex.name)),'short explicit arm request must still keep direct triceps isolation');

            const pushDraft=w.coachGenerateWorkout(w.coachParsePrompt('45 minute push workout','hypertrophy'));
            const pushFamilies=pushDraft.selectedIds.map(id=>w.coachMovementFamily(w.exById(id)));
            assert(pushFamilies.includes('flat_press'),'push workout should reserve a chest press role');
            assert(pushFamilies.includes('shoulder_press'),'push workout should reserve a shoulder press role');
            assert(pushFamilies.includes('triceps_extension'),'push workout should reserve direct triceps work');

            const pullDraft=w.coachGenerateWorkout(w.coachParsePrompt('45 minute pull workout','hypertrophy'));
            const pullFamilies=pullDraft.selectedIds.map(id=>w.coachMovementFamily(w.exById(id)));
            assert(pullFamilies.includes('row'),'pull workout should reserve a horizontal pull role');
            assert(pullFamilies.includes('vertical_pull'),'pull workout should reserve a vertical pull role');
            assert(pullFamilies.includes('biceps_curl'),'pull workout should reserve direct biceps work');

            const singularArmFocus=w.coachParseProgramFocus('5 day program with arm emphasis');
            assert(singularArmFocus.labels.includes('Arms'),'program focus should understand singular arm');
            assert(singularArmFocus.regions.includes('biceps')&&singularArmFocus.regions.includes('triceps'),'singular arm program focus should expand to both arm regions');

            const escaped=w.coachRegexEscape('Face Pull (Cable) [A]');
            assert(new RegExp('^'+escaped+'$').test('Face Pull (Cable) [A]'),'Coach regex escaping must preserve literal punctuation safely');

            console.log('Chest + arms + back:',names.join(' | '));
            console.log('Back only:',backDraft.selectedIds.map(id=>w.exById(id).name).join(' | '));
            dom.window.close();
            console.log('Swole Cat V55.0 workout programming intelligence PASS');
          };
          run().catch(err=>{console.error(err);dom.window.close();process.exit(1)});
