      - name: Smoke test V502 save completed workout as routine
        run: |
          node <<'JS'
          const fs=require('fs');
          const assert=require('assert');
          const {JSDOM}=require('jsdom');
          const html=fs.readFileSync('/tmp/swole-cat-test.html','utf8');
          const dom=new JSDOM(html,{runScripts:'dangerously',url:'https://swole-cat.test/',pretendToBeVisual:true,beforeParse(window){
            window.localStorage.setItem('overload_v3',JSON.stringify({ui:{onboardingDone:true,haptics:false,keepAwake:false}}));
            window.alert=()=>{};window.confirm=()=>true;window.scrollTo=()=>{};
          }});
          const wait=ms=>new Promise(r=>setTimeout(r,ms));
          const run=async()=>{
            await wait(70);
            const w=dom.window;

            const req=w.coachParsePrompt('30 minute legs','hypertrophy');
            const draft=w.coachGenerateWorkout(req);
            assert(draft&&draft.selectedIds.length>=3,'Coach should build a temporary leg workout');
            assert(w.coachStartWorkoutNow(draft),'temporary Coach workout should start');
            await wait(10);

            // Complete the first working set of every generated exercise so the session
            // represents a real completed workout with preserved Coach config.
            const saved=JSON.parse(w.localStorage.getItem('overload_v3'));
            for(let ei=0;ei<saved.activeWorkout.exercises.length;ei++){
              w.updateSet(ei,0,'weight',String(100+ei*5));
              w.updateSet(ei,0,'reps','10');
              w.toggleSet(ei,0);
            }
            w.finalizeWorkout(false);
            await wait(15);

            let state=JSON.parse(w.localStorage.getItem('overload_v3'));
            assert.equal(state.sessions.length,1,'Coach workout should save to history');
            const session=state.sessions[0];
            assert.equal(session.routineId,null,'temporary Coach workout should remain unlinked to a saved routine');
            const snapshot=JSON.stringify(session);

            const recapText=w.document.getElementById('modal').textContent;
            assert(recapText.includes('Save as Routine'),'completed temporary workout recap should offer post-workout save');

            w.openSaveSessionAsRoutine(session.id);
            await wait(10);
            const name=w.document.getElementById('sessionRoutineName');
            assert(name,'save-as-routine modal should allow naming');
            name.value='Leg Day I Actually Liked';
            const newId=w.saveCompletedSessionAsRoutine(session.id);
            assert(newId,'saving completed workout should return new routine id');

            state=JSON.parse(w.localStorage.getItem('overload_v3'));
            const routine=state.routines.find(r=>r.id===newId);
            assert(routine,'new routine should persist');
            assert.equal(routine.sourceSessionId,session.id,'routine should remember its source session for duplicate protection');
            assert.equal(routine.name,'Leg Day I Actually Liked');
            assert.deepEqual(routine.exercises.map(e=>e.exerciseId),session.exercises.filter(e=>!e.skipped&&w.completedSets(e).length).map(e=>e.exerciseId),'exercise order should match completed session');
            assert(routine.exercises.every(e=>e.sets===1),'routine should respect completed working-set count');
            routine.exercises.forEach(e=>{
              const source=session.exercises.find(row=>row.exerciseId===e.exerciseId&&!row.skipped&&w.completedSets(row).length);
              assert(source,'saved routine exercise should map back to completed source exercise');
              assert.equal(e.minReps,source.config.minReps,'saved routine should preserve per-exercise minimum reps');
              assert.equal(e.maxReps,source.config.maxReps,'saved routine should preserve per-exercise maximum reps');
              assert.equal(e.restSeconds,source.config.restSeconds,'saved routine should preserve per-exercise rest');
              assert.equal(e.trainingGoal,source.config.trainingGoal,'saved routine should preserve per-exercise training goal');
            });
            assert.equal(JSON.stringify(state.sessions[0]),snapshot,'saving as routine must not mutate historical session');

            w.openHistoricalWorkoutRecap(session.id);
            await wait(10);
            assert(w.document.getElementById('modal').textContent.includes('Routine Saved'),'recap should show saved state after conversion');
            const beforeCount=state.routines.length;
            const duplicateId=w.saveCompletedSessionAsRoutine(session.id);
            state=JSON.parse(w.localStorage.getItem('overload_v3'));
            assert.equal(state.routines.length,beforeCount,'duplicate save should not create another routine');
            assert.equal(duplicateId,newId,'duplicate save should resolve to existing routine');

            dom.window.close();
            console.log('Swole Cat V50.2 save completed workout as routine PASS');
          };
          run().catch(err=>{console.error(err);dom.window.close();process.exit(1)});
          JS


      - name: Smoke test V504 first-time weight autofill
        run: |
          node <<'JS'
          const fs=require('fs');
          const assert=require('assert');
          const {JSDOM}=require('jsdom');
          const html=fs.readFileSync('/tmp/swole-cat-test.html','utf8');
          const dom=new JSDOM(html,{runScripts:'dangerously',url:'https://swole-cat.test/',pretendToBeVisual:true,beforeParse(window){
            window.localStorage.setItem('overload_v3',JSON.stringify({ui:{onboardingDone:true,haptics:false,keepAwake:false}}));
            window.alert=()=>{};window.confirm=()=>true;window.scrollTo=()=>{};
          }});
          const wait=ms=>new Promise(r=>setTimeout(r,ms));
          const run=async()=>{
            await wait(70);
            const w=dom.window;

            // New exercise: first completed typing sequence should seed the final value,
            // not the first digit emitted by the input event.
            const ex=w.allExercises().find(x=>x.name==='Anderson Squat')||w.allExercises().find(x=>x.name==='Back Squat');
            assert(ex,'test exercise should exist');
            w.eval(`state.routines=[{id:'seed_r',name:'Seed Test',trainingMode:'guided',description:'',exercises:[{exerciseId:'${ex.id}',sets:3,minReps:6,maxReps:10,increment:5,mode:'double',restSeconds:120}]}];save()`);
            w.startRoutineFresh('seed_r');
            await wait(10);

            // Exercise the real DOM path at a deliberately slow typing cadence.
            // While the weight box still has focus, autofill must never commit a partial number.
            const weightInput=w.document.querySelector('#workoutExercise-0 .set-card[data-set-index="0"] input[aria-label="weight"]');
            assert(weightInput,'first working-set weight input should exist');
            weightInput.focus();
            weightInput.value='1';
            weightInput.dispatchEvent(new w.Event('input',{bubbles:true}));
            await wait(320);

            let state=JSON.parse(w.localStorage.getItem('overload_v3'));
            let weights=state.activeWorkout.exercises[0].sets.map(s=>Number(s.weight));
            assert.deepEqual(weights,[1,0,0],'partial first digit must not seed while the weight field is still being edited');

            weightInput.value='10';
            weightInput.dispatchEvent(new w.Event('input',{bubbles:true}));
            await wait(320);
            state=JSON.parse(w.localStorage.getItem('overload_v3'));
            weights=state.activeWorkout.exercises[0].sets.map(s=>Number(s.weight));
            assert.deepEqual(weights,[10,0,0],'partial multi-digit entry must remain isolated while the field has focus');

            weightInput.value='100';
            weightInput.dispatchEvent(new w.Event('input',{bubbles:true}));
            weightInput.blur();
            await wait(20);

            const liveWeights=w.eval('state.activeWorkout.exercises[0].sets.map(s=>Number(s.weight))');
            assert.deepEqual(liveWeights,[100,100,100],'blur should commit the finished multi-digit weight immediately in live state');

            await wait(260);
            state=JSON.parse(w.localStorage.getItem('overload_v3'));
            weights=state.activeWorkout.exercises[0].sets.map(s=>Number(s.weight));
            assert.deepEqual(weights,[100,100,100],'first-ever exercise weight should persist across all eligible working sets after commit');
            assert.equal(state.activeWorkout.exercises[0].firstWeightAutofillDone,true,'autofill should be one-time per exercise in the workout');

            // Changing the first set afterward must not keep rewriting the others.
            w.updateSet(0,0,'weight','165');
            await wait(380);
            state=JSON.parse(w.localStorage.getItem('overload_v3'));
            weights=state.activeWorkout.exercises[0].sets.map(s=>Number(s.weight));
            assert.deepEqual(weights,[165,100,100],'later edits should not cascade after the one-time seed');

            // Finish one set to create real exercise history.
            w.updateSet(0,0,'reps','8');
            w.toggleSet(0,0);
            w.finalizeWorkout(false);
            await wait(15);
            w.closeModal();

            // Start same exercise again. Existing history/recommendations must win:
            // editing Set 1 cannot propagate over other set recommendations.
            w.startRoutineFresh('seed_r');
            await wait(10);
            state=JSON.parse(w.localStorage.getItem('overload_v3'));
            const before=state.activeWorkout.exercises[0].sets.map(s=>Number(s.weight));
            assert(w.exerciseHasLoggedWeightHistory(ex.id),'completed historical set should disable first-time autofill');
            w.updateSet(0,0,'weight','175');
            await wait(380);
            state=JSON.parse(w.localStorage.getItem('overload_v3'));
            const after=state.activeWorkout.exercises[0].sets.map(s=>Number(s.weight));
            assert.equal(after[0],175);
            assert.deepEqual(after.slice(1),before.slice(1),'historical exercise weights must never be overwritten by autofill');

            // Warm-up input is intentionally excluded from propagation.
            w.eval(`state.activeWorkout=null;state.sessions=[];save()`);
            w.startRoutineFresh('seed_r');
            await wait(10);
            w.eval(`state.activeWorkout.exercises[0].sets.unshift({weight:0,reps:5,done:false,rir:'',type:'warmup',pr:''});saveActiveWorkout();renderWorkout()`);
            w.updateSet(0,0,'weight','75');
            await wait(380);
            state=JSON.parse(w.localStorage.getItem('overload_v3'));
            assert.equal(Number(state.activeWorkout.exercises[0].sets[1].weight)||0,0,'warm-up weight must not seed working sets');

            w.stopRestTimer();
            dom.window.close();
            console.log('Swole Cat V50.3 first-time weight autofill PASS');
          };
          run().catch(err=>{console.error(err);dom.window.close();process.exit(1)});
          JS


