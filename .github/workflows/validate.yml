            const active=w.coachActiveWorkoutFromDraft(draft);
            assert(active);
            const first=active.exercises.find(ex=>ex.config.autoWarmup);
            assert(first,'active workout should retain auto warmup metadata');
            const firstTypes=first.sets.map(set=>set.type);
            assert(firstTypes.includes('warmup'),'first compound should receive warm-up sets');
            const firstWorking=first.sets.filter(set=>set.type==='working');
            assert(firstWorking.length>=1);
            assert.equal(firstWorking.at(-1).amrap,true,'last working set should be marked AMRAP');
            assert.match(w.setDisplayLabel(first,first.sets.lastIndexOf(firstWorking.at(-1))),/AMRAP/);
            active.exercises.filter(ex=>ex!==first).forEach(ex=>{
              assert.equal(ex.sets.filter(set=>set.type==='warmup').length,0,'only first compound should auto-ramp');
            });

            const tank=w.coachParseLiftingGrammar('leave 3 reps in the tank and rest 90 seconds');
            assert.equal(tank.targetRIR,3);
            assert.equal(tank.restSeconds,90);

            const noGrammar=w.coachParsePrompt('45 minute chest workout','hypertrophy');
            const plainDraft=w.coachGenerateWorkout(noGrammar);
            const plainRoutine=w.coachDraftRoutine(plainDraft,'plain');
            assert(plainRoutine.exercises.every(ex=>ex.targetRIR==null||Number(ex.targetRIR)>=1),'ordinary Coach workouts may receive evidence-backed effort targets but must not silently become 0 RIR/failure workouts');
            assert(plainRoutine.exercises.every(ex=>!ex.autoWarmup),'warmups should only auto-insert when requested');
            assert(plainRoutine.exercises.every(ex=>!ex.lastSetAmrap),'AMRAP should only appear when requested');

            dom.window.close();
            console.log('Swole Cat V55.1 lifting grammar foundation PASS');
          };
          run().catch(err=>{console.error(err);dom.window.close();process.exit(1)});
