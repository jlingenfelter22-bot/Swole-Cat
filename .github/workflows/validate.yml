      - name: Smoke test V25 active workout structure
        run: |
          node <<'JS'
          const fs = require('fs');
          const assert = require('assert');
          const {JSDOM} = require('jsdom');

          const html = fs.readFileSync('index.html','utf8');
          const dom = new JSDOM(html,{
            runScripts:'dangerously',
            url:'https://swole-cat.test/',
            pretendToBeVisual:true,
            beforeParse(window){
              window.localStorage.setItem('overload_v3',JSON.stringify({ui:{onboardingDone:true,haptics:false,keepAwake:false}}));
              window.alert=()=>{};
              window.confirm=()=>true;
              window.scrollTo=()=>{};
            }
          });

          const wait = ms => new Promise(r=>setTimeout(r,ms));
          const read = () => JSON.parse(dom.window.localStorage.getItem('overload_v3'));

          const run = async () => {
            await wait(30);
            const w=dom.window;
            if(w.HTMLElement)w.HTMLElement.prototype.scrollIntoView=()=>{};

            w.installRegressionFixturePlan();
            let state=read();
            const rid=state.routines[0].id;
            const originalOrder=state.routines[0].exercises.map(e=>e.exerciseId);
            const originalCount=originalOrder.length;

            // Today-only structural edits must not rewrite the saved routine.
            w.openRoutine(rid);
            w.moveWorkoutExercise(0,1);
            w.toggleSkipWorkoutExercise(1);
            state=read();
            assert.equal(state.activeWorkout.structureDirty,true,'reordering should mark the workout structure changed');
            assert.equal(state.activeWorkout.exercises[1].skipped,true,'exercise should be skippable for today');
            const skippedId=state.activeWorkout.exercises[1].exerciseId;

            const removedTodayId=state.activeWorkout.exercises[2].exerciseId;
            w.removeWorkoutExercise(2);
            w.runConfirmedAction();
            state=read();
            assert.equal(state.activeWorkout.exercises.length,originalCount-1,'exercise should be removable from today');
            assert.deepEqual(state.routines[0].exercises.map(e=>e.exerciseId),originalOrder,'today-only edits must not rewrite routine');

            w.finalizeWorkout(false);
            state=read();
            assert.equal(state.activeWorkout,null,'today-only workout should finish normally');
            assert.deepEqual(state.routines[0].exercises.map(e=>e.exerciseId),originalOrder,'finishing today-only must preserve routine');
            assert(state.sessions[0].exercises.some(e=>e.exerciseId===skippedId && e.skipped),'skipped status should be recorded in that session');
            assert(!state.sessions[0].exercises.some(e=>e.exerciseId===removedTodayId),'removed today exercise should not enter session');
            w.closeModal();

            // A second workout can explicitly promote structural edits to the routine.
            w.openRoutine(rid);
            w.moveWorkoutExercise(0,1);
            w.toggleSkipWorkoutExercise(1);
            state=read();
            const skippedSavedId=state.activeWorkout.exercises[1].exerciseId;

            const beforeWorking=state.activeWorkout.exercises[0].sets.filter(s=>(s.type||'working')==='working').length;
            w.addWorkoutSet(0,'working');
            state=read();
            const afterWorking=state.activeWorkout.exercises[0].sets.filter(s=>(s.type||'working')==='working').length;
            assert.equal(afterWorking,beforeWorking+1,'working set should be addable');

            const removedSavedId=state.activeWorkout.exercises[2].exerciseId;
            w.removeWorkoutExercise(2);
            w.runConfirmedAction();
            state=read();
            const activeOrder=state.activeWorkout.exercises.map(e=>e.exerciseId);
            assert.equal(state.activeWorkout.structureDirty,true,'routine-update candidate should remain dirty until explicitly saved');

            w.finalizeWorkout(true);
            state=read();
            assert.deepEqual(state.routines[0].exercises.map(e=>e.exerciseId),activeOrder,'Finish + Update Routine should save active order and removals');
            assert(state.routines[0].exercises.some(e=>e.exerciseId===skippedSavedId),'skipped exercise must remain in saved routine');
            assert(!state.routines[0].exercises.some(e=>e.exerciseId===removedSavedId),'removed exercise should leave routine when update is chosen');
            assert.equal(state.routines[0].exercises[0].sets,afterWorking,'working-set count change should save to routine');
            assert.equal(state.sessions.length,2,'both structure test workouts should be saved');

            dom.window.close();
            console.log('Swole Cat V25 structure smoke test PASS');
          };
          run().catch(err=>{console.error(err);dom.window.close();process.exit(1)});
          JS


      - name: Smoke test V26 programs
        run: |
          node <<'JS'
          const fs = require('fs');
          const assert = require('assert');
          const {JSDOM} = require('jsdom');

          const html = fs.readFileSync('index.html','utf8');
          const dom = new JSDOM(html,{
            runScripts:'dangerously',
            url:'https://swole-cat.test/',
            pretendToBeVisual:true,
            beforeParse(window){
              window.localStorage.setItem('overload_v3',JSON.stringify({ui:{onboardingDone:true,haptics:false,keepAwake:false}}));
              window.alert=()=>{};
              window.confirm=()=>true;
              window.scrollTo=()=>{};
            }
          });

          const wait = ms => new Promise(r=>setTimeout(r,ms));
          const read = () => JSON.parse(dom.window.localStorage.getItem('overload_v3'));

          const run = async () => {
            await wait(30);
            const w=dom.window;
            if(w.HTMLElement)w.HTMLElement.prototype.scrollIntoView=()=>{};

            // Starter now installs A/B/C as one active program.
            w.installRegressionFixturePlan();
            let state=read();
            assert.equal(state.routines.length,3,'starter should create three routines');
            assert.equal(state.programs.length,1,'starter should create one program');
            assert.equal(state.activeProgramId,state.programs[0].id,'starter program should become active');
            const pid=state.programs[0].id;
            const [a,b,c]=state.programs[0].routineIds;
            assert.equal(state.programs[0].nextIndex,0,'program should begin at Workout A');

            // Start A from the program and finish it.
            w.startProgramWorkout(pid);
            state=read();
            assert.equal(state.activeWorkout.routineId,a,'program should start Workout A');
            assert.equal(state.activeWorkout.programId,pid,'active workout should retain program id');
            w.updateSet(0,0,'weight','100');w.updateSet(0,0,'reps','8');w.toggleSet(0,0);w.stopRestTimer();
            w.finalizeWorkout(false);
            state=read();
            assert.equal(state.programs[0].nextIndex,1,'finishing A should advance to B');
            assert.equal(state.sessions[0].programId,pid,'finished program session should retain program id');
            w.closeModal();

            // Start B and finish it, then C becomes next.
            w.startProgramWorkout(pid);
            state=read();
            assert.equal(state.activeWorkout.routineId,b,'program should start Workout B next');
            w.updateSet(0,0,'weight','100');w.updateSet(0,0,'reps','8');w.toggleSet(0,0);w.stopRestTimer();
            w.finalizeWorkout(false);
            state=read();
            assert.equal(state.programs[0].nextIndex,2,'finishing B should advance to C');
            w.closeModal();

            // A manual routine start should not alter program sequencing.
            w.openRoutine(a);
            state=read();
            assert.equal(state.activeWorkout.programId,null,'manual routine should not be tagged as a program workout');
            w.updateSet(0,0,'weight','100');w.updateSet(0,0,'reps','8');w.toggleSet(0,0);w.stopRestTimer();
            w.finalizeWorkout(false);
            state=read();
            assert.equal(state.programs[0].nextIndex,2,'manual workout must not advance program');
            w.closeModal();

            // Finish C and ensure rotation wraps back to A.
            w.startProgramWorkout(pid);
            state=read();
            assert.equal(state.activeWorkout.routineId,c,'program should still be waiting on C');
            w.updateSet(0,0,'weight','100');w.updateSet(0,0,'reps','8');w.toggleSet(0,0);w.stopRestTimer();
            w.finalizeWorkout(false);
            state=read();
            assert.equal(state.programs[0].nextIndex,0,'program should wrap back to A after C');
            assert.equal(state.sessions.filter(s=>s.programId===pid).length,3,'program should count only program-launched sessions');
            w.closeModal();

            // Deleting a program must preserve routines and history.
            const routinesBefore=state.routines.length;
            const sessionsBefore=state.sessions.length;
            w.deleteProgram(pid);w.runConfirmedAction();
            state=read();
            assert.equal(state.programs.length,0,'program should be deletable');
            assert.equal(state.routines.length,routinesBefore,'deleting program must preserve routines');
            assert.equal(state.sessions.length,sessionsBefore,'deleting program must preserve history');
            assert.equal(state.activeProgramId,null,'deleting active program should clear active program id');

            // Custom program builder should allow a user-defined A/B rotation and preserve its order.
            w.newProgram();
            w.document.getElementById('programName').value='Custom AB';
            w.document.getElementById('programFrequency').value='2';
            w.addProgramRoutine(a);
            w.addProgramRoutine(b);
            w.toggleProgramDay(2);
            w.toggleProgramDay(4);
            w.saveProgram();
            state=read();
            assert.equal(state.programs.length,1,'custom program should save');
            assert.equal(state.programs[0].name,'Custom AB','custom program name should save');
            assert.deepEqual(state.programs[0].routineIds,[a,b],'custom program order should save');
            assert.equal(state.programs[0].frequency,2,'custom program frequency should save');
            assert.deepEqual(state.programs[0].preferredDays,[2,4],'preferred training days should save');
            assert.equal(state.activeProgramId,state.programs[0].id,'first custom program should become active');

            dom.window.close();
            console.log('Swole Cat V26 program smoke test PASS');
          };
          run().catch(err=>{console.error(err);dom.window.close();process.exit(1)});
          JS


      - name: Smoke test V27 exercise preferences
        run: |
          node <<'JS'
          const fs = require('fs');
          const assert = require('assert');
          const {JSDOM} = require('jsdom');

          const html = fs.readFileSync('index.html','utf8');
          const dom = new JSDOM(html,{
            runScripts:'dangerously',
            url:'https://swole-cat.test/',
            pretendToBeVisual:true,
            beforeParse(window){
              window.localStorage.setItem('overload_v3',JSON.stringify({ui:{onboardingDone:true,haptics:false,keepAwake:false}}));
              window.alert=()=>{};
              window.confirm=()=>true;
              window.scrollTo=()=>{};
              window.fetch=()=>Promise.reject(new Error('offline test'));
            }
          });

          const wait = ms => new Promise(r=>setTimeout(r,ms));
          const read = () => JSON.parse(dom.window.localStorage.getItem('overload_v3'));

          const run = async () => {
            await wait(30);
            const w=dom.window;
            if(w.HTMLElement)w.HTMLElement.prototype.scrollIntoView=()=>{};

            w.installRegressionFixturePlan();
            let state=read();
            const bench=w.exById('lib_0');
            const dbBench=w.allExercises().find(x=>x.name==='Dumbbell Bench Press');
            const machine=w.allExercises().find(x=>x.name==='Chest Press Machine');
            const pushup=w.allExercises().find(x=>x.name==='Push-Up');
            const squat=w.allExercises().find(x=>x.name==='Back Squat');
            assert(bench&&dbBench&&machine&&pushup&&squat,'expected library exercises should exist');

            // Preference state persists.
            w.setExercisePreference(dbBench.id,'prefer');
            w.setExercisePreference(machine.id,'avoid');
            w.setExercisePreference(pushup.id,'hide');
            w.toggleFavorite(dbBench.id);
            state=read();
            assert.equal(state.exercisePreferences[dbBench.id],'prefer','Prefer should persist');
            assert.equal(state.exercisePreferences[machine.id],'avoid','Avoid should persist');
            assert.equal(state.exercisePreferences[pushup.id],'hide','Hide should persist');
            assert(state.favorites.includes(dbBench.id),'favorite should remain independent of preference');

            // Hidden exercises leave normal browsing and substitution suggestions.
            assert(!w.visibleExercises().some(x=>x.id===pushup.id),'hidden exercise should not be in visible exercise pool');
            let subs=w.recommendedSubs(bench.id);
            assert(!subs.some(row=>row.x.id===pushup.id),'hidden exercise should be excluded from substitutions');
            const preferPos=subs.findIndex(row=>row.x.id===dbBench.id);
            const avoidPos=subs.findIndex(row=>row.x.id===machine.id);
            assert(preferPos>=0&&avoidPos>=0,'preferred and avoided compatible substitutions should remain available');
            assert(preferPos<avoidPos,'preferred substitute should rank above avoided substitute');

            // Hidden filter remains a recovery path.
            w.go('exercises');
            w.setExerciseHistoryFilter('all');
            assert(!w.document.getElementById('exerciseList').innerHTML.includes("openExerciseProgress('"+pushup.id+"')"),'All should exclude hidden exercises');
            w.setExerciseHistoryFilter('hidden');
            assert(w.document.getElementById('exerciseList').innerHTML.includes("openExerciseProgress('"+pushup.id+"')"),'Hidden filter should expose hidden exercises for management');

            // Hiding an exercise must not delete it from an existing routine or stop that routine from starting.
            const routine=state.routines.find(r=>r.name==='Fixture Full Body A');
            assert(routine.exercises.some(e=>e.exerciseId===squat.id),'fixture routine should contain Back Squat');
            w.setExercisePreference(squat.id,'hide');
            state=read();
            assert(state.routines.find(r=>r.name==='Fixture Full Body A').exercises.some(e=>e.exerciseId===squat.id),'Hide must not remove exercise from saved routine');
            w.openRoutine(routine.id);
            state=read();
            assert(state.activeWorkout.exercises.some(e=>e.exerciseId===squat.id),'hidden routine exercise should still load in active workout');
            w.cancelWorkout();w.runConfirmedAction();

            // Neutral restores normal visibility.
            w.setExercisePreference(pushup.id,'neutral');
            state=read();
            assert(!state.exercisePreferences[pushup.id],'Neutral should clear stored preference');
            assert(w.visibleExercises().some(x=>x.id===pushup.id),'neutral exercise should return to normal browsing');

            dom.window.close();
            console.log('Swole Cat V27 exercise preference smoke test PASS');
          };
          run().catch(err=>{console.error(err);dom.window.close();process.exit(1)});
          JS


      - name: Smoke test V28 progress dashboard
        run: |
          node <<'JS'
          const fs = require('fs');
          const assert = require('assert');
          const {JSDOM} = require('jsdom');

          const html = fs.readFileSync('index.html','utf8');
          const dom = new JSDOM(html,{
            runScripts:'dangerously',
            url:'https://swole-cat.test/',
            pretendToBeVisual:true,
            beforeParse(window){
              window.localStorage.setItem('overload_v3',JSON.stringify({ui:{onboardingDone:true,haptics:false,keepAwake:false}}));
              window.alert=()=>{};
              window.confirm=()=>true;
              window.scrollTo=()=>{};
              window.fetch=()=>Promise.reject(new Error('offline test'));
            }
          });

          const wait = ms => new Promise(r=>setTimeout(r,ms));
          const read = () => JSON.parse(dom.window.localStorage.getItem('overload_v3'));

          const run = async () => {
            await wait(30);
            const w=dom.window;
            if(w.HTMLElement)w.HTMLElement.prototype.scrollIntoView=()=>{};

            w.installRegressionFixturePlan();
            let state=read();
            const routine=state.routines.find(r=>r.name==='Fixture Full Body A');
            const squat=w.allExercises().find(x=>x.name==='Back Squat');
            assert(routine&&squat,'fixture routine and squat should exist');

            // Establish a baseline workout.
            w.openRoutine(routine.id);
            let active=read().activeWorkout;
            const squatIndex=active.exercises.findIndex(e=>e.exerciseId===squat.id);
            assert(squatIndex>=0,'Back Squat should be in workout');
            w.updateSet(squatIndex,0,'weight','100');
