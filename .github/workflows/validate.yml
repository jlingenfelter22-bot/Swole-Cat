              window.scrollTo=()=>{};
            }
          });

          const wait=ms=>new Promise(r=>setTimeout(r,ms));
          const read=()=>JSON.parse(dom.window.localStorage.getItem('overload_v3'));

          const run=async()=>{
            await wait(35);
            const w=dom.window;
            if(w.HTMLElement)w.HTMLElement.prototype.scrollIntoView=()=>{};

            w.installStarterPlan();
            let state=read();
            const rid=state.routines[0].id;
            assert.equal(state.routines[0].trainingMode,'guided','legacy/default routines should normalize to guided');

            // Guided overload keeps the existing rep-first progression behavior.
            state.routines[0].trainingMode='guided';
            w.eval('state.routines[0].trainingMode="guided";save()');
            w.openRoutine(rid);
            state=read();
            assert.equal(state.activeWorkout.trainingMode,'guided');
            w.updateSet(0,0,'weight','100');w.updateSet(0,0,'reps','8');w.toggleSet(0,0);w.stopRestTimer();
            w.updateSet(0,1,'weight','100');w.updateSet(0,1,'reps','8');w.toggleSet(0,1);w.stopRestTimer();
            w.updateSet(0,2,'weight','100');w.updateSet(0,2,'reps','8');w.toggleSet(0,2);w.stopRestTimer();
            w.finalizeWorkout(false);w.closeModal();

            w.openRoutine(rid);
            state=read();
            assert(state.activeWorkout.exercises[0].sets.slice(0,3).every(s=>Number(s.reps)===9),'guided mode should add one rep to each set before load');
            w.cancelWorkout();w.runConfirmedAction();

            // Strength Focus prioritizes the configured load step after minimum reps are owned.
            w.eval('state.routines[0].trainingMode="strength";save()');
            w.openRoutine(rid);
            state=read();
            assert.equal(state.activeWorkout.trainingMode,'strength');
            const strengthSets=state.activeWorkout.exercises[0].sets.slice(0,3);
            assert(strengthSets.every(s=>Number(s.weight)===105),'strength mode should add one configured load step after all sets met the minimum');
            assert(strengthSets.every(s=>Number(s.reps)===6),'strength mode should reset to the programmed minimum reps');
            w.cancelWorkout();w.runConfirmedAction();

            // Track Only carries history forward but does not create a progression target or coach.
            w.eval('state.routines[0].trainingMode="track";save()');
            w.openRoutine(rid);
            state=read();
            assert.equal(state.activeWorkout.trainingMode,'track');
            const track=state.activeWorkout.exercises[0];
            assert.equal(track.config.routineMode,'track');
            const prev=w.previousExercise(track.exerciseId);
            const rec=w.buildRecommendation(track.config,prev,track.exerciseId);
            assert.equal(rec.status,'track','track-only recommendation should be reference-only');
            assert.match(rec.detail,/No automatic progression target/i);
            assert.equal(w.coachSignal(track.exerciseId,track.config),null,'track-only should suppress coach recommendations');

            // Routine editor persists mode changes.
            w.cancelWorkout();w.runConfirmedAction();
            w.editRoutineDetails(rid);
            const select=w.document.getElementById('routineEditorTrainingMode');
            assert(select,'routine editor should expose training mode');
            select.value='strength';
            w.saveRoutineMeta(rid);
            state=read();
            assert.equal(state.routines[0].trainingMode,'strength','routine mode should persist');
            w.closeModal();

            // Program override should supersede the routine mode only for program-launched workouts.
            const pid=state.programs[0].id;
            w.newProgram(pid);
            const programMode=w.document.getElementById('programTrainingMode');
            assert(programMode,'program editor should expose a training mode override');
            programMode.value='track';
            w.saveProgram();
            w.startProgramWorkout(pid);
            state=read();
            assert.equal(state.activeWorkout.trainingMode,'track','program launch should use the program override');
            assert.equal(state.activeWorkout.exercises[0].config.routineMode,'track','program override should reach exercise config');
            w.cancelWorkout();w.runConfirmedAction();

            // A manual launch of the same routine still uses the routine's own mode.
            w.openRoutine(rid);
            state=read();
            assert.equal(state.activeWorkout.trainingMode,'strength','manual routine launch should ignore the program override');

            dom.window.close();
            console.log('Swole Cat V31 training modes smoke test PASS');
          };
          run().catch(err=>{console.error(err);dom.window.close();process.exit(1)});
