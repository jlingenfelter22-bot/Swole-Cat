            w.go('exercises');
            w.go('history');
            w.go('exercises');
            assert.equal(exerciseRenders,1,'unchanged exercise view should reuse its rendered DOM');

            // A real state save invalidates the cached view.
            w.installRegressionFixturePlan();
            w.go('home');
            w.go('exercises');
            await wait(25);
            assert.equal(exerciseRenders,2,'state changes should refresh cached navigation views on the next frame');

            // Continuous typing should remain in memory briefly, then autosave.
            const state=JSON.parse(w.localStorage.getItem('overload_v3'));
            w.openRoutine(state.routines[0].id);
            await wait(10);
            const beforeWeight=JSON.parse(w.localStorage.getItem('overload_v3')).activeWorkout.exercises[0].sets[0].weight;
            w.updateSet(0,0,'weight','123');
            const immediateWeight=JSON.parse(w.localStorage.getItem('overload_v3')).activeWorkout.exercises[0].sets[0].weight;
            assert.equal(immediateWeight,beforeWeight,'continuous input should not synchronously rewrite local storage');
            await wait(270);
            const persistedWeight=JSON.parse(w.localStorage.getItem('overload_v3')).activeWorkout.exercises[0].sets[0].weight;
            assert.equal(Number(persistedWeight),123,'batched autosave should persist shortly after input settles');

            // Navigation should paint first instead of forcing a synchronous storage flush.
            w.updateSet(0,0,'reps','11');
            const repsBeforeNav=JSON.parse(w.localStorage.getItem('overload_v3')).activeWorkout.exercises[0].sets[0].reps;
            w.go('home');
            const repsImmediatelyAfterNav=JSON.parse(w.localStorage.getItem('overload_v3')).activeWorkout.exercises[0].sets[0].reps;
            assert.equal(Number(repsImmediatelyAfterNav),Number(repsBeforeNav),'navigation should not block on pending storage writes');
            await wait(270);
            const repsAfterDebounce=JSON.parse(w.localStorage.getItem('overload_v3')).activeWorkout.exercises[0].sets[0].reps;
            assert.equal(Number(repsAfterDebounce),11,'pending workout edits should still persist after navigation');

            // Focus Mode micro-steps should update the live field without rebuilding the workout.
            w.resumeActiveWorkout();
            await wait(10);
            let workoutRenders=0;
            const originalRenderWorkout=w.renderWorkout;
            w.renderWorkout=function(){workoutRenders++;return originalRenderWorkout()};
            const weightInput=w.document.querySelector('.focus-set-card[data-set-index="0"] input[aria-label="weight"]');
            assert(weightInput,'Focus Mode should expose the active set weight field');
            const beforeStep=Number(weightInput.value||0);
            w.changeSetValue(0,0,'weight',5);
            assert.equal(workoutRenders,0,'weight micro-step should not rerender the entire workout');
            assert.equal(Number(weightInput.value),beforeStep+5,'weight micro-step should repaint the affected input immediately');

            // Moving between focused sets should rebuild the one Focus canvas exactly once, not run a legacy accordion repaint path.
            w.selectWorkoutSet(0,1);
            assert.equal(workoutRenders,1,'changing focused set should render the Focus canvas exactly once');
            assert.equal(w.document.querySelector('.focus-set-card')?.dataset.setIndex,'1','Focus Mode should display the selected set');

            assert(html.includes('content-visibility:auto'),'long lists should use offscreen rendering containment');
            assert(html.includes('.native-app nav'),'native navigation should have Android-specific paint tuning');
            assert(html.includes('backdrop-filter:none!important'),'native dock blur should be disabled for cheaper paint');

            dom.window.close();
            console.log('Swole Cat V41 performance behavior PASS');
          };
          run().catch(err=>{console.error(err);dom.window.close();process.exit(1)});
