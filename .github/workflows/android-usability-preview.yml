name: Coach Android Usability Preview (Unpublished)
on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/android-usability-preview.yml"
      - "src/js/04d-coach-program-builder.js"
      - "src/styles/03-polish.css"
      - "scripts/coach-phase3-mobile-usability-stress.mjs"
permissions:
  contents: read
jobs:
  preview:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'quality/coach-phase3-bounded-week-repair-v0934'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Prepare unreleased version in CI runner only
        run: |
          node <<'NODE'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync('package.json','utf8'));
          if(p.version!=='0.93.4'||p.swoleCat?.androidVersionCode!==139)
            throw Error('Review version bump against stable Testing baseline');
          p.version='0.93.5-preview.1';
          p.swoleCat.androidVersionCode=140;
          fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n');
          NODE
      - name: Build WebView bundle
        run: npm run build:web
      - name: Install DOM smoke-test dependency
        run: npm install --no-save --package-lock=false jsdom@24

      - name: Prepare bundled DOM smoke-test fixture
        run: |
          node <<'JS'
          const fs=require('fs');
          let html=fs.readFileSync('www/index.html','utf8');
          const css=fs.readFileSync('www/app.css','utf8').replace(/<\/style/gi,'<\\/style');
          const js=fs.readFileSync('www/app.js','utf8').replace(/<\/script/gi,'<\\/script');
          const testRuntime=fs.readFileSync('scripts/test-runtime-fixture.js','utf8').replace(/<\/script/gi,'<\\/script');
          html=html.replace('<link rel="stylesheet" href="./app.css">',()=>`<style>${css}</style>`);
          html=html.replace('<script src="./app.js"></script>',()=>`<script>${js}</script><script>${testRuntime}</script>`);
          fs.writeFileSync('/tmp/swole-cat-test.html',html);
          JS

      - name: Run Coach mobile preview interaction checks
        run: |
          node --check www/app.js
          node scripts/coach-phase3-recommendation-preview-stress.mjs
          node scripts/coach-phase3-mobile-usability-stress.mjs
      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Install Android API 36
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Check signing inputs before build
        env:
          STORE: ${{ secrets.SWOLE_CAT_TESTING_STORE_PASSWORD }}
          ALIAS: ${{ secrets.SWOLE_CAT_TESTING_KEY_ALIAS }}
          PASS: ${{ secrets.SWOLE_CAT_TESTING_KEY_PASSWORD }}
          KEYSTORE: ${{ secrets.SWOLE_CAT_TESTING_KEYSTORE_B64 }}
        run: |
          test -n "$STORE" && test -n "$ALIAS" && test -n "$PASS" && test -n "$KEYSTORE"
      - name: Prepare Android without releasing
        run: npm run android:prepare
      - name: Unpack original permanent Testing signing key
        env:
          KEYSTORE: ${{ secrets.SWOLE_CAT_TESTING_KEYSTORE_B64 }}
        run: |
          printf '%s' "$KEYSTORE" | base64 --decode > android/app/swole-cat-testing.jks
          test -s android/app/swole-cat-testing.jks
      - name: Configure persistent Testing signature
        env:
          SWOLE_CAT_ENABLE_SIGNING: "1"
          SWOLE_CAT_SIGNING_BUILD_TYPE: "debug"
          SWOLE_CAT_SIGNING_STORE_FILE: "swole-cat-testing.jks"
          SWOLE_CAT_SIGNING_STORE_PASSWORD: ${{ secrets.SWOLE_CAT_TESTING_STORE_PASSWORD }}
          SWOLE_CAT_SIGNING_KEY_ALIAS: ${{ secrets.SWOLE_CAT_TESTING_KEY_ALIAS }}
          SWOLE_CAT_SIGNING_KEY_PASSWORD: ${{ secrets.SWOLE_CAT_TESTING_KEY_PASSWORD }}
        run: node scripts/configure-android.mjs
      - name: Check package and isolated preview version
        run: |
          grep -F 'applicationId "com.jlingenfelter.swolecat.testing"' android/app/build.gradle
          grep -Eq 'versionCode[[:space:]]+140' android/app/build.gradle
          grep -Eq 'versionName[[:space:]]+"0.93.5-preview.1"' android/app/build.gradle
          grep -F "const APP_VERSION='0.93.5-preview.1';" www/app.js
      - name: Assemble signed preview APK
        working-directory: android
        env:
          SWOLE_CAT_ENABLE_SIGNING: "1"
          SWOLE_CAT_SIGNING_BUILD_TYPE: "debug"
          SWOLE_CAT_SIGNING_STORE_FILE: "swole-cat-testing.jks"
          SWOLE_CAT_SIGNING_STORE_PASSWORD: ${{ secrets.SWOLE_CAT_TESTING_STORE_PASSWORD }}
          SWOLE_CAT_SIGNING_KEY_ALIAS: ${{ secrets.SWOLE_CAT_TESTING_KEY_ALIAS }}
          SWOLE_CAT_SIGNING_KEY_PASSWORD: ${{ secrets.SWOLE_CAT_TESTING_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
      - name: Verify exact signing certificate
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs \
            android/app/build/outputs/apk/debug/app-debug.apk | tee preview-signing.txt
          grep -Fi 'Signer #1 certificate SHA-256 digest: d53f277c5b92311d78e9eb3bdb692ad489734797f2430827400213f38b7cee53' preview-signing.txt
          cp android/app/build/outputs/apk/debug/app-debug.apk swole-cat-coach-preview-v0.93.5-preview.1.apk
          sha256sum swole-cat-coach-preview-v0.93.5-preview.1.apk > preview-sha256.txt
      - name: Upload preview APK to PR CI artifacts ONLY
        uses: actions/upload-artifact@v4
        with:
          name: Coach-Android-Usability-Signed-Preview-Unpublished
          path: |
            swole-cat-coach-preview-v0.93.5-preview.1.apk
            preview-signing.txt
            preview-sha256.txt
          retention-days: 14
          if-no-files-found: error
