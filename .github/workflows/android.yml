name: Build Swole Cat Android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "manifest.webmanifest"
      - "icon-192.svg"
      - "icon-512.svg"
      - "sw.js"
      - "package.json"
      - "capacitor.config.json"
      - "scripts/**"
      - ".github/workflows/android.yml"

permissions:
  contents: read

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Capacitor
        run: npm install --no-audit --no-fund

      - name: Build bundled web app
        run: npm run build:web

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Generate Android project
        run: npx cap add android

      - name: Sync Swole Cat into Android
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Name APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk swole-cat-debug.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Swole-Cat-Android-debug
          path: swole-cat-debug.apk
          if-no-files-found: error
          retention-days: 30
