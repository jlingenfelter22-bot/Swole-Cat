name: Build Swole Cat Testing Android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "manifest.webmanifest"
      - "icon-192.svg"
      - "icon-512.svg"
      - "sw.js"
      - "assets/**"
      - "src/**"
      - "resources/**"
      - "package.json"
      - "capacitor.config.json"
      - "scripts/**"
      - ".github/workflows/android.yml"

permissions:
  contents: read

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Read app version
        id: meta
        run: |
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          echo "version_code=$(node -p "require('./package.json').swoleCat.androidVersionCode")" >> "$GITHUB_OUTPUT"

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android API 36
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --version
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Prepare Android project
        run: npm run android:prepare

      - name: Verify Android version metadata
        run: |
          grep -Eq "versionCode[[:space:]]+${{ steps.meta.outputs.version_code }}" android/app/build.gradle
          grep -Eq "versionName[[:space:]]+\"${{ steps.meta.outputs.version }}\"" android/app/build.gradle
          grep -F "const APP_VERSION='${{ steps.meta.outputs.version }}';" www/app.js
          grep -F 'android:scheme="com.jlingenfelter.swolecat.testing"' android/app/src/main/AndroidManifest.xml
          grep -F 'android:host="auth"' android/app/src/main/AndroidManifest.xml
          grep -F 'android:pathPrefix="/callback"' android/app/src/main/AndroidManifest.xml
          grep -F 'applicationId "com.jlingenfelter.swolecat.testing"' android/app/build.gradle
          grep -F '<string name="app_name">Swole Cat Testing</string>' android/app/src/main/res/values/strings.xml

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Name APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "swole-cat-testing-v${{ steps.meta.outputs.version }}-debug.apk"

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Swole-Cat-Testing-Android-v${{ steps.meta.outputs.version }}-debug
          path: swole-cat-testing-v${{ steps.meta.outputs.version }}-debug.apk
          if-no-files-found: error
          retention-days: 30
