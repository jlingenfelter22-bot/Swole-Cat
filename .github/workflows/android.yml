name: Build Swole Cat Android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "manifest.webmanifest"
      - "icon-192.svg"
      - "icon-512.svg"
      - "package.json"
      - "capacitor.config.json"
      - "scripts/**"
      - "assets/**"
      - ".github/workflows/android.yml"

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Install Capacitor dependencies
        run: npm install

      - name: Prepare web bundle
        run: npm run prepare:web

      - name: Create Android project
        run: npx cap add android

      - name: Sync Android project
        run: npx cap sync android

      - name: Generate Swole Cat Android icon and splash assets
        run: npm run android:assets

      - name: Build installable debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Name APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Swole-Cat-Android-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Swole-Cat-Android-Debug
          path: Swole-Cat-Android-debug.apk
          retention-days: 30
          if-no-files-found: error
