<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0b0d12" />
<link rel="manifest" href="manifest.webmanifest">
<title>Swole Cat</title>
<style>
  :root{
    --bg:#0b0d12; --panel:#121722; --panel2:#171d2a; --muted:#8992a6; --text:#f5f7fb;
    --accent:#8b5cf6; --accent2:#22c55e; --danger:#ef4444; --border:#252d3d; --input:#0f141e;
    --shadow:0 12px 30px rgba(0,0,0,.28);
  }
  *{box-sizing:border-box}
  body{margin:0;background:linear-gradient(180deg,#0b0d12 0%,#0e1118 100%);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  button,input,select,textarea{font:inherit}
  button{cursor:pointer}
  .app{max-width:760px;margin:auto;min-height:100vh;padding-bottom:92px}
  header{position:sticky;top:0;z-index:20;padding:18px 18px 12px;background:rgba(11,13,18,.92);backdrop-filter:blur(16px);border-bottom:1px solid rgba(255,255,255,.04)}
  .topline{display:flex;justify-content:space-between;align-items:center;gap:12px}
  .brand{font-weight:900;font-size:1.35rem;letter-spacing:.3px}
  .brand span{color:var(--accent)}
  .sub{color:var(--muted);font-size:.9rem;margin-top:3px}
  .pill{background:var(--panel2);border:1px solid var(--border);color:#d8deea;border-radius:999px;padding:8px 11px;font-size:.82rem}
  main{padding:18px}
  .view{display:none}.view.active{display:block}
  .hero{background:radial-gradient(circle at top right,rgba(139,92,246,.28),transparent 40%),var(--panel);border:1px solid var(--border);border-radius:24px;padding:20px;box-shadow:var(--shadow)}
  .eyebrow{color:#b7bfd0;font-size:.76rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
  h1{font-size:2rem;margin:8px 0 6px;line-height:1.05}
  h2{font-size:1.12rem;margin:0}
  .muted{color:var(--muted)}
  .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
  .btn{border:0;border-radius:14px;padding:13px 16px;font-weight:800;background:var(--accent);color:white}
  .btn.secondary{background:var(--panel2);border:1px solid var(--border);color:var(--text)}
  .btn.green{background:var(--accent2);color:#07110a}
  .btn.danger{background:rgba(239,68,68,.13);color:#fecaca;border:1px solid rgba(239,68,68,.3)}
  .btn.small{padding:8px 10px;border-radius:10px;font-size:.82rem}
  .section-title{display:flex;align-items:center;justify-content:space-between;margin:26px 2px 12px}
  .grid{display:grid;gap:12px}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:18px;padding:16px}
  .card.clickable:hover{border-color:#3b465d}
  .row{display:flex;justify-content:space-between;align-items:center;gap:12px}
  .exercise-name{font-weight:850;font-size:1.02rem}
  .tag{font-size:.72rem;padding:5px 8px;border-radius:999px;background:#1c2331;color:#bec7d9;border:1px solid #2a3448}
  .metric{font-size:1.45rem;font-weight:900;margin-top:5px}
  .metric small{font-size:.75rem;color:var(--muted);font-weight:700}
  .mini{font-size:.83rem;color:var(--muted)}
  .progress-bar{height:8px;background:#0d1119;border-radius:999px;overflow:hidden;margin-top:12px;border:1px solid #1f2634}
  .progress-bar > div{height:100%;background:linear-gradient(90deg,var(--accent),#c084fc);width:0}
  .empty{padding:24px;text-align:center;color:var(--muted);border:1px dashed #30384a;border-radius:18px}
  nav{position:fixed;bottom:0;left:0;right:0;background:rgba(12,15,21,.96);backdrop-filter:blur(18px);border-top:1px solid var(--border);z-index:50}
  nav .inner{max-width:760px;margin:auto;display:grid;grid-template-columns:repeat(5,1fr);padding:9px 8px calc(9px + env(safe-area-inset-bottom))}
  .navbtn{background:none;border:0;color:var(--muted);padding:8px 4px;font-size:.73rem;font-weight:750}
  .navbtn.active{color:white}
  .navbtn b{display:block;font-size:1.1rem;margin-bottom:2px}
  label{display:block;color:#c8d0de;font-size:.8rem;font-weight:800;margin-bottom:6px}
  input,select,textarea{width:100%;background:var(--input);color:var(--text);border:1px solid var(--border);border-radius:12px;padding:12px}
  textarea{min-height:80px;resize:vertical}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .field{margin-bottom:12px}
  .list-item{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid #202737}
  .list-item:last-child{border-bottom:0}
  .iconbox{width:42px;height:42px;border-radius:12px;background:#1c2331;display:grid;place-items:center;font-size:1.15rem;flex:0 0 auto}
  .grow{flex:1}
  .search{margin-bottom:12px}
  .workout-title{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
  .setrow{display:grid;grid-template-columns:44px 1fr 1fr 48px;gap:8px;align-items:center;margin-top:8px}
  .setnum{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:#20283a;font-weight:900;color:#d8deea}
  .setrow input{text-align:center;font-weight:850}
  .check{width:44px;height:44px;border-radius:12px;background:#172019;border:1px solid #28452f;color:#7ee29a;font-weight:900}
  .check.done{background:#22c55e;color:#07110a;border-color:#22c55e}
  .history-table{width:100%;border-collapse:collapse;margin-top:8px}
  .history-table td,.history-table th{padding:9px 5px;border-bottom:1px solid #222a39;text-align:left;font-size:.84rem}
  .history-table th{color:var(--muted);font-size:.72rem;text-transform:uppercase;letter-spacing:.08em}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.66);z-index:100;display:none;align-items:flex-end}
  .modal.open{display:flex}
  .sheet{width:100%;max-width:760px;margin:auto;background:#111722;border-radius:24px 24px 0 0;border:1px solid var(--border);padding:18px;max-height:88vh;overflow:auto}
  .sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
  .x{background:#1d2533;color:white;border:1px solid #303a4d;border-radius:10px;width:38px;height:38px}
  .notice{background:#161f2e;border:1px solid #273550;border-radius:14px;padding:12px;color:#c9d3e7;font-size:.86rem}
  .good{color:#7ee29a}.warn{color:#fbbf24}
  .targetbox{background:linear-gradient(180deg,rgba(139,92,246,.12),rgba(139,92,246,.04));border:1px solid rgba(139,92,246,.35);border-radius:14px;padding:12px;margin-top:12px}
  .lastline{color:#b8c1d3;font-size:.84rem;margin-top:6px;line-height:1.45}

  .picker-tools{position:sticky;top:-18px;z-index:4;background:#111722;padding:4px 0 10px}
  .picker-chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
  .picker-chips::-webkit-scrollbar{display:none}
  .chip{white-space:nowrap;background:#171e2b;border:1px solid #2a3448;color:#c7d0e0;border-radius:999px;padding:9px 12px;font-size:.8rem;font-weight:800}
  .chip.active{background:#312252;border-color:#754fd0;color:white}
  .category-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:10px}
  .category-card{background:#151c29;border:1px solid #283246;border-radius:16px;padding:14px;text-align:left;color:white}
  .category-card b{display:block;font-size:.98rem}
  .category-card span{display:block;color:var(--muted);font-size:.76rem;margin-top:4px}
  .picker-section{font-size:.72rem;text-transform:uppercase;letter-spacing:.11em;color:#929db1;font-weight:900;margin:16px 2px 8px}
  .favbtn{border:0;background:transparent;color:#6f788b;font-size:1.25rem;padding:7px;line-height:1}
  .favbtn.on{color:#fbbf24}
  .breadcrumb{display:flex;align-items:center;gap:7px;color:#b8c1d2;font-size:.82rem;margin:7px 0 10px}
  .breadcrumb button{border:0;background:none;color:#a78bfa;padding:0;font-weight:800}
  .pickcount{background:#262f42;color:#dce3ef;border-radius:999px;padding:5px 9px;font-size:.72rem;font-weight:900}


  .routine-edit-list{display:grid;gap:10px}
  .routine-edit-card{background:#141b27;border:1px solid #293347;border-radius:16px;padding:13px}
  .routine-edit-head{display:grid;grid-template-columns:42px 1fr auto;gap:10px;align-items:center}
  .orderbox{display:grid;gap:5px}
  .orderbtn{width:36px;height:30px;border-radius:9px;border:1px solid #303b50;background:#1b2332;color:white;font-weight:900}
  .routine-tools{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
  .routine-tools .btn{padding:8px 10px}
  .editor-summary{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
  .editor-summary .tag{font-size:.68rem}


  .workout-overview{background:linear-gradient(135deg,rgba(139,92,246,.18),rgba(34,197,94,.07)),var(--panel);border:1px solid var(--border);border-radius:20px;padding:15px;margin-bottom:14px}
  .workout-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
  .workout-stat{background:#101620;border:1px solid #252f42;border-radius:12px;padding:10px;text-align:center}
  .workout-stat b{display:block;font-size:1.05rem}.workout-stat span{color:var(--muted);font-size:.68rem;text-transform:uppercase;letter-spacing:.07em}
  .live-card{padding:0;overflow:hidden}
  .live-head{padding:15px 15px 12px;background:linear-gradient(180deg,rgba(255,255,255,.025),transparent)}
  .live-body{padding:0 15px 15px}
  .set-card{background:#0f151f;border:1px solid #273147;border-radius:15px;padding:10px;margin-top:10px}
  .set-card.completed{border-color:rgba(34,197,94,.45);background:rgba(34,197,94,.055)}
  .set-card.type-warmup{border-color:rgba(56,189,248,.26)}
  .set-card.type-drop{border-color:rgba(245,158,11,.28)}
  .set-card.type-failure{border-color:rgba(248,113,113,.3)}
  .set-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:8px}
  .set-title-wrap{display:flex;align-items:flex-start;gap:8px;min-width:0}
  .set-type-select{appearance:none;-webkit-appearance:none;border:1px solid #36435a;background:#171f2d;color:#dce5f2;border-radius:9px;padding:7px 24px 7px 8px;font-size:.7rem;font-weight:900;background-image:linear-gradient(45deg,transparent 50%,#9da8ba 50%),linear-gradient(135deg,#9da8ba 50%,transparent 50%);background-position:calc(100% - 12px) 50%,calc(100% - 8px) 50%;background-size:4px 4px,4px 4px;background-repeat:no-repeat}
  .set-card.type-warmup .set-type-select{border-color:rgba(56,189,248,.4);color:#bae6fd}
  .set-card.type-drop .set-type-select{border-color:rgba(245,158,11,.4);color:#fde68a}
  .set-card.type-failure .set-type-select{border-color:rgba(248,113,113,.42);color:#fecaca}
  .set-card-actions{display:flex;gap:4px;flex:0 0 auto}
  .set-icon-btn{width:30px;height:30px;padding:0;border:1px solid #303b50;background:#182130;color:#c7d0df;border-radius:8px;font-weight:950;display:grid;place-items:center}
  .set-icon-btn.danger{color:#fca5a5;border-color:rgba(248,113,113,.25)}
  .set-nonprogress-note{font-size:.7rem;color:#8f9aae;margin:3px 0 8px;line-height:1.35}
  .set-add-row{display:flex;gap:7px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
  .set-add-row::-webkit-scrollbar{display:none}
  .set-add-btn{white-space:nowrap;border:1px solid #303b50;background:#151d2a;color:#d2dae7;border-radius:10px;padding:8px 10px;font-size:.72rem;font-weight:850}
  .set-add-btn.working{border-color:rgba(139,92,246,.35);color:#ddd6fe}
  .set-add-btn.warmup{border-color:rgba(56,189,248,.3);color:#bae6fd}
  .set-add-btn.drop{border-color:rgba(245,158,11,.3);color:#fde68a}
  .set-add-btn.failure{border-color:rgba(248,113,113,.3);color:#fecaca}
  .superset-badge{display:inline-flex;align-items:center;gap:5px;border:1px solid rgba(244,114,182,.36);background:rgba(244,114,182,.09);color:#fbcfe8;border-radius:999px;padding:5px 8px;font-size:.66rem;font-weight:950;letter-spacing:.05em;white-space:nowrap}
  .superset-note{margin-top:9px;border:1px solid rgba(244,114,182,.24);background:rgba(244,114,182,.055);border-radius:11px;padding:8px 10px;color:#e5c9db;font-size:.76rem;line-height:1.35}
  .exercise-block.superset-member{box-shadow:inset 4px 0 0 var(--ex-accent),inset 0 3px 0 rgba(244,114,182,.55),0 10px 26px rgba(0,0,0,.16)}
  .exercise-block.skipped-exercise{opacity:.72;border-style:dashed!important}
  .exercise-block.skipped-exercise .live-head{background:linear-gradient(135deg,rgba(148,163,184,.07),transparent)}
  .exercise-status.skipped{border-color:rgba(148,163,184,.35);background:rgba(148,163,184,.08);color:#cbd5e1}
  .workout-structure-note{margin-top:10px;border:1px solid rgba(251,191,36,.3);background:rgba(251,191,36,.065);border-radius:12px;padding:10px 11px;color:#f5ddb0;font-size:.77rem;line-height:1.4}
  .workout-manage-list{display:grid;gap:9px;margin-top:12px}
  .workout-manage-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:9px;align-items:center;background:#121925;border:1px solid #293449;border-radius:14px;padding:10px}
  .workout-manage-row.skipped{opacity:.7;border-style:dashed}
  .workout-order-controls{display:grid;gap:4px}
  .workout-order-controls button{width:34px;height:29px;border:1px solid #344057;background:#1a2230;color:#e6ebf2;border-radius:8px;font-weight:950}
  .workout-manage-actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
  @media(max-width:480px){.workout-manage-row{grid-template-columns:auto minmax(0,1fr)}.workout-manage-actions{grid-column:1/-1;justify-content:stretch}.workout-manage-actions .btn{flex:1}}
  .set-reference{font-size:.76rem;color:#9da8ba}
  .set-target{font-size:.76rem;font-weight:850;color:#c4b5fd;background:rgba(139,92,246,.12);border:1px solid rgba(139,92,246,.28);border-radius:999px;padding:5px 8px}
  .live-entry{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,.9fr) 64px;gap:9px;align-items:end}
  .live-input-wrap label{font-size:.67rem;color:#8e99aa;text-transform:uppercase;letter-spacing:.06em;margin:0}
  .input-label-row{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:5px;min-height:24px}
  .micro-step{display:flex;gap:4px}
  .micro-step button{width:25px;height:25px;padding:0;border:1px solid #303a50;background:#1a2230;color:#cfd7e5;border-radius:7px;font-weight:950;font-size:.88rem;line-height:1}
  .direct-number{height:52px!important;border:1px solid #303b51!important;border-radius:13px!important;background:#0d131d!important;padding:7px 8px!important;text-align:center!important;font-size:1.28rem!important;font-weight:950!important;color:#f5f7fb!important;min-width:0}
  .direct-number:focus{outline:none;border-color:#8b5cf6!important;box-shadow:0 0 0 3px rgba(139,92,246,.14)}
  .direct-number::placeholder{color:#596579;font-weight:800;font-size:.9rem}
  .rir-small select{height:52px;padding:6px;text-align:center;font-weight:850}
  @media(max-width:390px){
    .live-entry{grid-template-columns:minmax(0,1.2fr) minmax(0,.85fr) 58px;gap:7px}
    .micro-step button{width:23px;height:23px}
    .direct-number{font-size:1.18rem!important}
  }
  .complete-set{width:100%;margin-top:8px;border:1px solid #31533a;background:#16241a;color:#8be7a3;border-radius:11px;padding:10px;font-weight:900}
  .complete-set.done{background:#22c55e;border-color:#22c55e;color:#07110a}
  .pr-banner{margin-top:8px;border-radius:10px;padding:8px 10px;background:rgba(251,191,36,.11);border:1px solid rgba(251,191,36,.3);color:#fde68a;font-size:.78rem;font-weight:800}
  .toolrow{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
  .toolchip{border:1px solid #303a50;background:#171f2d;color:#cdd5e4;border-radius:999px;padding:7px 10px;font-size:.74rem;font-weight:800}
  .plates{color:#cbd5e1;font-size:.76rem;margin-top:6px}
  .resttimer{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);z-index:80;background:#171d2a;border:1px solid #46526c;border-radius:18px;padding:10px 12px;box-shadow:var(--shadow);font-weight:900;display:none;width:min(94vw,520px)}
  .resttimer.show{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .rest-main{display:flex;align-items:baseline;gap:7px}.rest-main span{font-size:1.35rem}.rest-main small{color:var(--muted);font-size:.7rem;text-transform:uppercase;letter-spacing:.08em}
  .rest-actions{display:flex;gap:6px}.rest-actions button{border:1px solid #36425a;background:#20293a;color:#eef2f7;border-radius:10px;padding:8px 9px;font-weight:850}


  .stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  .stat-card{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:14px}
  .stat-card .big{font-size:1.55rem;font-weight:950;margin-top:3px}
  .stat-card .caption{color:var(--muted);font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;font-weight:800}
  .chart-card{background:var(--panel);border:1px solid var(--border);border-radius:18px;padding:15px;overflow:hidden}
  .barlist{display:grid;gap:10px;margin-top:12px}
  .barrow{display:grid;grid-template-columns:86px 1fr 36px;gap:9px;align-items:center;font-size:.78rem}
  .bartrack{height:9px;background:#0d121a;border:1px solid #222c3d;border-radius:999px;overflow:hidden}
  .barfill{height:100%;background:linear-gradient(90deg,#8b5cf6,#a78bfa);border-radius:999px}
  .weekbars{display:grid;grid-template-columns:repeat(8,1fr);gap:7px;height:120px;align-items:end;margin-top:12px}
  .weekcol{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:6px}
  .weekbar{width:100%;min-height:3px;border-radius:7px 7px 3px 3px;background:linear-gradient(180deg,#8b5cf6,#5b36b5)}
  .weeklabel{font-size:.62rem;color:var(--muted)}
  .spark{width:100%;height:130px;margin-top:10px;display:block}
  .metric-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
  .metric-mini{background:#101620;border:1px solid #252f42;border-radius:12px;padding:10px;text-align:center}
  .metric-mini b{display:block;font-size:1.05rem}.metric-mini span{font-size:.65rem;color:var(--muted);text-transform:uppercase}
  .summary-win{background:rgba(34,197,94,.08);border:1px solid rgba(34,197,94,.26);border-radius:14px;padding:12px;margin-top:10px}
  .summary-pr{background:rgba(251,191,36,.09);border:1px solid rgba(251,191,36,.3);border-radius:14px;padding:12px;margin-top:10px}
  .history-card-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px;padding-top:10px;border-top:1px solid #263044}
  .history-edit-exercise{background:#121925;border:1px solid #293449;border-radius:15px;padding:12px;margin-top:10px}
  .history-edit-set{display:grid;grid-template-columns:94px minmax(0,1fr) minmax(0,.8fr) 64px auto;gap:7px;align-items:end;margin-top:9px;padding-top:9px;border-top:1px solid #242e40}
  .history-edit-set select,.history-edit-set input{min-width:0}
  .history-edit-remove{height:42px;width:42px;padding:0;border-radius:10px}
  @media(max-width:520px){.history-edit-set{grid-template-columns:1fr 1fr}.history-edit-set .set-type-field{grid-column:1 / -1}.history-edit-remove{width:100%;height:42px}}
  .trend-up{color:#86efac}.trend-flat{color:#cbd5e1}.trend-down{color:#fca5a5}
  .exercise-link{cursor:pointer}.exercise-link:hover .exercise-name{text-decoration:underline}
  @media(min-width:680px){.stat-grid{grid-template-columns:repeat(4,1fr)}}


  .coachbox{margin-top:10px;border-radius:13px;padding:11px 12px;border:1px solid #2b3850;background:#121a27}
  .coachbox.good{border-color:rgba(34,197,94,.3);background:rgba(34,197,94,.06)}
  .coachbox.watch{border-color:rgba(251,191,36,.32);background:rgba(251,191,36,.07)}
  .coachbox.reset{border-color:rgba(248,113,113,.32);background:rgba(248,113,113,.07)}
  .coach-title{font-size:.75rem;font-weight:950;text-transform:uppercase;letter-spacing:.08em}
  .coach-text{font-size:.82rem;color:#c8d1df;margin-top:4px;line-height:1.4}
  .goalbadge{font-size:.68rem;font-weight:900;text-transform:uppercase;letter-spacing:.06em;border:1px solid #344058;background:#1a2231;color:#d8dfeb;border-radius:999px;padding:5px 8px}
  .override-note{margin-top:8px;color:#c4b5fd;font-size:.76rem;font-weight:850}
  .insight-list{display:grid;gap:9px}


  .navbtn{position:relative;transition:transform .15s ease,color .15s ease}
  .navbtn:active{transform:scale(.96)}

function freshState(){
 return {
   profile:{name:'',unit:'lb'},
   customExercises:[],
   routines:[],
   sessions:[],
   activeWorkout:null,
   favorites:[],
   bodyweight:[],
   ui:{onboardingDone:false,haptics:true,keepAwake:true},
   settings:{defaultMin:8,defaultMax:12,defaultSets:3,defaultIncrement:5}
 };
}
let state=load();

function load(){
 try{
   const base=freshState(),saved=JSON.parse(localStorage.getItem(LSKEY)||'{}');
   const merged=Object.assign(base,saved);
   merged.profile=Object.assign(base.profile,saved.profile||{});
   merged.settings=Object.assign(base.settings,saved.settings||{});
   merged.ui=Object.assign(base.ui,saved.ui||{});
   if((saved.routines?.length||0)||(saved.sessions?.length||0))merged.ui.onboardingDone=true;
   (merged.sessions||[]).forEach(session=>(session.exercises||[]).forEach(e=>(e.sets||[]).forEach(set=>{set.type=set.type||'working'})));
   if(merged.activeWorkout){
     merged.activeWorkout.status='active';
     merged.activeWorkout.lastSavedAt=merged.activeWorkout.lastSavedAt||merged.activeWorkout.startDate||new Date().toISOString();
     merged.activeWorkout.structureDirty=!!merged.activeWorkout.structureDirty;
     (merged.activeWorkout.exercises||[]).forEach(e=>{
       e.supersetId=e.supersetId||null;
       e.skipped=!!e.skipped;
       (e.sets||[]).forEach(set=>{set.type=set.type||'working'});
     });
   }
   return merged;
 } catch(e){ return freshState(); }
}
function save(){localStorage.setItem(LSKEY,JSON.stringify(state));}

let deferredInstallPrompt=null,wakeLock=null,confirmCallback=null,toastTimer=null;
function haptic(pattern=20){
 if(state.ui?.haptics!==false && navigator.vibrate)navigator.vibrate(pattern);
}
function showToast(msg){
 const el=document.getElementById('toast');if(!el)return;
 el.textContent=msg;el.classList.add('show');clearTimeout(toastTimer);
 toastTimer=setTimeout(()=>el.classList.remove('show'),1700);
}
function muscleChip(muscle){
 return `<span class="muscle-chip"><span class="muscle-dot"></span>${categoryIcon(muscle)} ${esc(muscle||'Other')}</span>`;
}
async function requestWakeLock(){
 if(state.ui?.keepAwake===false||!('wakeLock' in navigator))return;
 try{wakeLock=await navigator.wakeLock.request('screen');}catch(e){}
}
async function releaseWakeLock(){
 try{if(wakeLock)await wakeLock.release();}catch(e){} wakeLock=null;
}
function confirmAction(title,message,callback){
 confirmCallback=callback;
 openModal(title,`<div class="notice">${esc(message)}</div><div class="actions"><button class="btn danger" onclick="runConfirmedAction()">Confirm</button><button class="btn secondary" onclick="closeModal();confirmCallback=null">Cancel</button></div>`);
}
function runConfirmedAction(){
 const fn=confirmCallback;confirmCallback=null;closeModal();if(fn)fn();
}
function updateInstallButton(){
 const b=document.getElementById('installBtn');if(b)b.classList.toggle('show',!!deferredInstallPrompt);
}
async function installApp(){
 if(!deferredInstallPrompt){showToast('Install option is not available in this browser yet.');return;}
 deferredInstallPrompt.prompt();
 try{await deferredInstallPrompt.userChoice;}catch(e){}
 deferredInstallPrompt=null;updateInstallButton();
}

 openModal('Welcome to Swole Cat',`
 <div class="onboard-hero"><div class="onboard-logo">🐱</div><div class="eyebrow">LOCAL. FAST. YOURS.</div><h1 style="font-size:1.8rem;margin:7px 0">Train, log, progress.</h1><div class="muted">No account, no subscription, no cloud workout profile. Your training data stays on this device.</div></div>

function finishOnboarding(starter){
 state.profile.name=document.getElementById('onName').value.trim();
 state.profile.unit=document.getElementById('onUnit').value;
 state.ui.onboardingDone=true;save();closeModal();
 if(starter)installStarterPlan();
 renderHome();showToast('You’re ready to train.');
}

function allExercises(){return [...LIBRARY,...state.customExercises];}
function exById(id){return allExercises().find(x=>x.id===id);}
function fmtWeight(w){return `${Number(w||0)} ${state.profile.unit}`;}

function activeWorkoutCounts(w=state.activeWorkout){
 if(!w)return {total:0,done:0,pct:0,skipped:0,activeExercises:0};
 const active=(w.exercises||[]).filter(e=>!e.skipped);
 const total=active.reduce((n,e)=>n+(e.sets||[]).length,0);
 const done=active.reduce((n,e)=>n+(e.sets||[]).filter(s=>s.done).length,0);
 const skipped=(w.exercises||[]).filter(e=>e.skipped).length;
 return {total,done,pct:total?Math.round(done/total*100):0,skipped,activeExercises:active.length};
}
function markWorkoutStructureDirty(){
 if(!state.activeWorkout)return;
 state.activeWorkout.structureDirty=true;
 saveActiveWorkout();
}
function clearWorkoutStructureDirty(){
 if(!state.activeWorkout)return;
 state.activeWorkout.structureDirty=false;
 saveActiveWorkout();
}
function saveActiveWorkout(){
 if(state.activeWorkout){
   state.activeWorkout.status='active';
   state.activeWorkout.lastSavedAt=new Date().toISOString();
 }
 save();
}
function updateActiveWorkoutChrome(){
 const btn=document.getElementById('resumeWorkoutBtn');
 if(!btn)return;
 if(!state.activeWorkout){btn.classList.remove('show');return}
 const counts=activeWorkoutCounts();
 btn.textContent=`▶ ${counts.done}/${counts.total}`;
 btn.title=`Resume ${state.activeWorkout.routineName}`;
 btn.classList.add('show');
}
function resumeActiveWorkout(){
 if(!state.activeWorkout){showToast('No active workout');go('home');return}
 saveActiveWorkout();
 requestWakeLock();
 renderWorkout();
 go('workout');
 showToast('Workout resumed');
}
function startRoutineFresh(id){
 const r=state.routines.find(x=>x.id===id); if(!r)return;
 const now=new Date().toISOString();
 const active={
   id:uid(),routineId:id,routineName:r.name,startDate:now,status:'active',lastSavedAt:now,structureDirty:false,
   exercises:r.exercises.map((re,routineIndex)=>{
     const prev=previousExercise(re.exerciseId);
     const rec=buildRecommendation({...re,mode:re.mode==='range'?'double':re.mode},prev,re.exerciseId);
     return {exerciseId:re.exerciseId,routineIndex,config:{trainingGoal:'general',resetPercent:7.5,...re,mode:re.mode==='range'?'double':re.mode},targetOverride:null,supersetId:re.supersetGroup||null,skipped:false,expanded:routineIndex===0,sets:Array.from({length:re.sets},(_,i)=>({
       weight:rec.weights[i]??rec.weight??0,reps:rec.targetReps[i]??re.minReps,done:false,rir:'',type:'working'
     })),notes:''};
   })
 };
 state.activeWorkout=active;
 saveActiveWorkout();
 updateActiveWorkoutChrome();
 requestWakeLock();haptic([20,35,20]);renderWorkout();go('workout');showToast('Workout started');
}
function discardActiveAndStart(id){
 const next=state.routines.find(x=>x.id===id);if(!next)return;
 const oldName=state.activeWorkout?.routineName||'current workout';
 closeModal();
 confirmAction('Discard active workout?',`This permanently deletes the active ${oldName} draft and starts ${next.name}. Completed history is not affected.`,()=>{
   state.activeWorkout=null;save();updateActiveWorkoutChrome();startRoutineFresh(id);
 });
}

function go(id){
 haptic(8);
 if(state.activeWorkout)saveActiveWorkout();
 updateActiveWorkoutChrome();
 document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
 document.getElementById(id).classList.add('active');
 document.querySelectorAll('.navbtn').forEach(b=>b.classList.toggle('active',b.dataset.go===id));
 if(id==='home') renderHome();
 if(id==='routines') renderRoutines();
 if(id==='exercises') renderExercises();
 if(id==='history') renderHistory();
 if(id==='analytics') renderAnalytics();
 window.scrollTo({top:0,behavior:'smooth'});
}


function startOfWeek(d=new Date()){
 const x=new Date(d);x.setHours(0,0,0,0);const day=(x.getDay()+6)%7;x.setDate(x.getDate()-day);return x;
}
function sessionVolume(s){
 return s.exercises.reduce((sum,e)=>sum+completedSets(e).reduce((a,x)=>a+(Number(x.weight)||0)*(Number(x.reps)||0),0),0);
}
function sessionSetCount(s){return s.exercises.reduce((n,e)=>n+progressionSets(e).length,0)}
function sessionAllSetCount(s){return s.exercises.reduce((n,e)=>n+completedSets(e).length,0)}
function sessionPRCount(s){return s.exercises.reduce((n,e)=>n+(progressionSets(e).some(x=>x.pr)?1:0),0)}
function exerciseHistory(exerciseId){
 const arr=[];
 state.sessions.forEach(s=>s.exercises.forEach(e=>{
   if(e.exerciseId!==exerciseId)return;
   const working=progressionSets(e),all=completedSets(e);
   if(working.length)arr.push({date:s.date,routineName:s.routineName,sets:working,allSets:all,notes:e.notes||''});
 }));
 return arr.sort((a,b)=>a.date.localeCompare(b.date));
}
function exerciseMetrics(exerciseId){
 const h=exerciseHistory(exerciseId),sets=h.flatMap(x=>x.sets);
 const bestWeight=sets.length?Math.max(...sets.map(x=>Number(x.weight)||0)):0;
 const bestE1=sets.length?Math.max(...sets.map(x=>estimated1RM(x.weight,x.reps))):0;
 const bestVolume=h.length?Math.max(...h.map(x=>x.sets.reduce((a,s)=>a+(Number(s.weight)||0)*(Number(s.reps)||0),0))):0;
 const latest=h.at(-1),prior=h.at(-2);
 const latestE1=latest?Math.max(...latest.sets.map(x=>estimated1RM(x.weight,x.reps))):0;
 const priorE1=prior?Math.max(...prior.sets.map(x=>estimated1RM(x.weight,x.reps))):0;
 let trend='flat';
 if(priorE1 && latestE1>priorE1*1.01)trend='up';
 else if(priorE1 && latestE1<priorE1*.99)trend='down';
 return {history:h,sets,bestWeight,bestE1,bestVolume,latestE1,priorE1,trend};
}
function weeklyMuscleSets(){
 const start=startOfWeek(),counts={};
 state.sessions.filter(s=>new Date(s.date)>=start).forEach(s=>s.exercises.forEach(e=>{
   const ex=exById(e.exerciseId);if(!ex)return;
   counts[ex.muscle]=(counts[ex.muscle]||0)+progressionSets(e).length;
 }));
 return counts;
}
function lastEightWeeks(){
 const now=startOfWeek(),rows=[];
 for(let i=7;i>=0;i--){
   const start=new Date(now);start.setDate(start.getDate()-i*7);
   const end=new Date(start);end.setDate(end.getDate()+7);
   const sessions=state.sessions.filter(s=>{const d=new Date(s.date);return d>=start&&d<end});
   rows.push({label:`${start.getMonth()+1}/${start.getDate()}`,workouts:sessions.length,sets:sessions.reduce((a,s)=>a+sessionSetCount(s),0)});
 }
 return rows;
}
function svgLine(values,width=600,height=130){
 if(!values.length)return '';
 const pad=14,max=Math.max(...values),min=Math.min(...values),range=Math.max(1,max-min);
 const points=values.map((v,i)=>{
   const x=pad+(width-pad*2)*(values.length===1?.5:i/(values.length-1));
   const y=height-pad-(height-pad*2)*((v-min)/range);
   return {x,y,v};
 });
 const pts=points.map(p=>`${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ');
 const fillPts=`${points[0].x},${height-pad} ${pts} ${points.at(-1).x},${height-pad}`;
 return `<svg class="spark" viewBox="0 0 ${width} ${height}" preserveAspectRatio="none" aria-label="progress chart">
   <defs><linearGradient id="areaFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#8b5cf6" stop-opacity=".34"/><stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/></linearGradient></defs>
   <line x1="${pad}" y1="${height/2}" x2="${width-pad}" y2="${height/2}" stroke="#253047" stroke-width="1"/>
   <polygon points="${fillPts}" fill="url(#areaFill)"/>
   <polyline points="${pts}" fill="none" stroke="#9b77f7" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
   ${points.map(p=>`<circle cx="${p.x}" cy="${p.y}" r="5" fill="#ddd6fe" stroke="#6d49bd" stroke-width="2"/>`).join('')}
 </svg><div class="chart-labels"><span>${min.toFixed(0)}</span><span>${max.toFixed(0)}</span></div>`;
}

function guideKey(s){
 return String(s||'').toLowerCase()
  .replace(/push[\s-]?ups?/g,'push up').replace(/pull[\s-]?ups?/g,'pull up').replace(/chin[\s-]?ups?/g,'chin up')
  .replace(/\bflyes\b/g,'fly').replace(/\bflies\b/g,'fly').replace(/\brows\b/g,'row').replace(/\bcurls\b/g,'curl')
  .replace(/\braises\b/g,'raise').replace(/\bextensions\b/g,'extension').replace(/\bpresses\b/g,'press')
  .replace(/\bsquats\b/g,'squat').replace(/\blunges\b/g,'lunge').replace(/\bone arm\b/g,'single arm').replace(/\bone leg\b/g,'single leg')
  .replace(/[^a-z0-9]+/g,' ').trim();
}
function guideTokens(s){return guideKey(s).split(' ').filter(Boolean)}
function guideScore(ex,g){
 const a=new Set(guideTokens(ex.name)),b=new Set(guideTokens(g.name_en));
 let inter=0;for(const x of a)if(b.has(x))inter++;
 const union=new Set([...a,...b]).size||1;
 let score=inter/union;
 const appEq=guideKey(ex.equipment||'');
 const srcEq=guideKey(String(g.equipment||'').replaceAll('_',' '));
 if(appEq&&srcEq&&(srcEq.includes(appEq)||appEq.includes(srcEq)))score+=.12;
 const appMuscle=guideKey(ex.muscle||'');
 const body=guideKey(String(g.body_part||'').replaceAll('_',' '));
 if(appMuscle&&body&&(body.includes(appMuscle)||appMuscle.includes(body)))score+=.08;
 return score;
}
function prettyGuideTerm(s){
 return String(s||'').replaceAll('_',' ').replace(/\b\w/g,x=>x.toUpperCase());
}
async function loadRepdbGuides(){
 if(repdbGuideData)return repdbGuideData;
 if(!repdbGuidePromise){
  repdbGuidePromise=fetch(REPDB_DATA_URL,{cache:'force-cache'})
   .then(r=>{if(!r.ok)throw new Error('Guide source unavailable');return r.json()})
   .then(d=>{repdbGuideData=d.exercises||[];return repdbGuideData})
   .catch(err=>{repdbGuidePromise=null;throw err});
 }
 return repdbGuidePromise;
}
function repdbImageUrl(path){
 if(!path)return '';
 if(/^https?:/i.test(path))return path;
 return REPDB_ASSET_BASE+String(path).replace(/^\/+/, '');
}
function exactRepdbGuide(ex,data){
 const key=guideKey(ex?.name||'');
 return data.find(g=>guideKey(g.name_en)===key)||null;
}

 return `<div class="form-guide-card">
   <div class="form-guide-head">
    <div><div class="source-badge">↗ Public source · RepDB</div><div class="form-guide-title" style="margin-top:8px">${esc(g.name_en||'Exercise guide')}</div><div class="mini" style="margin-top:4px">${esc(prettyGuideTerm(g.equipment||'Bodyweight'))} · ${esc(prettyGuideTerm(g.difficulty||''))}</div></div>
   </div>
   ${g.description_en?`<div class="lastline">${esc(g.description_en)}</div>`:''}
   ${images.length?`<div class="form-guide-images">${images.map(([label,path])=>`<figure><img loading="lazy" src="${escAttr(repdbImageUrl(path))}" alt="${escAttr((g.name_en||'Exercise')+' '+label+' position')}"><figcaption>${esc(label)}</figcaption></figure>`).join('')}</div>`:''}

   <div class="form-guide-credit">Technique text and illustrations are loaded directly from RepDB's public exercise dataset, not generated by Swole Cat. <a href="https://repdb.co" target="_blank" rel="noopener">Exercise data by RepDB</a>. Form references are general education, and equipment setup or individual anatomy can change how a movement should be performed.</div>

async function loadExerciseFormGuide(exerciseId){
 const host=document.getElementById('exerciseFormGuide');if(!host)return;
 const ex=exById(exerciseId);if(!ex)return;
 host.innerHTML='<div class="empty"><strong>Loading public form guide…</strong>Checking the source exercise library.</div>';
 try{
  const data=await loadRepdbGuides();
  if(!document.getElementById('exerciseFormGuide'))return;
  const saved=formGuideMap()[exerciseId];
  const chosen=saved?data.find(g=>g.id===saved):null;
  const exact=chosen||exactRepdbGuide(ex,data);
  if(exact){host.innerHTML=renderRepdbGuide(exerciseId,exact);return}
  showFormGuidePicker(exerciseId);
 }catch(err){
  host.innerHTML=`<div class="form-guide-card"><div class="source-badge">Public source</div><div class="form-guide-title" style="margin-top:8px">Form guide needs a connection</div><div class="lastline">Swole Cat does not invent exercise instructions when the public source is unavailable. Connect to the internet and try again.</div><div class="actions"><a class="btn small secondary" href="https://exercise-dataset.com/" target="_blank" rel="noopener">Open public exercise library</a></div></div>`;
 }
}

function renderFormGuidePickerResults(exerciseId){
 const host=document.getElementById('guidePickerResults');if(!host||!repdbGuideData)return;
 const ex=exById(exerciseId),q=(document.getElementById('guideSearchInput')?.value||'').trim();
 const qKey=guideKey(q);
 let rows=repdbGuideData.map(g=>({g,score:q?guideScore({...ex,name:q},g):guideScore(ex,g)}));
 if(qKey)rows=rows.filter(x=>guideKey(x.g.name_en).includes(qKey)||x.score>.18);
 rows.sort((a,b)=>b.score-a.score);
 const top=rows.slice(0,8);
 host.innerHTML=top.length?top.map(({g})=>`<button class="guide-choice" onclick="saveFormGuideChoice('${exerciseId}','${escAttr(g.id)}')"><div class="grow"><b>${esc(g.name_en)}</b><div class="mini">${esc(prettyGuideTerm(g.body_part||''))} · ${esc(prettyGuideTerm(g.equipment||'Bodyweight'))} · ${esc(prettyGuideTerm(g.difficulty||''))}</div></div><span class="tag">Use guide</span></button>`).join(''):'<div class="empty">No public-source matches found for that search. Try a simpler exercise name.</div>';
}

function sessionCard(s){
 let sets=sessionSetCount(s),prs=sessionPRCount(s);
 return `<div class="card clickable" onclick="go('history')"><div class="row"><div><div class="exercise-name">${esc(s.routineName)}</div><div class="mini">${new Date(s.date).toLocaleDateString()} · ${sets} working sets${s.durationMinutes!=null?` · ${s.durationMinutes} min`:''}</div></div><span class="tag">${prs?`🏆 ${prs} PR`:`${s.exercises.length} moves`}</span></div></div>`;
}

function populateMuscles(){
 const msel=document.getElementById('muscleFilter'), esel=document.getElementById('equipmentFilter');
 const muscles=[...new Set(allExercises().map(x=>x.muscle))].sort();
 const equipment=[...new Set(allExercises().map(x=>x.equipment))].sort();
 if(msel){const old=msel.value;msel.innerHTML='<option value="">All muscle groups</option>'+muscles.map(m=>`<option>${esc(m)}</option>`).join('');msel.value=old;}
 if(esel){const old=esel.value;esel.innerHTML='<option value="">All equipment</option>'+equipment.map(e=>`<option>${esc(e)}</option>`).join('');esel.value=old;}
}
let exerciseHistoryFilter='all';

function setExerciseHistoryFilter(filter){
 exerciseHistoryFilter=filter;
 renderExercises();
}

function renderExercises(){
 populateMuscles();
 const q=(document.getElementById('exerciseSearch')?.value||'').toLowerCase();
 const m=document.getElementById('muscleFilter')?.value||'';
 const eq=document.getElementById('equipmentFilter')?.value||'';
 const exercises=allExercises();
 const loggedIds=new Set();
 state.sessions.forEach(s=>(s.exercises||[]).forEach(e=>{
   if((e.sets||[]).some(set=>set.done))loggedIds.add(e.exerciseId);
 }));

 document.querySelectorAll('[data-history-filter]').forEach(btn=>{
   btn.classList.toggle('active',btn.dataset.historyFilter===exerciseHistoryFilter);
 });
 const allBtn=document.getElementById('exerciseFilterAll');
 const doneBtn=document.getElementById('exerciseFilterDone');
 const newBtn=document.getElementById('exerciseFilterNew');
 if(allBtn)allBtn.textContent=`All (${exercises.length})`;
 if(doneBtn)doneBtn.textContent=`✓ Done Before (${loggedIds.size})`;
 if(newBtn)newBtn.textContent=`Not Yet Logged (${Math.max(0,exercises.length-loggedIds.size)})`;

 const list=exercises.filter(x=>{
   const matchesSearch=!q||x.name.toLowerCase().includes(q)||x.muscle.toLowerCase().includes(q)||(x.pattern||'').toLowerCase().includes(q);
   const matchesHistory=exerciseHistoryFilter==='all'||(exerciseHistoryFilter==='done'&&loggedIds.has(x.id))||(exerciseHistoryFilter==='new'&&!loggedIds.has(x.id));
   return matchesSearch&&matchesHistory&&(!m||x.muscle===m)&&(!eq||x.equipment===eq);
 });
 const emptyMessage=exerciseHistoryFilter==='done'
   ?'No logged exercises match these filters yet.'
   :exerciseHistoryFilter==='new'
     ?'You have already logged every exercise matching these filters.'
     :'Nothing matched that search.';
 document.getElementById('exerciseList').innerHTML=list.length?list.map(x=>`
   <div class="list-item">
     <div class="iconbox">${equipmentIcon(x.equipment)}</div>
     <div class="grow exercise-link" onclick="openExerciseProgress('${x.id}')"><div class="exercise-name">${esc(x.name)}</div><div class="mini" style="margin:4px 0">${muscleChip(x.muscle)}</div><div class="mini">${esc(x.equipment)} · ${esc(patternLabel(x.pattern))}</div></div>
     <button class="favbtn ${isFavorite(x.id)?'on':''}" onclick="toggleFavorite('${x.id}')">${isFavorite(x.id)?'★':'☆'}</button>
     ${x.custom?`<button class="btn small secondary" onclick="editExercise('${x.id}')">Edit</button>`:''}
   </div>`).join(''):`<div class="empty">${emptyMessage}</div>`;
}
function patternLabel(p){return String(p||'other').replaceAll('_',' ').replace(/\b\w/g,c=>c.toUpperCase())}

function favoriteIds(){return new Set(state.favorites||[])}
function isFavorite(id){return (state.favorites||[]).includes(id)}
function toggleFavorite(id){
 state.favorites=state.favorites||[];
 state.favorites=isFavorite(id)?state.favorites.filter(x=>x!==id):[...state.favorites,id];
 save();
 if(document.getElementById('routinePicker'))renderRoutinePicker();
 if(document.getElementById('addExList'))renderAddExercisePicker();
 if(document.getElementById('exerciseList'))renderExercises();
}
function recentExerciseIds(limit=18){
 const out=[],seen=new Set();
 const add=id=>{if(id&&!seen.has(id)){seen.add(id);out.push(id)}};
 if(state.activeWorkout) [...state.activeWorkout.exercises].reverse().forEach(e=>add(e.exerciseId));
 [...state.sessions].sort((a,b)=>b.date.localeCompare(a.date)).forEach(s=>[...s.exercises].reverse().forEach(e=>add(e.exerciseId)));
 state.routines.forEach(r=>r.exercises.forEach(e=>{if(out.length<limit)add(e.exerciseId)}));
 return out.slice(0,limit);
}
function categoryIcon(m){
 return ({Chest:'▰',Back:'↔',Shoulders:'△',Biceps:'◒',Triceps:'◓',Quads:'⬟',Hamstrings:'⌁',Glutes:'●',Calves:'⌃',Core:'◆',Traps:'⌂',Forearms:'✦','Lower Back':'◇',Tibialis:'⌄',Adductors:'◫','Full Body':'★'})[m]||'•';
}
function muscleCategories(){
 const counts={}; allExercises().forEach(x=>counts[x.muscle]=(counts[x.muscle]||0)+1);
 const preferred=['Chest','Back','Shoulders','Biceps','Triceps','Quads','Hamstrings','Glutes','Calves','Core','Traps','Forearms','Lower Back','Tibialis','Adductors','Full Body'];
 return Object.keys(counts).sort((a,b)=>{
   const ai=preferred.indexOf(a),bi=preferred.indexOf(b);
   if(ai>=0||bi>=0)return (ai<0?999:ai)-(bi<0?999:bi);
   return a.localeCompare(b);
 }).map(name=>({name,count:counts[name]}));
}
function exerciseMatchesSearch(x,q){
 q=q.trim().toLowerCase();
 return !q||x.name.toLowerCase().includes(q)||x.muscle.toLowerCase().includes(q)||x.equipment.toLowerCase().includes(q)||patternLabel(x.pattern).toLowerCase().includes(q);
}

function equipmentIcon(e){return {'barbell':'🏋','dumbbell':'◐','machine':'⚙','cable':'⌁','bodyweight':'◆','smith machine':'▥','kettlebell':'●','landmine':'◒','trap bar':'⬡','sled':'▰','plate':'◉'}[e]||'●'}

function renderRoutines(){
 const el=document.getElementById('routineList');
 el.innerHTML=state.routines.length?state.routines.map(r=>{
   const active=state.activeWorkout?.routineId===r.id;
   const counts=active?activeWorkoutCounts():null;
   return `
 <div class="card" style="${active?'border-color:rgba(34,197,94,.42)':''}">
   <div class="row">
     <div class="grow"><div class="exercise-name">${esc(r.name)}</div><div class="mini">${active?`${counts.done} of ${counts.total} sets complete · active workout is autosaved`:(r.exercises.map(x=>esc(exById(x.exerciseId)?.name||'Unknown')).join(' · ')||'No exercises yet')}</div></div>
     <button class="btn small ${active?'green':''}" onclick="${active?'resumeActiveWorkout()':`openRoutine('${r.id}')`}">${active?'Resume':'Start'}</button>
   </div>
   <div class="actions">${active?'<span class="tag">● ACTIVE</span>':''}<button class="btn small secondary" onclick="editRoutine('${r.id}')">Edit routine</button><button class="btn small danger" onclick="deleteRoutine('${r.id}')">Delete</button></div>
 </div>`;
 }).join(''):`<div class="empty">You haven't built a workout yet.</div>`;
 updateActiveWorkoutChrome();
}
function installStarterPlan(){
 const names=['Full Body A','Full Body B','Full Body C'];
 if(names.some(n=>state.routines.some(r=>r.name===n))){ alert('The 3-day starter is already installed.'); return; }
 const find=name=>allExercises().find(x=>x.name===name)?.id;
 const make=(name,items)=>({id:uid(),name,exercises:items.map(([exercise,sets,min,max,inc,rest])=>({
   exerciseId:find(exercise),sets,minReps:min,maxReps:max,increment:inc,mode:'double',restSeconds:rest
 })).filter(x=>x.exerciseId)});
 state.routines.push(
   make('Full Body A',[
    ['Back Squat',3,6,10,5,150],['Barbell Bench Press',3,6,10,5,150],['Seated Cable Row',3,8,12,5,120],['Romanian Deadlift',2,8,12,5,150],['Dumbbell Lateral Raise',2,10,15,5,75],['Cable Crunch',2,10,15,5,75]
   ]),
   make('Full Body B',[
    ['Deadlift',2,5,8,5,180],['Dumbbell Shoulder Press',3,8,12,5,120],['Lat Pulldown',3,8,12,5,120],['Bulgarian Split Squat',3,8,12,5,120],['Incline Dumbbell Press',2,8,12,5,120],['Cable Curl',2,10,15,5,75],['Triceps Pushdown',2,10,15,5,75]
   ]),
   make('Full Body C',[
    ['Leg Press',3,8,12,10,150],['Dumbbell Bench Press',3,8,12,5,120],['Chest Supported Row',3,8,12,5,120],['Hip Thrust',3,8,12,5,150],['Seated Leg Curl',2,10,15,5,90],['Cable Lateral Raise',2,10,15,5,75]
   ])
 );
 save(); renderHome(); renderRoutines(); alert('Added Full Body A, B, and C. Every exercise is editable.');
}

let routinePickerSelection=new Set(),routinePickerCategory='home',routinePickerMovement='';

function newRoutine(id=null){
 const r=id?state.routines.find(x=>x.id===id):{id:uid(),name:'',exercises:[]};
 routinePickerSelection=new Set(r.exercises.map(x=>x.exerciseId));
 routinePickerCategory='home'; routinePickerMovement='';
 const body=`<div class="field"><label>Routine name</label><input id="rName" value="${escAttr(r.name)}" placeholder="Push Day"></div>
 <div class="notice">Search anything instantly, or browse by muscle group → movement. Star exercises you use a lot and they'll stay in Favorites.</div>
 <div class="picker-tools" style="margin-top:12px">
   <input id="routineExSearch" placeholder="Search exercise, muscle, equipment..." oninput="renderRoutinePicker()">
   <div class="row" style="margin-top:9px"><span class="mini">Exercise picker</span><span id="routinePickCount" class="pickcount">${routinePickerSelection.size} selected</span></div>
 </div>
 <div id="routinePicker" style="max-height:52vh;overflow:auto"></div>

function routinePickerRows(items){
 return items.map(x=>`<div class="list-item">
   <button class="favbtn ${isFavorite(x.id)?'on':''}" onclick="toggleFavorite('${x.id}')" title="Favorite">${isFavorite(x.id)?'★':'☆'}</button>
   <div class="iconbox">${equipmentIcon(x.equipment)}</div>
   <div class="grow" onclick="toggleRoutineExercise('${x.id}')" style="cursor:pointer"><div class="exercise-name">${esc(x.name)}</div><div class="mini">${esc(x.muscle)} · ${esc(patternLabel(x.pattern))} · ${esc(x.equipment)}</div></div>
   <input type="checkbox" ${routinePickerSelection.has(x.id)?'checked':''} onchange="toggleRoutineExercise('${x.id}',this.checked)" style="width:22px;height:22px">
 </div>`).join('')||'<div class="empty">No exercises here yet.</div>';

function toggleRoutineExercise(id,forced){
 const add=forced===undefined?!routinePickerSelection.has(id):forced;
 if(add)routinePickerSelection.add(id);else routinePickerSelection.delete(id);
 const c=document.getElementById('routinePickCount');if(c)c.textContent=`${routinePickerSelection.size} selected`;
 renderRoutinePicker();
}
function setRoutineCategory(cat){routinePickerCategory=cat;routinePickerMovement='';document.getElementById('routineExSearch').value='';renderRoutinePicker()}
function setRoutineMovement(p){routinePickerMovement=p;renderRoutinePicker()}
function renderRoutinePicker(){
 const host=document.getElementById('routinePicker');if(!host)return;
 const q=(document.getElementById('routineExSearch')?.value||'').trim();
 if(q){
   host.innerHTML=`<div class="picker-section">Search results</div><div class="card">${routinePickerRows(allExercises().filter(x=>exerciseMatchesSearch(x,q)).slice(0,100))}</div>`;
   return;
 }
 if(routinePickerCategory==='home'){
   const fav=allExercises().filter(x=>isFavorite(x.id));
   const recent=recentExerciseIds().map(exById).filter(Boolean);
   host.innerHTML=`
    ${fav.length?`<div class="picker-section">★ Favorites</div><div class="card">${routinePickerRows(fav)}</div>`:''}
    ${recent.length?`<div class="picker-section">↺ Recently used</div><div class="card">${routinePickerRows(recent.slice(0,10))}</div>`:''}
    <div class="picker-section">Browse by muscle group</div>
    <div class="category-grid">${muscleCategories().map(c=>`<button class="category-card" onclick="setRoutineCategory('${escAttr(c.name)}')"><b>${categoryIcon(c.name)} ${esc(c.name)}</b><span>${c.count} exercises</span></button>`).join('')}</div>`;
   return;
 }
 const inCat=allExercises().filter(x=>x.muscle===routinePickerCategory);
 const patterns=[...new Set(inCat.map(x=>x.pattern))].sort((a,b)=>patternLabel(a).localeCompare(patternLabel(b)));
 const filtered=routinePickerMovement?inCat.filter(x=>x.pattern===routinePickerMovement):inCat;
 host.innerHTML=`<div class="breadcrumb"><button onclick="setRoutineCategory('home')">All categories</button><span>›</span><b>${esc(routinePickerCategory)}</b></div>
 <div class="picker-chips"><button class="chip ${!routinePickerMovement?'active':''}" onclick="setRoutineMovement('')">All</button>${patterns.map(p=>`<button class="chip ${routinePickerMovement===p?'active':''}" onclick="setRoutineMovement('${p}')">${esc(patternLabel(p))}</button>`).join('')}</div>
 <div class="card">${routinePickerRows(filtered)}</div>`;
}
function saveRoutine(id,editing){
 const name=document.getElementById('rName').value.trim()||'Untitled Workout';
 const ids=[...routinePickerSelection];
 let old=state.routines.find(x=>x.id===id);
 const oldMap=new Map((old?.exercises||[]).map(x=>[x.exerciseId,x]));
 const exercises=ids.map(exerciseId=>oldMap.get(exerciseId)||{
   exerciseId,sets:state.settings.defaultSets,minReps:state.settings.defaultMin,maxReps:state.settings.defaultMax,
   increment:state.settings.defaultIncrement,mode:'double',restSeconds:120
 });
 const obj={id,name,exercises};
 if(editing) state.routines=state.routines.map(x=>x.id===id?obj:x); else state.routines.push(obj);
 save();closeModal();renderRoutines();renderHome();
 if(exercises.length) editRoutineDetails(id);
}
function editRoutine(id){newRoutine(id)}
function deleteRoutine(id){
 const r=state.routines.find(x=>x.id===id);if(!r)return;
 if(state.activeWorkout?.routineId===id){
   showToast('Finish or cancel the active workout before deleting this routine');
   return;
 }
 confirmAction('Delete routine?',`Delete "${r.name}"? Your completed workout history stays saved, but the routine itself will be permanently removed.`,()=>{
   state.routines=state.routines.filter(x=>x.id!==id);
   save();closeModal();renderRoutines();renderHome();showToast('Routine deleted');
 });
}

function editRoutineDetails(id){
 const r=state.routines.find(x=>x.id===id); if(!r)return;
 openModal(`${esc(r.name)} editor`,`
 <div class="notice">Reorder exercises, edit progression, duplicate movements, remove them, or swap to a recommended substitute without rebuilding the routine.</div>
 <div id="routineEditorList" class="routine-edit-list" style="margin-top:12px">${routineEditorHtml(r)}</div>
 <div class="actions"><button class="btn secondary" onclick="openRoutineExerciseAdder('${id}')">+ Add exercise</button><button class="btn" onclick="saveRoutineEditor('${id}')">Done</button><button class="btn danger" onclick="deleteRoutine('${id}')">Delete routine</button></div>`);
}
function routineEditorHtml(r){
 return r.exercises.map((re,i)=>{
   const ex=exById(re.exerciseId);
   return `<div class="routine-edit-card" data-index="${i}">
    <div class="routine-edit-head">
      <div class="orderbox">
        <button class="orderbtn" onclick="moveRoutineExercise('${r.id}',${i},-1)" ${i===0?'disabled':''}>↑</button>
        <button class="orderbtn" onclick="moveRoutineExercise('${r.id}',${i},1)" ${i===r.exercises.length-1?'disabled':''}>↓</button>
      </div>
      <div>
        <div class="exercise-name">${esc(ex?.name||'Exercise')}</div>
        <div class="mini">${esc(ex?.muscle||'')} · ${esc(patternLabel(ex?.pattern||''))} · ${esc(ex?.equipment||'')}</div>
        <div class="editor-summary">
          <span class="tag">${re.sets} sets</span>
          <span class="tag">${re.minReps}-${re.maxReps} reps</span>
          <span class="tag">+${re.increment} ${state.profile.unit}</span>
          <span class="tag">${(re.mode==='range'||re.mode==='double')?'Double progression · +1/set':re.mode==='total'?'Beat total reps':'Manual'}</span>
          <span class="tag">${goalLabel(re.trainingGoal||'general')}</span>
          ${routineSupersetMeta(r,i)?`<span class="superset-badge">⚡ Superset ${routineSupersetMeta(r,i).label}</span>`:''}
        </div>
      </div>
      <span class="pickcount">#${i+1}</span>
    </div>
    <div class="routine-tools">
      <button class="btn small secondary" onclick="editRoutineExerciseSettings('${r.id}',${i})">⚙ Progression</button>
      <button class="btn small secondary" onclick="openRoutineSwap('${r.id}',${i})">⇄ Substitute</button>
      <button class="btn small secondary" onclick="openRoutineSupersetPicker('${r.id}',${i})">⚡ Superset</button>
      <button class="btn small secondary" onclick="duplicateRoutineExercise('${r.id}',${i})">Duplicate</button>
      <button class="btn small danger" onclick="removeRoutineExercise('${r.id}',${i})">Remove</button>
    </div>
   </div>`;
 }).join('')||'<div class="empty">No exercises in this routine yet.</div>';
}
function refreshRoutineEditor(id){
 const r=state.routines.find(x=>x.id===id),host=document.getElementById('routineEditorList');
 if(r&&host)host.innerHTML=routineEditorHtml(r);
}
function moveRoutineExercise(id,index,dir){
 const r=state.routines.find(x=>x.id===id); if(!r)return;
 const ni=index+dir; if(ni<0||ni>=r.exercises.length)return;
 [r.exercises[index],r.exercises[ni]]=[r.exercises[ni],r.exercises[index]];
 save();refreshRoutineEditor(id);
}
function duplicateRoutineExercise(id,index){
 const r=state.routines.find(x=>x.id===id); if(!r)return;
 const copy=JSON.parse(JSON.stringify(r.exercises[index]));copy.supersetGroup=null;
 r.exercises.splice(index+1,0,copy); save();refreshRoutineEditor(id);
}
function removeRoutineExercise(id,index){
 const r=state.routines.find(x=>x.id===id); if(!r)return;
 const ex=exById(r.exercises[index]?.exerciseId);
 if(!confirm(`Remove ${ex?.name||'this exercise'} from the routine? Your old workout history will stay saved.`))return;
 r.exercises.splice(index,1);cleanupRoutineSupersets(r); save();refreshRoutineEditor(id);
}
function editRoutineExerciseSettings(id,index){
 const r=state.routines.find(x=>x.id===id),re=r?.exercises[index]; if(!re)return;
 const ex=exById(re.exerciseId);
 openModal(`${esc(ex?.name||'Exercise')} progression`,`
 <div class="form-grid three">
   <div><label>Sets</label><input type="number" min="1" max="10" id="reSets" value="${re.sets}"></div>
   <div><label>Min reps</label><input type="number" id="reMin" value="${re.minReps}"></div>
   <div><label>Max reps</label><input type="number" id="reMax" value="${re.maxReps}"></div>
 </div>
 <div class="form-grid">
   <div><label>Weight jump (${state.profile.unit})</label><input type="number" step=".5" id="reInc" value="${re.increment}"></div>
   <div><label>Progression</label><select id="reMode">
    <option value="double" ${(re.mode==='range'||re.mode==='double')?'selected':''}>Double progression (+1 rep each set)</option>
    <option value="total" ${re.mode==='total'?'selected':''}>Beat total reps</option>
    <option value="manual" ${re.mode==='manual'?'selected':''}>Manual</option>
   </select></div>
 </div>
 <div class="form-grid">
   <div><label>Training goal</label><select id="reGoal">
    <option value="general" ${(re.trainingGoal||'general')==='general'?'selected':''}>General progression</option>
    <option value="hypertrophy" ${re.trainingGoal==='hypertrophy'?'selected':''}>Muscle growth</option>
    <option value="strength" ${re.trainingGoal==='strength'?'selected':''}>Strength</option>
   </select></div>
   <div><label>Reset suggestion</label><select id="reReset">
    <option value="5" ${Number(re.resetPercent||7.5)===5?'selected':''}>5%</option>
    <option value="7.5" ${Number(re.resetPercent||7.5)===7.5?'selected':''}>7.5%</option>
    <option value="10" ${Number(re.resetPercent||7.5)===10?'selected':''}>10%</option>
   </select></div>
 </div>
 <div class="field"><label>Rest seconds</label><input type="number" id="reRest" value="${re.restSeconds||120}"></div>
 <div class="notice">Goal changes how the coach interprets effort and stalls. It does not silently change your rep range or weights.</div>
 <div class="actions"><button class="btn" onclick="saveRoutineExerciseSettings('${id}',${index})">Save</button><button class="btn secondary" onclick="editRoutineDetails('${id}')">Back</button></div>`);
}
function saveRoutineExerciseSettings(id,index){
 const r=state.routines.find(x=>x.id===id),re=r?.exercises[index]; if(!re)return;
 re.sets=Math.max(1,+document.getElementById('reSets').value||3);
 re.minReps=Math.max(1,+document.getElementById('reMin').value||8);
 re.maxReps=Math.max(re.minReps,+document.getElementById('reMax').value||12);
 re.increment=Math.max(0,+document.getElementById('reInc').value||0);
 re.mode=document.getElementById('reMode').value;
 re.trainingGoal=document.getElementById('reGoal').value;
 re.resetPercent=+document.getElementById('reReset').value||7.5;
 re.restSeconds=Math.max(15,+document.getElementById('reRest').value||120);
 save();editRoutineDetails(id);
}
function openRoutineSwap(id,index){
 const r=state.routines.find(x=>x.id===id),re=r?.exercises[index]; if(!re)return;
 const current=exById(re.exerciseId),sugs=getSubstitutes(re.exerciseId);
 openModal(`Substitute ${esc(current?.name||'exercise')}`,`
 <div class="notice">These are ranked by similar muscle group and movement pattern. Swapping the routine does not merge exercise histories.</div>
 <div class="card" style="margin-top:12px">
 ${sugs.map(x=>`<div class="list-item">
   <div class="iconbox">${equipmentIcon(x.equipment)}</div>
   <div class="grow"><div class="exercise-name">${esc(x.name)}</div><div class="mini">${esc(x.muscle)} · ${esc(patternLabel(x.pattern))} · ${esc(x.equipment)}</div></div>
   <button class="btn small" onclick="applyRoutineSwap('${id}',${index},'${x.id}')">Use</button>
 </div>`).join('')||'<div class="empty">No close substitutes found.</div>'}
 </div>
 <div class="actions"><button class="btn secondary" onclick="editRoutineDetails('${id}')">Back</button></div>`);
}
function applyRoutineSwap(id,index,newExerciseId){
 const r=state.routines.find(x=>x.id===id); if(!r)return;
 r.exercises[index].exerciseId=newExerciseId; save(); editRoutineDetails(id);
}
function openRoutineExerciseAdder(id){
 routinePickerSelection=new Set(); routinePickerCategory='home';routinePickerMovement='';
 openModal('Add exercise to routine',`
 <div class="picker-tools"><input id="routineExSearch" placeholder="Search exercise, muscle, equipment..." oninput="renderRoutinePickerAdder('${id}')"></div>
 <div id="routinePicker" style="max-height:58vh;overflow:auto"></div>
 <div class="actions"><button class="btn" onclick="appendSelectedRoutineExercises('${id}')">Add selected</button><button class="btn secondary" onclick="editRoutineDetails('${id}')">Back</button></div>`);

}
function renderRoutinePickerAdder(id){
 const host=document.getElementById('routinePicker'); if(!host)return;

function setType(set){return ['working','warmup','drop','failure'].includes(set?.type)?set.type:'working'}
function isProgressionSet(set){return setType(set)==='working'}
function completedSets(prev){return (prev?.sets||[]).filter(s=>s.done && Number(s.weight)>=0 && Number(s.reps)>0)}

function workingSetIndexes(e){return (e?.sets||[]).map((s,i)=>isProgressionSet(s)?i:-1).filter(i=>i>=0)}
function workingSetOrdinal(e,si){

 return pos>=0?pos:Math.max(0,indexes.filter(i=>i<si).length);
}
function firstWorkingSetIndex(e){const a=workingSetIndexes(e);return a.length?a[0]:0}

}

function distributeTarget(previousReps,minReps,maxReps,setCount){
 // "Beat total reps" mode: add one rep somewhere across the exercise.
 const reps=Array.from({length:setCount},(_,i)=>Math.max(minReps,Math.min(maxReps,Number(previousReps[i]??minReps))));
 for(let i=0;i<reps.length;i++){ if(reps[i]<maxReps){ reps[i]++; break; } }

}
function progressEverySetTarget(previousReps,minReps,maxReps,setCount){
 // Default double progression: every programmed set gets +1 rep next exposure,
 // capped at the top of the rep range.
 return Array.from({length:setCount},(_,i)=>{
   const previous=Math.max(minReps-1,Number(previousReps[i]??(minReps-1)));
   return Math.min(maxReps,Math.max(minReps,previous+1));
 });
}

function goalRIRText(goal){

        goal==='strength'?'Quality reps matter more than grinding. Strength can progress without taking every set close to failure.':
        'Use the rep target as the main guide and RIR as optional context.';
}
function averageLoggedRIR(sets){
 const vals=(sets||[]).map(s=>s.rir).filter(v=>v!==''&&v!=null&&Number.isFinite(Number(v))).map(Number);
 return vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:null;
}
function recentExerciseSessions(exerciseId,n=4){
 return exerciseHistory(exerciseId).slice(-n);
}
function coachSignal(exerciseId,config){
 const hist=recentExerciseSessions(exerciseId,4);
 if(hist.length<2)return {level:'info',title:'Building baseline',text:`Keep logging this movement. The coach waits for repeated sessions before calling anything a stall.`,stalled:false,canReset:false};
 const scores=hist.map(h=>({
   e1:Math.max(...h.sets.map(s=>estimated1RM(s.weight,s.reps))),
   reps:h.sets.reduce((a,s)=>a+Number(s.reps||0),0),
   avgRIR:averageLoggedRIR(h.sets),
   weight:Math.max(...h.sets.map(s=>Number(s.weight)||0))
 }));
 const latest=scores.at(-1),prev=scores.at(-2);
 const first=scores[0];
 const gain=(latest.e1-first.e1)/Math.max(1,first.e1);
 const recentGain=(latest.e1-prev.e1)/Math.max(1,prev.e1);
 const highEffort=[...scores].reverse().find(x=>x.avgRIR!=null)?.avgRIR;
 const sameLoadish=Math.abs(latest.weight-first.weight)<=Math.max(.5,Number(config.increment||5));
 const enoughForStall=hist.length>=3;
 const stalled=enoughForStall && sameLoadish && gain<0.012 && latest.reps<=Math.max(...scores.slice(0,-1).map(x=>x.reps))+1;
 const regressing=enoughForStall && recentGain<-0.04 && gain<-0.02;
 const highEffortKnown=highEffort!=null && highEffort<=1;
 const resetPercent=Number(config.resetPercent||7.5);
 const resetWeight=roundLoad(latest.weight*(1-resetPercent/100));
 if(regressing && highEffortKnown){
   return {level:'reset',title:'Repeated hard-session drop',text:`Recent performance is down and your latest logged effort was very high. Consider a ${resetPercent}% session-only reset to ${resetWeight} ${state.profile.unit}, then rebuild.`,stalled:true,canReset:true,resetWeight,resetPercent};
 }
 if(stalled && highEffortKnown){
   return {level:'reset',title:'Stall detected',text:`Performance has been essentially flat across ${hist.length} exposures while effort is high. A small ${resetPercent}% reset is available, or you can keep the current load and try again.`,stalled:true,canReset:true,resetWeight,resetPercent};
 }
 if(stalled){
   return {level:'watch',title:'Holding pattern',text:`Progress has been flat across ${hist.length} exposures, but there isn't enough evidence of excessive effort to force a reset. Hold the plan, improve execution, or override the target if needed.`,stalled:true,canReset:false};
 }
 if(recentGain>0.015){
   return {level:'good',title:'Progressing',text:`Your recent estimated strength trend is moving up. Keep the current progression rules unless the sets feel meaningfully different than the log suggests.`,stalled:false,canReset:false};
 }
 return {level:'info',title:'On track',text:goalRIRText(config.trainingGoal||'general'),stalled:false,canReset:false};
}
function workoutCoachSignal(){
 const w=state.activeWorkout;if(!w)return null;
 const signals=w.exercises.filter(e=>!e.skipped).map(e=>coachSignal(e.exerciseId,e.config));
 const reset=signals.filter(x=>x.canReset).length,stalls=signals.filter(x=>x.stalled).length;
 if(reset>=2)return {level:'reset',text:`${reset} exercises are showing repeated high-effort stalls. A lighter session may be worth considering, but it is optional.`};
 if(stalls>=3)return {level:'watch',text:`Several movements are flat right now. That can happen normally. Watch the next session before making large changes.`};

}

function buildRecommendation(config,prev,exerciseId=null){
 const done=progressionSets(prev);
 const goal=config.trainingGoal||'general';
 const avgRIR=averageLoggedRIR(done);
 if(!done.length){
   return {status:'baseline',weight:0,weights:Array(config.sets).fill(0),targetReps:Array(config.sets).fill(config.minReps),
     headline:'Set your starting weight',detail:`Choose a clean starting load for about ${config.minReps}-${config.maxReps} reps. ${goalRIRText(goal)}`};
 }
 const weights=done.map(s=>Number(s.weight)||0);
 const reps=done.map(s=>Number(s.reps)||0);
 const sameWeight=weights.every(w=>w===weights[0]);
 const baseWeight=weights[0];
 const total=reps.reduce((a,b)=>a+b,0);
 if(config.mode==='manual'){
   return {status:'manual',weight:baseWeight,weights:Array.from({length:config.sets},(_,i)=>weights[i]??baseWeight),targetReps:Array.from({length:config.sets},(_,i)=>reps[i]??config.minReps),
     headline:'Repeat or adjust manually',detail:`Last session: ${done.map(s=>`${s.weight}×${s.reps}`).join(' · ')}`};
 }
 if(config.mode==='total'){
   const target=distributeTarget(reps,config.minReps,config.maxReps,config.sets);
   return {status:'reps',weight:baseWeight,weights:Array(config.sets).fill(baseWeight),targetReps:target,
     headline:`Beat ${total} total reps at ${baseWeight} ${state.profile.unit}`,detail:`Keep the same load. A one-rep improvement anywhere counts as progress.`};
 }
 // Double progression: add one rep to every programmed set on the next exposure, capped at the top of the rep range. Add load only after every set reaches the top of the range at one stable weight.
 const enoughSets=done.length>=config.sets;
 const allTop=enoughSets && done.slice(0,config.sets).every(s=>Number(s.reps)>=config.maxReps);
 if(sameWeight && allTop){
   if(goal==='strength' && avgRIR!=null && avgRIR<1){
     return {status:'reps',weight:baseWeight,weights:Array(config.sets).fill(baseWeight),targetReps:Array(config.sets).fill(config.maxReps),
       headline:`Own ${baseWeight} ${state.profile.unit} once more`,detail:`You reached the top of the rep range, but the logged effort was very high. For a strength goal, repeating clean quality reps before adding load is reasonable.`};
   }
   const next=roundLoad(baseWeight+Number(config.increment||0));
   return {status:'load',weight:next,weights:Array(config.sets).fill(next),targetReps:Array(config.sets).fill(config.minReps),
     headline:`Increase to ${next} ${state.profile.unit}`,detail:`You earned one configured load step after reaching the top of the rep range across all working sets. ${goalRIRText(goal)}`};
 }
 const target=progressEverySetTarget(reps,config.minReps,config.maxReps,config.sets);
 return {status:'reps',weight:baseWeight,weights:Array.from({length:config.sets},(_,i)=>weights[i]??baseWeight),targetReps:target,
   headline:`Stay at ${baseWeight} ${state.profile.unit} and add 1 rep to each set`,
   detail:`Last session: ${done.map(s=>`${s.weight}×${s.reps}`).join(' · ')}. Next target: ${target.map(r=>`${baseWeight}×${r}`).join(' · ')}. Each set progresses by one rep until all ${config.sets} sets reach ${config.maxReps}, then the load increases by your configured increment. ${goalRIRText(goal)}`};
}
function roundLoad(n){return Math.round(Number(n)*4)/4}
function previousSummary(prev){

 return done.map((s,i)=>`S${i+1} ${s.weight}×${s.reps}${s.rir!==''&&s.rir!=null?` @${s.rir} RIR`:''}`).join(' · ');
}

function setReference(prev,workingIndex){
 const done=progressionSets(prev),s=done[workingIndex]||done[done.length-1];
 return s?`${s.weight} ${state.profile.unit} × ${s.reps}${s.rir!==''&&s.rir!=null?` @${s.rir} RIR`:''}`:'No prior set';
}
function liveSetTarget(e,si,prev){
 const current=e.sets?.[si],type=setType(current);
 if(type!=='working')return {weight:roundLoad(Number(current?.weight)||0),reps:Math.max(1,Number(current?.reps)||e.config.minReps)};
 const wi=workingSetOrdinal(e,si);
 if(e.targetOverride)return {weight:roundLoad(e.targetOverride.weight),reps:Math.max(1,Number(e.targetOverride.reps)||e.config.minReps)};
 const base=buildRecommendation(e.config,prev,e.exerciseId);
 let weight=Number(base.weights?.[wi]??base.weight??current?.weight??0);
 let reps=Number(base.targetReps?.[wi]??e.config.minReps);
 const earlier=e.sets.slice(0,si).filter(s=>s.done&&isProgressionSet(s));
 if(earlier.length){
   const last=earlier[earlier.length-1];
   const prevWi=Math.max(0,wi-1);
   const expected=Number(base.targetReps?.[Math.min(prevWi,(base.targetReps?.length||1)-1)]??reps);
   const miss=Number(last.reps)-expected;
   if(miss<=-2) reps=Math.max(e.config.minReps-2,reps-1);
   else if(miss>=2) reps=Math.min(e.config.maxReps+2,reps+1);
   if(last.rir!=='' && Number(last.rir)===0) reps=Math.max(e.config.minReps-2,reps-1);
 }
 return {weight:roundLoad(weight),reps:Math.max(1,reps)};
}

function estimated1RM(weight,reps){
 weight=Number(weight)||0;reps=Number(reps)||0;

function detectPR(exerciseId,set){
 if(!isProgressionSet(set))return '';
 const prior=[];
 state.sessions.forEach(s=>s.exercises.forEach(e=>{
   if(e.exerciseId===exerciseId)progressionSets(e).forEach(x=>prior.push(x));
 }));
 // Include earlier completed working sets from the current active workout, but not the
 // set currently being evaluated. This prevents duplicate PR badges when
 // multiple sets tie the same newly achieved record in one session.
 if(state.activeWorkout){
   state.activeWorkout.exercises.forEach(e=>{
     if(e.exerciseId===exerciseId)progressionSets(e).forEach(x=>{if(x!==set)prior.push(x)});
   });
 }
 // A first-ever logged performance establishes the baseline. It is not counted
 // as a PR until a future performance actually beats it.
 if(!prior.length)return '';
 const w=Number(set.weight)||0,r=Number(set.reps)||0;
 const maxWeight=Math.max(...prior.map(x=>Number(x.weight)||0));
 const sameWeightMax=Math.max(0,...prior.filter(x=>Number(x.weight)===w).map(x=>Number(x.reps)||0));
 const priorE1=Math.max(0,...prior.map(x=>estimated1RM(x.weight,x.reps)));
 const curE1=estimated1RM(w,r);
 if(w>maxWeight)return `Load PR: ${w} ${state.profile.unit}`;
 if(r>sameWeightMax)return `Rep PR: ${w} ${state.profile.unit} × ${r}`;
 if(curE1>priorE1*1.01)return `Estimated strength PR`;
 return '';
}
function plateLoadText(weight,ex){
 if(!ex || !['barbell','trap bar'].includes(ex.equipment) || Number(weight)<=0)return '';
 const kg=state.profile.unit==='kg',bar=kg?20:45,plates=kg?[25,20,15,10,5,2.5,1.25]:[45,35,25,10,5,2.5];
 let side=(Number(weight)-bar)/2;
 if(side<0)return '';
 const used=[];
 for(const plate of plates){
   const count=Math.floor((side+1e-9)/plate);
   for(let i=0;i<count;i++){used.push(plate);side-=plate;}
 }
 if(side>0.26)return '';
 return used.length?`Per side: ${used.join(' + ')} ${state.profile.unit}`:`Bar only (${bar} ${state.profile.unit})`;
}

function setWorkoutSetType(ei,si,type){
 const e=state.activeWorkout?.exercises?.[ei],set=e?.sets?.[si];if(!set)return;
 if(!['working','warmup','drop','failure'].includes(type))type='working';

function updateSet(ei,si,k,v){

}
function toggleSet(ei,si){

 set.done=!set.done;
 if(set.done){
   set.pr=isProgressionSet(set)?detectPR(e.exerciseId,set):'';
   haptic(set.pr?[35,40,70]:25);
   saveActiveWorkout();
   if(isProgressionSet(set)&&advanceSupersetAfterSet(ei,si))return;
   startRestTimer(e.config.restSeconds||120);
   if(advanceFromCompletedExercise(ei))return;
 } else{
   set.pr='';

   if(!e.expanded){state.activeWorkout.exercises.forEach((x,i)=>x.expanded=i===ei);}

function paintRestTimer(){

function startRestTimer(seconds){

}
function adjustRestTimer(delta){restLeft=Math.max(0,restLeft+delta);paintRestTimer();if(restLeft===0)stopRestTimer();}

function calculateHistoricalPR(prior,set){
 if(!prior.length)return '';
 const w=Number(set.weight)||0,r=Number(set.reps)||0;
 const maxWeight=Math.max(...prior.map(x=>Number(x.weight)||0));
 const sameWeightMax=Math.max(0,...prior.filter(x=>Number(x.weight)===w).map(x=>Number(x.reps)||0));
 const priorE1=Math.max(0,...prior.map(x=>estimated1RM(x.weight,x.reps)));
 const curE1=estimated1RM(w,r);
 if(w>maxWeight)return `Load PR: ${w} ${state.profile.unit}`;
 if(r>sameWeightMax)return `Rep PR: ${w} ${state.profile.unit} × ${r}`;
 if(curE1>priorE1*1.01)return 'Estimated strength PR';
 return '';
}
function rebuildAllPRs(){
 const priorByExercise={};
 state.sessions.forEach(s=>(s.exercises||[]).forEach(e=>(e.sets||[]).forEach(set=>set.pr='')));
 const chronological=state.sessions.slice().sort((a,b)=>new Date(a.date)-new Date(b.date));
 chronological.forEach(session=>(session.exercises||[]).forEach(e=>{
   const prior=priorByExercise[e.exerciseId]||(priorByExercise[e.exerciseId]=[]);
   (e.sets||[]).forEach(set=>{
     if(!set.done||!isProgressionSet(set)||Number(set.reps)<=0)return;
     set.pr=calculateHistoricalPR(prior,set);
     prior.push({weight:Number(set.weight)||0,reps:Number(set.reps)||0,rir:set.rir});
   });
 }));
}

function subScore(current,candidate){
 if(!current||!candidate||current.id===candidate.id)return -999;
 let score=0;
 if(current.pattern && candidate.pattern===current.pattern)score+=60;
 if(current.muscle===candidate.muscle)score+=35;
 if(current.equipment===candidate.equipment)score+=8;
 // close families that commonly substitute reasonably when the exact pattern is unavailable
 const families={horizontal_press:['incline_press','dip_press'],incline_press:['horizontal_press','vertical_press'],horizontal_pull:['vertical_pull'],vertical_pull:['horizontal_pull','shoulder_extension'],squat:['lunge'],lunge:['squat'],hip_extension:['hinge'],hinge:['hip_extension'],rear_delt:['horizontal_pull'],elbow_extension:['dip_press']};
 if((families[current.pattern]||[]).includes(candidate.pattern))score+=14;
 return score;
}
function substitutionReason(current,c){
 const bits=[];
 if(c.pattern===current.pattern)bits.push('same movement pattern');
 if(c.muscle===current.muscle)bits.push(`same primary muscle`);
 if(c.equipment===current.equipment)bits.push('same equipment');
 return bits.length?bits.join(' · '):`${c.muscle} alternative`;
}
function recommendedSubs(exerciseId,query=''){
 const cur=exById(exerciseId); if(!cur)return [];
 let arr=allExercises().filter(x=>x.id!==exerciseId);
 if(query){const q=query.toLowerCase();arr=arr.filter(x=>x.name.toLowerCase().includes(q)||x.muscle.toLowerCase().includes(q)||patternLabel(x.pattern).toLowerCase().includes(q));}
 return arr.map(x=>({x,score:subScore(cur,x)})).sort((a,b)=>b.score-a.score||a.x.name.localeCompare(b.x.name));
}
function subRowsHtml(currentId,context,index,query=''){
 const cur=exById(currentId);
 const rows=recommendedSubs(currentId,query).slice(0,query?60:14);
 return rows.map(({x,score})=>`<div class="picker-result-card">
   <div class="picker-result-main">
     <div></div>
     <div class="iconbox">${equipmentIcon(x.equipment)}</div>
     <div class="picker-result-copy"><div class="exercise-name">${esc(x.name)}</div><div class="mini">${esc(x.muscle)} · ${esc(x.equipment)}<br>${esc(substitutionReason(cur,x))}</div></div>
   </div>
   <div class="picker-result-actions ${context==='workout'?'':'one'}">
     ${context==='workout'
       ?`<button class="btn small" onclick="swapWorkoutExercise(${index},'${x.id}',false)">Use Today</button><button class="btn small secondary" onclick="swapWorkoutExercise(${index},'${x.id}',true)">Use + Save to Routine</button>`
       :`<button class="btn small" onclick="swapRoutineExercise('${context}',${index},'${x.id}')">Use This Exercise</button>`}
   </div>
 </div>`).join('')||'<div class="empty">No matching exercises.</div>';
}

function swapWorkoutExercise(ei,newId,permanent){

 if(permanent){const r=state.routines.find(x=>x.id===state.activeWorkout.routineId);if(r&&Number.isInteger(e.routineIndex)&&r.exercises[e.routineIndex])r.exercises[e.routineIndex].exerciseId=newId;}
 e.exerciseId=newId;e.targetOverride=null;e.skipped=false;
 const prev=previousExercise(newId),rec=buildRecommendation(e.config,prev,e.exerciseId);
 e.sets=Array.from({length:e.config.sets},(_,i)=>({weight:rec.weights[i]??rec.weight??0,reps:rec.targetReps[i]??e.config.minReps,done:false,rir:'',type:'working'}));e.notes='';

}

let addPickerCategory='home',addPickerMovement='';

function addPickerRows(items){

   const inWorkout=!!w?.exercises.some(e=>e.exerciseId===x.id);
   const inRoutine=!!routine?.exercises.some(e=>e.exerciseId===x.id);

   const routineText=inRoutine?'Already in Routine':(inWorkout?'+ Save to Routine':'+ Add + Save to Routine');
   return `<div class="picker-result-card">

       <button class="btn small secondary" ${inRoutine?'disabled':''} onclick="addExerciseToWorkout('${x.id}',true)">${routineText}</button>

 }).join('')||'<div class="empty">No exercises here yet.</div>';

   return;
 }
