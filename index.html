function defaultWorkoutExerciseConfig(){
 return {
   sets:state.settings.defaultSets,
   minReps:state.settings.defaultMin,
   maxReps:state.settings.defaultMax,
   increment:state.settings.defaultIncrement,
   mode:'double',
   trainingGoal:'general',
   resetPercent:7.5,
   restSeconds:120
 };
}
function scrollToWorkoutExercise(index){
 setTimeout(()=>{
   const el=document.getElementById(`workoutExercise-${index}`);
   if(el)el.scrollIntoView({behavior:'smooth',block:'start'});
 },90);
}
function addExerciseToWorkout(exerciseId,permanent){
 const w=state.activeWorkout;if(!w)return;
 const ex=exById(exerciseId);if(!ex)return;
 const routine=state.routines.find(r=>r.id===w.routineId);
 const existingIndex=w.exercises.findIndex(e=>e.exerciseId===exerciseId);
 const routineIndex=routine?.exercises.findIndex(e=>e.exerciseId===exerciseId)??-1;

 // If it is already in today's workout, "Routine" can still promote a today-only addition.
 if(existingIndex>=0){
   if(permanent && routine && routineIndex<0){
     const cfg={...w.exercises[existingIndex].config};
     const savedCfg={
       exerciseId,
       sets:cfg.sets,
       minReps:cfg.minReps,
       maxReps:cfg.maxReps,
       increment:cfg.increment,
       mode:cfg.mode==='double'?'double':cfg.mode,
       trainingGoal:cfg.trainingGoal||'general',
       resetPercent:cfg.resetPercent||7.5,
       restSeconds:cfg.restSeconds||120,
       supersetGroup:null
     };
     routine.exercises.push(savedCfg);
     w.exercises.forEach((e,i)=>e.expanded=i===existingIndex);
     w.exercises[existingIndex].routineIndex=routine.exercises.length-1;
     saveActiveWorkout();haptic([20,30,20]);closeModal();renderWorkout();
     showToast(`${ex.name} saved to routine`);
     scrollToWorkoutExercise(existingIndex);
     return;
   }
   showToast(`${ex.name} is already in this workout`);
   return;
 }

 const cfg=defaultWorkoutExerciseConfig();
 let newRoutineIndex=null;

 if(permanent && routine){
   if(routineIndex<0){
     routine.exercises.push({exerciseId,...cfg});
     newRoutineIndex=routine.exercises.length-1;
   }else{
     newRoutineIndex=routineIndex;
   }
 }

 const prev=previousExercise(exerciseId);
 const rec=buildRecommendation(cfg,prev,exerciseId);
 const entry={
   exerciseId,
   routineIndex:newRoutineIndex,
   config:{...cfg},
   targetOverride:null,
   supersetId:null,
   skipped:false,
   expanded:true,
   sets:Array.from({length:cfg.sets},(_,i)=>({
     weight:rec.weights?.[i]??rec.weight??0,
     reps:rec.targetReps?.[i]??cfg.minReps,
     done:false,
     rir:'',
     type:'working'
   })),
   notes:''
 };
 w.exercises.forEach(e=>e.expanded=false);
 w.exercises.push(entry);
 const newIndex=w.exercises.length-1;
 if(!permanent)markWorkoutStructureDirty();else saveActiveWorkout();haptic([20,30,20]);closeModal();renderWorkout();
 showToast(permanent?`${ex.name} added + saved to routine`:`${ex.name} added for today`);
 scrollToWorkoutExercise(newIndex);
}



function convertStoredUnits(fromUnit,toUnit){
 if(fromUnit===toUnit)return;
 const factor=fromUnit==='lb'&&toUnit==='kg'?0.45359237:
              fromUnit==='kg'&&toUnit==='lb'?2.2046226218:1;
 const cv=v=>Math.round((Number(v)||0)*factor*100)/100;
 state.settings.defaultIncrement=cv(state.settings.defaultIncrement);
 state.routines.forEach(r=>r.exercises.forEach(e=>{e.increment=cv(e.increment)}));
 state.sessions.forEach(s=>s.exercises.forEach(e=>e.sets.forEach(set=>{set.weight=cv(set.weight)})));
 (state.bodyweight||[]).forEach(x=>{x.value=cv(x.value)});
 if(state.activeWorkout){
   state.activeWorkout.exercises.forEach(e=>{
     e.config.increment=cv(e.config.increment);
     e.sets.forEach(set=>{set.weight=cv(set.weight)});
     if(e.targetOverride)e.targetOverride.weight=cv(e.targetOverride.weight);
   });
 }
}

function saveSettings(){
 const oldUnit=state.profile.unit;
 const newUnit=document.getElementById('pUnit').value;
 state.profile.name=document.getElementById('pName').value.trim();
 state.settings.defaultSets=+document.getElementById('dSets').value||3;

 state.ui.haptics=document.getElementById('hapticToggle').classList.contains('on');
 state.ui.keepAwake=document.getElementById('awakeToggle').classList.contains('on');
 if(newUnit!==oldUnit)convertStoredUnits(oldUnit,newUnit);
 state.profile.unit=newUnit;
 save();haptic(15);closeModal();renderHome();showToast(newUnit!==oldUnit?`Converted workout data to ${newUnit}`:'Settings saved');
}
function exportBackup(){
 const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='swole-cat-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(a.href);

function importBackup(file){
 if(!file)return; const r=new FileReader(); r.onload=()=>{try{state=Object.assign(freshState(),JSON.parse(r.result));save();closeModal();renderHome();alert('Backup imported.');}catch(e){alert('That backup file could not be read.')}}; r.readAsText(file);
}
