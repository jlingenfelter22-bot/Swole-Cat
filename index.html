<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0b0d12" />
<link rel="manifest" href="manifest.webmanifest">
<title>Swole Cat</title>
<style>
  :root{
    --bg:#0b0d12; --panel:#121722; --panel2:#171d2a; --muted:#8992a6; --text:#f5f7fb;
    --accent:#8b5cf6; --accent2:#22c55e; --danger:#ef4444; --border:#252d3d; --input:#0f141e;
    --shadow:0 12px 30px rgba(0,0,0,.28);
  }
  *{box-sizing:border-box}
  body{margin:0;background:linear-gradient(180deg,#0b0d12 0%,#0e1118 100%);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  button,input,select,textarea{font:inherit}
  button{cursor:pointer}
  .app{max-width:760px;margin:auto;min-height:100vh;padding-bottom:92px}
  header{position:sticky;top:0;z-index:20;padding:18px 18px 12px;background:rgba(11,13,18,.92);backdrop-filter:blur(16px);border-bottom:1px solid rgba(255,255,255,.04)}
  .topline{display:flex;justify-content:space-between;align-items:center;gap:12px}
  .brand{font-weight:900;font-size:1.35rem;letter-spacing:.3px}
  .brand span{color:var(--accent)}
  .sub{color:var(--muted);font-size:.9rem;margin-top:3px}
  .pill{background:var(--panel2);border:1px solid var(--border);color:#d8deea;border-radius:999px;padding:8px 11px;font-size:.82rem}
  main{padding:18px}
  .view{display:none}.view.active{display:block}
  .hero{background:radial-gradient(circle at top right,rgba(139,92,246,.28),transparent 40%),var(--panel);border:1px solid var(--border);border-radius:24px;padding:20px;box-shadow:var(--shadow)}
  .eyebrow{color:#b7bfd0;font-size:.76rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
  h1{font-size:2rem;margin:8px 0 6px;line-height:1.05}
  h2{font-size:1.12rem;margin:0}
  .muted{color:var(--muted)}
  .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
  .btn{border:0;border-radius:14px;padding:13px 16px;font-weight:800;background:var(--accent);color:white}
  .btn.secondary{background:var(--panel2);border:1px solid var(--border);color:var(--text)}
  .btn.green{background:var(--accent2);color:#07110a}
  .btn.danger{background:rgba(239,68,68,.13);color:#fecaca;border:1px solid rgba(239,68,68,.3)}
  .btn.small{padding:8px 10px;border-radius:10px;font-size:.82rem}
  .section-title{display:flex;align-items:center;justify-content:space-between;margin:26px 2px 12px}
  .grid{display:grid;gap:12px}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:18px;padding:16px}
  .card.clickable:hover{border-color:#3b465d}
  .row{display:flex;justify-content:space-between;align-items:center;gap:12px}
  .exercise-name{font-weight:850;font-size:1.02rem}
  .tag{font-size:.72rem;padding:5px 8px;border-radius:999px;background:#1c2331;color:#bec7d9;border:1px solid #2a3448}
  .metric{font-size:1.45rem;font-weight:900;margin-top:5px}
  .metric small{font-size:.75rem;color:var(--muted);font-weight:700}
  .mini{font-size:.83rem;color:var(--muted)}
  .progress-bar{height:8px;background:#0d1119;border-radius:999px;overflow:hidden;margin-top:12px;border:1px solid #1f2634}
  .progress-bar > div{height:100%;background:linear-gradient(90deg,var(--accent),#c084fc);width:0}
  .empty{padding:24px;text-align:center;color:var(--muted);border:1px dashed #30384a;border-radius:18px}
  nav{position:fixed;bottom:0;left:0;right:0;background:rgba(12,15,21,.96);backdrop-filter:blur(18px);border-top:1px solid var(--border);z-index:50}
  nav .inner{max-width:760px;margin:auto;display:grid;grid-template-columns:repeat(5,1fr);padding:9px 8px calc(9px + env(safe-area-inset-bottom))}
  .navbtn{background:none;border:0;color:var(--muted);padding:8px 4px;font-size:.73rem;font-weight:750}
  .navbtn.active{color:white}
  .navbtn b{display:block;font-size:1.1rem;margin-bottom:2px}
  label{display:block;color:#c8d0de;font-size:.8rem;font-weight:800;margin-bottom:6px}
  input,select,textarea{width:100%;background:var(--input);color:var(--text);border:1px solid var(--border);border-radius:12px;padding:12px}
  textarea{min-height:80px;resize:vertical}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .field{margin-bottom:12px}
  .list-item{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid #202737}
  .list-item:last-child{border-bottom:0}
  .iconbox{width:42px;height:42px;border-radius:12px;background:#1c2331;display:grid;place-items:center;font-size:1.15rem;flex:0 0 auto}
  .grow{flex:1}
  .search{margin-bottom:12px}
  .workout-title{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
  .setrow{display:grid;grid-template-columns:44px 1fr 1fr 48px;gap:8px;align-items:center;margin-top:8px}
  .setnum{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:#20283a;font-weight:900;color:#d8deea}
  .setrow input{text-align:center;font-weight:850}
  .check{width:44px;height:44px;border-radius:12px;background:#172019;border:1px solid #28452f;color:#7ee29a;font-weight:900}
  .check.done{background:#22c55e;color:#07110a;border-color:#22c55e}
  .history-table{width:100%;border-collapse:collapse;margin-top:8px}
  .history-table td,.history-table th{padding:9px 5px;border-bottom:1px solid #222a39;text-align:left;font-size:.84rem}
  .history-table th{color:var(--muted);font-size:.72rem;text-transform:uppercase;letter-spacing:.08em}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.66);z-index:100;display:none;align-items:flex-end}
  .modal.open{display:flex}
  .sheet{width:100%;max-width:760px;margin:auto;background:#111722;border-radius:24px 24px 0 0;border:1px solid var(--border);padding:18px;max-height:88vh;overflow:auto}
  .sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
  .x{background:#1d2533;color:white;border:1px solid #303a4d;border-radius:10px;width:38px;height:38px}
  .notice{background:#161f2e;border:1px solid #273550;border-radius:14px;padding:12px;color:#c9d3e7;font-size:.86rem}
  .good{color:#7ee29a}.warn{color:#fbbf24}
  .targetbox{background:linear-gradient(180deg,rgba(139,92,246,.12),rgba(139,92,246,.04));border:1px solid rgba(139,92,246,.35);border-radius:14px;padding:12px;margin-top:12px}
  .lastline{color:#b8c1d3;font-size:.84rem;margin-top:6px;line-height:1.45}

  .picker-tools{position:sticky;top:-18px;z-index:4;background:#111722;padding:4px 0 10px}
  .picker-chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
  .picker-chips::-webkit-scrollbar{display:none}
  .chip{white-space:nowrap;background:#171e2b;border:1px solid #2a3448;color:#c7d0e0;border-radius:999px;padding:9px 12px;font-size:.8rem;font-weight:800}
  .chip.active{background:#312252;border-color:#754fd0;color:white}
  .category-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:10px}
  .category-card{background:#151c29;border:1px solid #283246;border-radius:16px;padding:14px;text-align:left;color:white}
  .category-card b{display:block;font-size:.98rem}
  .category-card span{display:block;color:var(--muted);font-size:.76rem;margin-top:4px}
  .picker-section{font-size:.72rem;text-transform:uppercase;letter-spacing:.11em;color:#929db1;font-weight:900;margin:16px 2px 8px}
  .favbtn{border:0;background:transparent;color:#6f788b;font-size:1.25rem;padding:7px;line-height:1}
  .favbtn.on{color:#fbbf24}
  .breadcrumb{display:flex;align-items:center;gap:7px;color:#b8c1d2;font-size:.82rem;margin:7px 0 10px}
  .breadcrumb button{border:0;background:none;color:#a78bfa;padding:0;font-weight:800}
  .pickcount{background:#262f42;color:#dce3ef;border-radius:999px;padding:5px 9px;font-size:.72rem;font-weight:900}


  .routine-edit-list{display:grid;gap:10px}
  .routine-edit-card{background:#141b27;border:1px solid #293347;border-radius:16px;padding:13px}
  .routine-edit-head{display:grid;grid-template-columns:42px 1fr auto;gap:10px;align-items:center}
  .orderbox{display:grid;gap:5px}
  .orderbtn{width:36px;height:30px;border-radius:9px;border:1px solid #303b50;background:#1b2332;color:white;font-weight:900}
  .routine-tools{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
  .routine-tools .btn{padding:8px 10px}
  .editor-summary{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
  .editor-summary .tag{font-size:.68rem}


  .workout-overview{background:linear-gradient(135deg,rgba(139,92,246,.18),rgba(34,197,94,.07)),var(--panel);border:1px solid var(--border);border-radius:20px;padding:15px;margin-bottom:14px}
  .workout-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
  .workout-stat{background:#101620;border:1px solid #252f42;border-radius:12px;padding:10px;text-align:center}
  .workout-stat b{display:block;font-size:1.05rem}.workout-stat span{color:var(--muted);font-size:.68rem;text-transform:uppercase;letter-spacing:.07em}
  .live-card{padding:0;overflow:hidden}
  .live-head{padding:15px 15px 12px;background:linear-gradient(180deg,rgba(255,255,255,.025),transparent)}
  .live-body{padding:0 15px 15px}
  .set-card{background:#0f151f;border:1px solid #273147;border-radius:15px;padding:10px;margin-top:10px}
  .set-card.completed{border-color:rgba(34,197,94,.45);background:rgba(34,197,94,.055)}
  .set-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
  .set-reference{font-size:.76rem;color:#9da8ba}
  .set-target{font-size:.76rem;font-weight:850;color:#c4b5fd;background:rgba(139,92,246,.12);border:1px solid rgba(139,92,246,.28);border-radius:999px;padding:5px 8px}
  .live-entry{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,.9fr) 64px;gap:9px;align-items:end}
  .live-input-wrap label{font-size:.67rem;color:#8e99aa;text-transform:uppercase;letter-spacing:.06em;margin:0}
  .input-label-row{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:5px;min-height:24px}
  .micro-step{display:flex;gap:4px}
  .micro-step button{width:25px;height:25px;padding:0;border:1px solid #303a50;background:#1a2230;color:#cfd7e5;border-radius:7px;font-weight:950;font-size:.88rem;line-height:1}
  .direct-number{height:52px!important;border:1px solid #303b51!important;border-radius:13px!important;background:#0d131d!important;padding:7px 8px!important;text-align:center!important;font-size:1.28rem!important;font-weight:950!important;color:#f5f7fb!important;min-width:0}
  .direct-number:focus{outline:none;border-color:#8b5cf6!important;box-shadow:0 0 0 3px rgba(139,92,246,.14)}
  .direct-number::placeholder{color:#596579;font-weight:800;font-size:.9rem}
  .rir-small select{height:52px;padding:6px;text-align:center;font-weight:850}
  @media(max-width:390px){
    .live-entry{grid-template-columns:minmax(0,1.2fr) minmax(0,.85fr) 58px;gap:7px}
    .micro-step button{width:23px;height:23px}
    .direct-number{font-size:1.18rem!important}
  }
  .complete-set{width:100%;margin-top:8px;border:1px solid #31533a;background:#16241a;color:#8be7a3;border-radius:11px;padding:10px;font-weight:900}
  .complete-set.done{background:#22c55e;border-color:#22c55e;color:#07110a}
  .pr-banner{margin-top:8px;border-radius:10px;padding:8px 10px;background:rgba(251,191,36,.11);border:1px solid rgba(251,191,36,.3);color:#fde68a;font-size:.78rem;font-weight:800}
  .toolrow{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
  .toolchip{border:1px solid #303a50;background:#171f2d;color:#cdd5e4;border-radius:999px;padding:7px 10px;font-size:.74rem;font-weight:800}
  .plates{color:#cbd5e1;font-size:.76rem;margin-top:6px}
  .resttimer{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);z-index:80;background:#171d2a;border:1px solid #46526c;border-radius:18px;padding:10px 12px;box-shadow:var(--shadow);font-weight:900;display:none;width:min(94vw,520px)}
  .resttimer.show{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .rest-main{display:flex;align-items:baseline;gap:7px}.rest-main span{font-size:1.35rem}.rest-main small{color:var(--muted);font-size:.7rem;text-transform:uppercase;letter-spacing:.08em}
  .rest-actions{display:flex;gap:6px}.rest-actions button{border:1px solid #36425a;background:#20293a;color:#eef2f7;border-radius:10px;padding:8px 9px;font-weight:850}


  .stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  .stat-card{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:14px}
  .stat-card .big{font-size:1.55rem;font-weight:950;margin-top:3px}
  .stat-card .caption{color:var(--muted);font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;font-weight:800}
  .chart-card{background:var(--panel);border:1px solid var(--border);border-radius:18px;padding:15px;overflow:hidden}
  .barlist{display:grid;gap:10px;margin-top:12px}
  .barrow{display:grid;grid-template-columns:86px 1fr 36px;gap:9px;align-items:center;font-size:.78rem}
  .bartrack{height:9px;background:#0d121a;border:1px solid #222c3d;border-radius:999px;overflow:hidden}
  .barfill{height:100%;background:linear-gradient(90deg,#8b5cf6,#a78bfa);border-radius:999px}
  .weekbars{display:grid;grid-template-columns:repeat(8,1fr);gap:7px;height:120px;align-items:end;margin-top:12px}
  .weekcol{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:6px}
  .weekbar{width:100%;min-height:3px;border-radius:7px 7px 3px 3px;background:linear-gradient(180deg,#8b5cf6,#5b36b5)}
  .weeklabel{font-size:.62rem;color:var(--muted)}
  .spark{width:100%;height:130px;margin-top:10px;display:block}
  .metric-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
  .metric-mini{background:#101620;border:1px solid #252f42;border-radius:12px;padding:10px;text-align:center}
  .metric-mini b{display:block;font-size:1.05rem}.metric-mini span{font-size:.65rem;color:var(--muted);text-transform:uppercase}
  .summary-win{background:rgba(34,197,94,.08);border:1px solid rgba(34,197,94,.26);border-radius:14px;padding:12px;margin-top:10px}
  .summary-pr{background:rgba(251,191,36,.09);border:1px solid rgba(251,191,36,.3);border-radius:14px;padding:12px;margin-top:10px}
  .trend-up{color:#86efac}.trend-flat{color:#cbd5e1}.trend-down{color:#fca5a5}
  .exercise-link{cursor:pointer}.exercise-link:hover .exercise-name{text-decoration:underline}
  @media(min-width:680px){.stat-grid{grid-template-columns:repeat(4,1fr)}}


  .coachbox{margin-top:10px;border-radius:13px;padding:11px 12px;border:1px solid #2b3850;background:#121a27}
  .coachbox.good{border-color:rgba(34,197,94,.3);background:rgba(34,197,94,.06)}
  .coachbox.watch{border-color:rgba(251,191,36,.32);background:rgba(251,191,36,.07)}
  .coachbox.reset{border-color:rgba(248,113,113,.32);background:rgba(248,113,113,.07)}
  .coach-title{font-size:.75rem;font-weight:950;text-transform:uppercase;letter-spacing:.08em}
  .coach-text{font-size:.82rem;color:#c8d1df;margin-top:4px;line-height:1.4}
  .goalbadge{font-size:.68rem;font-weight:900;text-transform:uppercase;letter-spacing:.06em;border:1px solid #344058;background:#1a2231;color:#d8dfeb;border-radius:999px;padding:5px 8px}
  .override-note{margin-top:8px;color:#c4b5fd;font-size:.76rem;font-weight:850}
  .insight-list{display:grid;gap:9px}


  .navbtn{position:relative;transition:transform .15s ease,color .15s ease}
  .navbtn:active{transform:scale(.96)}
  .navbtn.active:after{content:"";position:absolute;left:50%;bottom:2px;transform:translateX(-50%);width:24px;height:3px;border-radius:999px;background:var(--accent)}
  .btn,.pill,.toolchip,.chip,.category-card,.check,.complete-set,.orderbtn{transition:transform .12s ease,filter .12s ease,border-color .12s ease}
  .btn:active,.pill:active,.toolchip:active,.chip:active,.category-card:active,.check:active,.complete-set:active,.orderbtn:active{transform:scale(.97)}
  .install-pill{display:none;background:rgba(139,92,246,.16);border-color:rgba(139,92,246,.4);color:#ddd6fe}
  .install-pill.show{display:inline-block}
  .onboard-hero{text-align:center;padding:8px 5px 2px}
  .onboard-logo{width:76px;height:76px;border-radius:22px;margin:0 auto 14px;display:grid;place-items:center;background:linear-gradient(135deg,#8b5cf6,#5b21b6);box-shadow:0 14px 36px rgba(139,92,246,.3);font-size:2rem;font-weight:950}
  .onboard-step{display:flex;gap:10px;align-items:flex-start;margin:12px 0}
  .onboard-step .num{width:30px;height:30px;flex:0 0 auto;border-radius:50%;display:grid;place-items:center;background:#252d40;color:#ddd6fe;font-weight:950}
  .muscle-chip{display:inline-flex;align-items:center;gap:6px;background:#171f2d;border:1px solid #2b364b;border-radius:999px;padding:5px 8px;font-size:.7rem;color:#cbd5e1;font-weight:850}
  .muscle-dot{width:8px;height:8px;border-radius:50%;background:currentColor;opacity:.9}
  .chart-labels{display:flex;justify-content:space-between;color:var(--muted);font-size:.65rem;margin-top:3px}
  .empty-illustration{font-size:2rem;margin-bottom:7px;opacity:.8}
  .empty strong{display:block;color:#dfe5ef;margin-bottom:5px}
  .toast{position:fixed;left:50%;top:78px;transform:translate(-50%,-10px);z-index:140;background:#1b2230;border:1px solid #3a465e;color:white;border-radius:13px;padding:10px 13px;box-shadow:var(--shadow);font-size:.82rem;font-weight:800;opacity:0;pointer-events:none;transition:.18s ease}
  .toast.show{opacity:1;transform:translate(-50%,0)}
  .status-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#22c55e;margin-right:5px}
  .setting-toggle{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid #202737}
  .toggle{width:48px;height:28px;border-radius:999px;border:1px solid #39455d;background:#202838;position:relative;padding:0}
  .toggle:after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#aab3c2;transition:.18s ease}
  .toggle.on{background:#5b3ca6;border-color:#8b5cf6}.toggle.on:after{left:23px;background:white}
  .native-note{font-size:.72rem;color:#8e99aa;line-height:1.4}


  .exercise-block{--ex-accent:#a78bfa;--ex-soft:rgba(167,139,250,.10);position:relative;margin:18px 0 30px!important;border-color:color-mix(in srgb,var(--ex-accent) 35%,#252d3d)!important;box-shadow:inset 4px 0 0 var(--ex-accent),0 10px 26px rgba(0,0,0,.16)}
  .exercise-block.tone-0{--ex-accent:#a78bfa;--ex-soft:rgba(167,139,250,.11)}
  .exercise-block.tone-1{--ex-accent:#38bdf8;--ex-soft:rgba(56,189,248,.10)}
  .exercise-block.tone-2{--ex-accent:#34d399;--ex-soft:rgba(52,211,153,.09)}
  .exercise-block.tone-3{--ex-accent:#f59e0b;--ex-soft:rgba(245,158,11,.09)}
  .exercise-block .live-head{background:linear-gradient(135deg,var(--ex-soft),rgba(255,255,255,.015) 62%,transparent);border-bottom:1px solid color-mix(in srgb,var(--ex-accent) 24%,#252d3d)}
  .exercise-identity{display:flex;align-items:flex-start;gap:11px;min-width:0}
  .exercise-number{width:34px;height:34px;flex:0 0 auto;border-radius:11px;display:grid;place-items:center;background:var(--ex-soft);border:1px solid color-mix(in srgb,var(--ex-accent) 45%,transparent);color:var(--ex-accent);font-weight:950;font-size:.9rem}
  .exercise-kicker{font-size:.67rem;line-height:1;text-transform:uppercase;letter-spacing:.12em;color:var(--ex-accent);font-weight:950;margin-bottom:5px}
  .exercise-title{font-weight:950;line-height:1.08;letter-spacing:.01em;color:#fff;text-shadow:0 0 18px color-mix(in srgb,var(--ex-accent) 18%,transparent)}
  .exercise-meta{margin-top:5px;color:#9da8ba;font-size:.76rem}
  .exercise-divider{display:flex;align-items:center;gap:10px;margin:28px 4px 12px;color:#727e92;font-size:.67rem;font-weight:950;letter-spacing:.14em;text-transform:uppercase}
  .exercise-divider:before,.exercise-divider:after{content:"";height:1px;flex:1;background:linear-gradient(90deg,transparent,#303a4d)}
  .exercise-divider:after{background:linear-gradient(90deg,#303a4d,transparent)}
  .exercise-block .targetbox{border-left:3px solid var(--ex-accent);background:linear-gradient(90deg,var(--ex-soft),rgba(20,25,36,.88) 55%)}
  .exercise-block .set-target{border-color:color-mix(in srgb,var(--ex-accent) 40%,#2d3750);background:var(--ex-soft);color:color-mix(in srgb,var(--ex-accent) 72%,white)}
  .exercise-block .set-card{position:relative}
  .exercise-block .set-card:before{content:"";position:absolute;left:-1px;top:14px;bottom:14px;width:2px;border-radius:99px;background:color-mix(in srgb,var(--ex-accent) 34%,transparent)}


  .picker-result-list{display:grid;gap:9px}
  .picker-result-card{background:#121925;border:1px solid #273248;border-radius:15px;padding:11px;min-width:0}
  .picker-result-main{display:grid;grid-template-columns:auto 42px minmax(0,1fr);gap:9px;align-items:center;min-width:0}
  .picker-result-main .favbtn{align-self:center}
  .picker-result-copy{min-width:0}
  .picker-result-copy .exercise-name{line-height:1.15}
  .picker-result-copy .mini{margin-top:4px;line-height:1.28;overflow-wrap:anywhere}
  .picker-result-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px;padding-left:0}
  .picker-result-actions.one{grid-template-columns:1fr}
  .picker-result-actions .btn{width:100%;min-width:0;padding:10px 8px;text-align:center}
  .picker-result-actions .btn[disabled]{opacity:.48;cursor:default;filter:none}
  .picker-result-actions .btn[disabled]:active{transform:none}
  .add-picker-help{display:flex;gap:7px;align-items:center;margin-top:8px;color:#909bad;font-size:.72rem}

    .picker-result-card{padding:10px}
    .picker-result-main{grid-template-columns:auto 38px minmax(0,1fr);gap:7px}
    .picker-result-actions{gap:6px}
    .picker-result-actions .btn{font-size:.76rem;padding:9px 6px}
  }


  .exercise-block{transition:border-color .18s ease,background .18s ease,box-shadow .18s ease}
  .exercise-block.collapsed{margin:12px 0 14px!important;box-shadow:inset 4px 0 0 var(--ex-accent),0 5px 16px rgba(0,0,0,.12)}
  .exercise-block.collapsed .live-head{border-bottom:0}
  .exercise-head-click{cursor:pointer;user-select:none}
  .exercise-head-click:active{filter:brightness(1.08)}
  .exercise-header-actions{display:flex;gap:6px;align-items:center;flex:0 0 auto}
  .exercise-toggle-btn{width:38px;height:38px;border-radius:11px;border:1px solid color-mix(in srgb,var(--ex-accent) 35%,#303a50);background:var(--ex-soft);color:var(--ex-accent);font-size:1rem;font-weight:950;display:grid;place-items:center;padding:0}
  .exercise-toggle-btn:active{transform:scale(.95)}
  .exercise-status{display:inline-flex;align-items:center;gap:5px;border:1px solid #334056;background:#151d2a;color:#b9c3d3;border-radius:999px;padding:5px 8px;font-size:.66rem;font-weight:900;white-space:nowrap}
  .exercise-status.current{border-color:color-mix(in srgb,var(--ex-accent) 45%,#334056);background:var(--ex-soft);color:color-mix(in srgb,var(--ex-accent) 76%,white)}
  .exercise-status.complete{border-color:rgba(34,197,94,.38);background:rgba(34,197,94,.08);color:#8ce9a4}
  .collapsed-summary{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:9px;padding-top:9px;border-top:1px solid color-mix(in srgb,var(--ex-accent) 18%,#20283a)}
  .collapsed-summary-main{min-width:0}
  .collapsed-target{color:#c8d1df;font-size:.76rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:58vw}
  .collapsed-progress{height:4px;background:#101621;border-radius:999px;overflow:hidden;margin-top:7px;border:1px solid #252f42}
  .collapsed-progress>div{height:100%;background:var(--ex-accent);border-radius:999px;transition:width .2s ease}
  .exercise-expanded-content{display:block}
  .exercise-block.collapsed .exercise-expanded-content{display:none}
  .exercise-block.collapsed .exercise-title{font-size:1rem}
  .exercise-block.collapsed .exercise-meta{margin-top:3px}
  .exercise-block.collapsed .live-head{padding:12px 14px}
  .exercise-block.collapsed .exercise-number{width:31px;height:31px;border-radius:10px}
  .exercise-block.collapsed .exercise-kicker{margin-bottom:4px}
  .exercise-divider.compact-divider{margin:12px 4px 8px;opacity:.68}
  .exercise-block.complete-block{opacity:.9}
  .exercise-block.complete-block.collapsed{opacity:.78}

    .exercise-header-actions{gap:5px}
    .exercise-toggle-btn{width:36px;height:36px}
    .collapsed-target{max-width:54vw}
  }


  .exercise-block.collapsed .exercise-kicker,
  .exercise-block.collapsed .exercise-meta,
  .exercise-block.collapsed .goalbadge,
  .exercise-block.collapsed .exercise-status{display:none!important}

  .exercise-block.collapsed .exercise-header-actions{margin-left:auto}
  .exercise-block.collapsed .live-head{padding:12px 14px}
  .exercise-block.collapsed .exercise-title{font-size:1.02rem;line-height:1.1}
  .exercise-block.collapsed .exercise-number{width:32px;height:32px}
  .exercise-block.collapsed{margin:10px 0 12px!important}
  .exercise-block.collapsed .exercise-expanded-content{display:none!important}

  .exercise-block.collapsed .exercise-expanded-content,

  .exercise-block.collapsed .targetbox,

  .exercise-block.collapsed .field{display:none!important}


  .exercise-block.collapsed > .live-head{display:block!important}
  .exercise-block.collapsed{min-height:0!important}

  .hidden{display:none!important}
  @media(min-width:680px){
    .form-grid.three{grid-template-columns:repeat(3,1fr)}
  }

<div class="app">
<header>
  <div class="topline">
    <div>
      <div class="brand">SWOLE <span>CAT</span></div>
      <div class="sub" id="headerSub"><span class="status-dot"></span>Local-only workout data</div>
    </div>
    <div style="display:flex;gap:7px;align-items:center">
      <button id="installBtn" class="pill install-pill" onclick="installApp()">↓ Install</button>
      <button class="pill" onclick="openSettings()">⚙ Settings</button>
    </div>
  </div>
</header>

<main>
  <section id="home" class="view active">
    <div class="hero">
      <div class="eyebrow">Ready when you are</div>
      <h1 id="helloTitle">Build your training.</h1>
      <div class="muted" id="helloText">Create a routine, log your sets, and come back next week knowing exactly what to beat.</div>
      <div class="actions">
        <button class="btn" onclick="go('routines')">Start / Build Workout</button>
        <button class="btn secondary" onclick="go('exercises')">Browse Exercises</button>
      </div>
    </div>

    <div class="section-title"><h2>Your routines</h2><div><button class="btn small secondary" onclick="installStarterPlan()">3-Day starter</button> <button class="btn small secondary" onclick="newRoutine()">+ New</button></div></div>
    <div id="homeRoutines" class="grid"></div>

    <div class="section-title"><h2>Recent progress</h2></div>
    <div id="recentProgress" class="grid"></div>
  </section>

  <section id="routines" class="view">
    <div class="section-title"><h2>Workout routines</h2><div><button class="btn small secondary" onclick="installStarterPlan()">3-Day starter</button> <button class="btn small" onclick="newRoutine()">+ Create</button></div></div>
    <div id="routineList" class="grid"></div>
  </section>

  <section id="exercises" class="view">
    <div class="section-title"><h2>Exercise library</h2><button class="btn small" onclick="newExercise()">+ Custom</button></div>
    <input id="exerciseSearch" class="search" placeholder="Search bench, row, squat..." oninput="renderExercises()">
    <div class="picker-chips" style="margin-bottom:10px">
      <button id="exerciseFilterAll" class="chip active" data-history-filter="all" onclick="setExerciseHistoryFilter('all')">All</button>
      <button id="exerciseFilterDone" class="chip" data-history-filter="done" onclick="setExerciseHistoryFilter('done')">✓ Done Before</button>
      <button id="exerciseFilterNew" class="chip" data-history-filter="new" onclick="setExerciseHistoryFilter('new')">Not Yet Logged</button>
    </div>
    <div class="form-grid" style="margin-bottom:12px">
      <select id="muscleFilter" onchange="renderExercises()"><option value="">All muscle groups</option></select>
      <select id="equipmentFilter" onchange="renderExercises()"><option value="">All equipment</option></select>
    </div>
    <div id="exerciseList" class="card"></div>
  </section>

  <section id="history" class="view">
    <div class="section-title"><h2>History</h2></div>
    <div id="historyList" class="grid"></div>
  </section>

  <section id="analytics" class="view">
    <div class="section-title"><h2>Progress</h2><span class="tag">LOCAL ANALYTICS</span></div>
    <div id="analyticsArea"></div>
  </section>

  <section id="workout" class="view">
    <div id="workoutArea"></div>
  </section>
</main>

<nav>
  <div class="inner">
    <button class="navbtn active" data-go="home" onclick="go('home')"><b>⌂</b>Home</button>
    <button class="navbtn" data-go="routines" onclick="go('routines')"><b>▤</b>Routines</button>
    <button class="navbtn" data-go="exercises" onclick="go('exercises')"><b>＋</b>Exercises</button>
    <button class="navbtn" data-go="analytics" onclick="go('analytics')"><b>⌁</b>Progress</button>
    <button class="navbtn" data-go="history" onclick="go('history')"><b>↺</b>History</button>
  </div>
</nav>
</div>

<div id="toast" class="toast">Saved</div>

<div id="restTimer" class="resttimer">
  <div class="rest-main"><small>Rest</small><span id="restTimerText">2:00</span></div>
  <div class="rest-actions">
    <button onclick="adjustRestTimer(-30)">−30</button>
    <button onclick="adjustRestTimer(30)">+30</button>
    <button onclick="stopRestTimer()">Skip</button>
  </div>
</div>

<div id="modal" class="modal" onclick="if(event.target===this) closeModal()">

    <div class="sheet-head">
      <h2 id="modalTitle">Edit</h2>
      <button class="x" onclick="closeModal()">✕</button>
    </div>
    <div id="modalBody"></div>
  </div>
</div>

function startOfWeek(d=new Date()){
 const x=new Date(d);x.setHours(0,0,0,0);const day=(x.getDay()+6)%7;x.setDate(x.getDate()-day);return x;
}
function sessionVolume(s){
 return s.exercises.reduce((sum,e)=>sum+completedSets(e).reduce((a,x)=>a+(Number(x.weight)||0)*(Number(x.reps)||0),0),0);
}
function sessionSetCount(s){return s.exercises.reduce((n,e)=>n+completedSets(e).length,0)}
function sessionPRCount(s){return s.exercises.reduce((n,e)=>n+(completedSets(e).some(x=>x.pr)?1:0),0)}
function exerciseHistory(exerciseId){
 const arr=[];
 state.sessions.forEach(s=>s.exercises.forEach(e=>{
   if(e.exerciseId===exerciseId && completedSets(e).length)arr.push({date:s.date,routineName:s.routineName,sets:completedSets(e),notes:e.notes||''});
 }));
 return arr.sort((a,b)=>a.date.localeCompare(b.date));
}
function exerciseMetrics(exerciseId){
 const h=exerciseHistory(exerciseId),sets=h.flatMap(x=>x.sets);
 const bestWeight=sets.length?Math.max(...sets.map(x=>Number(x.weight)||0)):0;
 const bestE1=sets.length?Math.max(...sets.map(x=>estimated1RM(x.weight,x.reps))):0;
 const bestVolume=h.length?Math.max(...h.map(x=>x.sets.reduce((a,s)=>a+(Number(s.weight)||0)*(Number(s.reps)||0),0))):0;
 const latest=h.at(-1),prior=h.at(-2);
 const latestE1=latest?Math.max(...latest.sets.map(x=>estimated1RM(x.weight,x.reps))):0;
 const priorE1=prior?Math.max(...prior.sets.map(x=>estimated1RM(x.weight,x.reps))):0;
 let trend='flat';
 if(priorE1 && latestE1>priorE1*1.01)trend='up';
 else if(priorE1 && latestE1<priorE1*.99)trend='down';
 return {history:h,sets,bestWeight,bestE1,bestVolume,latestE1,priorE1,trend};
}
function weeklyMuscleSets(){
 const start=startOfWeek(),counts={};
 state.sessions.filter(s=>new Date(s.date)>=start).forEach(s=>s.exercises.forEach(e=>{
   const ex=exById(e.exerciseId);if(!ex)return;
   counts[ex.muscle]=(counts[ex.muscle]||0)+completedSets(e).length;
 }));
 return counts;
}
function lastEightWeeks(){
 const now=startOfWeek(),rows=[];
 for(let i=7;i>=0;i--){
   const start=new Date(now);start.setDate(start.getDate()-i*7);
   const end=new Date(start);end.setDate(end.getDate()+7);
   const sessions=state.sessions.filter(s=>{const d=new Date(s.date);return d>=start&&d<end});
   rows.push({label:`${start.getMonth()+1}/${start.getDate()}`,workouts:sessions.length,sets:sessions.reduce((a,s)=>a+sessionSetCount(s),0)});
 }
 return rows;
}
function svgLine(values,width=600,height=130){
 if(!values.length)return '';
 const pad=14,max=Math.max(...values),min=Math.min(...values),range=Math.max(1,max-min);
 const points=values.map((v,i)=>{
   const x=pad+(width-pad*2)*(values.length===1?.5:i/(values.length-1));
   const y=height-pad-(height-pad*2)*((v-min)/range);
   return {x,y,v};
 });
 const pts=points.map(p=>`${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ');
 const fillPts=`${points[0].x},${height-pad} ${pts} ${points.at(-1).x},${height-pad}`;
 return `<svg class="spark" viewBox="0 0 ${width} ${height}" preserveAspectRatio="none" aria-label="progress chart">
   <defs><linearGradient id="areaFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#8b5cf6" stop-opacity=".34"/><stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/></linearGradient></defs>
   <line x1="${pad}" y1="${height/2}" x2="${width-pad}" y2="${height/2}" stroke="#253047" stroke-width="1"/>
   <polygon points="${fillPts}" fill="url(#areaFill)"/>
   <polyline points="${pts}" fill="none" stroke="#9b77f7" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
   ${points.map(p=>`<circle cx="${p.x}" cy="${p.y}" r="5" fill="#ddd6fe" stroke="#6d49bd" stroke-width="2"/>`).join('')}
 </svg><div class="chart-labels"><span>${min.toFixed(0)}</span><span>${max.toFixed(0)}</span></div>`;
}

 <div class="picker-section">Recent sessions</div>
 <div class="card">${h.slice().reverse().slice(0,8).map(x=>`<div class="list-item"><div class="grow"><b>${new Date(x.date).toLocaleDateString()}</b><div class="mini">${x.sets.map(s=>`${s.weight}×${s.reps}`).join(' · ')}</div></div><span class="tag">${Math.max(...x.sets.map(s=>estimated1RM(s.weight,s.reps))).toFixed(0)} e1RM</span></div>`).join('')}</div>

function recentExerciseIds(limit=18){

 [...state.sessions].sort((a,b)=>b.date.localeCompare(a.date)).forEach(s=>[...s.exercises].reverse().forEach(e=>add(e.exerciseId)));
 state.routines.forEach(r=>r.exercises.forEach(e=>{if(out.length<limit)add(e.exerciseId)}));

function coachSignal(exerciseId,config){

 const scores=hist.map(h=>({
   e1:Math.max(...h.sets.map(s=>estimated1RM(s.weight,s.reps))),
   reps:h.sets.reduce((a,s)=>a+Number(s.reps||0),0),

 const latest=scores.at(-1),prev=scores.at(-2);
 const first=scores[0];

 const sameLoadish=Math.abs(latest.weight-first.weight)<=Math.max(.5,Number(config.increment||5));

 const stalled=enoughForStall && sameLoadish && gain<0.012 && latest.reps<=Math.max(...scores.slice(0,-1).map(x=>x.reps))+1;
 const regressing=enoughForStall && recentGain<-0.04 && gain<-0.02;

 const resetPercent=Number(config.resetPercent||7.5);
 const resetWeight=roundLoad(latest.weight*(1-resetPercent/100));
 if(regressing && highEffortKnown){
   return {level:'reset',title:'Repeated hard-session drop',text:`Recent performance is down and your latest logged effort was very high. Consider a ${resetPercent}% session-only reset to ${resetWeight} ${state.profile.unit}, then rebuild.`,stalled:true,canReset:true,resetWeight,resetPercent};

 }

 }

function buildRecommendation(config,prev,exerciseId=null){
 const done=completedSets(prev);

 const avgRIR=averageLoggedRIR(done);
 if(!done.length){
   return {status:'baseline',weight:0,weights:Array(config.sets).fill(0),targetReps:Array(config.sets).fill(config.minReps),
     headline:'Set your starting weight',detail:`Choose a clean starting load for about ${config.minReps}-${config.maxReps} reps. ${goalRIRText(goal)}`};
 }
 const weights=done.map(s=>Number(s.weight)||0);
 const reps=done.map(s=>Number(s.reps)||0);
 const sameWeight=weights.every(w=>w===weights[0]);
 const baseWeight=weights[0];
 const total=reps.reduce((a,b)=>a+b,0);
 if(config.mode==='manual'){
   return {status:'manual',weight:baseWeight,weights:Array.from({length:config.sets},(_,i)=>weights[i]??baseWeight),targetReps:Array.from({length:config.sets},(_,i)=>reps[i]??config.minReps),
     headline:'Repeat or adjust manually',detail:`Last session: ${done.map(s=>`${s.weight}×${s.reps}`).join(' · ')}`};
 }
 if(config.mode==='total'){
   const target=distributeTarget(reps,config.minReps,config.maxReps,config.sets);
   return {status:'reps',weight:baseWeight,weights:Array(config.sets).fill(baseWeight),targetReps:target,
     headline:`Beat ${total} total reps at ${baseWeight} ${state.profile.unit}`,detail:`Keep the same load. A one-rep improvement anywhere counts as progress.`};
 }
 // Double progression: add one rep to every programmed set on the next exposure, capped at the top of the rep range. Add load only after every set reaches the top of the range at one stable weight.
 const enoughSets=done.length>=config.sets;
 const allTop=enoughSets && done.slice(0,config.sets).every(s=>Number(s.reps)>=config.maxReps);
 if(sameWeight && allTop){
   if(goal==='strength' && avgRIR!=null && avgRIR<1){
     return {status:'reps',weight:baseWeight,weights:Array(config.sets).fill(baseWeight),targetReps:Array(config.sets).fill(config.maxReps),
       headline:`Own ${baseWeight} ${state.profile.unit} once more`,detail:`You reached the top of the rep range, but the logged effort was very high. For a strength goal, repeating clean quality reps before adding load is reasonable.`};
   }
   const next=roundLoad(baseWeight+Number(config.increment||0));
   return {status:'load',weight:next,weights:Array(config.sets).fill(next),targetReps:Array(config.sets).fill(config.minReps),
     headline:`Increase to ${next} ${state.profile.unit}`,detail:`You earned one configured load step after reaching the top of the rep range across all working sets. ${goalRIRText(goal)}`};
 }

   headline:`Stay at ${baseWeight} ${state.profile.unit} and add 1 rep to each set`,
   detail:`Last session: ${done.map(s=>`${s.weight}×${s.reps}`).join(' · ')}. Next target: ${target.map(r=>`${baseWeight}×${r}`).join(' · ')}. Each set progresses by one rep until all ${config.sets} sets reach ${config.maxReps}, then the load increases by your configured increment. ${goalRIRText(goal)}`};

function liveSetTarget(e,si,prev){

 const base=buildRecommendation(e.config,prev,e.exerciseId);

function detectPR(exerciseId,set){

 }));

 // multiple sets tie the same newly achieved record in one session.

   state.activeWorkout.exercises.forEach(e=>{
     if(e.exerciseId===exerciseId)completedSets(e).forEach(x=>{if(x!==set)prior.push(x)});

 // A first-ever logged performance establishes the baseline. It is not counted
 // as a PR until a future performance actually beats it.

   showToast(`Up next: ${ex?.name||'next exercise'}`);
   scrollToWorkoutExercise(next);
 }else{
   save();renderWorkout();
   showToast('All programmed sets complete');
 }
 return true;
}

function updateSet(ei,si,k,v){
 const s=state.activeWorkout.exercises[ei].sets[si];
 if(k==='rir')s[k]=(v===''?'':+v);
 else s[k]=(v===''?0:Math.max(0,+v||0));
 if(k!=='rir')s.pr='';
 save();
}
function toggleSet(ei,si){
 const e=state.activeWorkout.exercises[ei],set=e.sets[si];
 set.done=!set.done;
 if(set.done){
   set.pr=detectPR(e.exerciseId,set);
   haptic(set.pr?[35,40,70]:25);
   startRestTimer(e.config.restSeconds||120);
   save();
   if(advanceFromCompletedExercise(ei))return;
 } else{
   set.pr='';
   // Re-open an exercise if a completed set is unchecked later.
   if(!e.expanded){state.activeWorkout.exercises.forEach((x,i)=>x.expanded=i===ei);}

let restInterval=null,restLeft=0;
function paintRestTimer(){
 const box=document.getElementById('restTimer'),txt=document.getElementById('restTimerText');if(!box||!txt)return;
 const m=Math.floor(restLeft/60),s=String(Math.max(0,restLeft%60)).padStart(2,'0');txt.textContent=`${m}:${s}`;
}
function startRestTimer(seconds){
 stopRestTimer();restLeft=Math.max(0,Number(seconds)||120);
 const box=document.getElementById('restTimer');box?.classList.add('show');paintRestTimer();
 restInterval=setInterval(()=>{restLeft--;paintRestTimer();if(restLeft<=0){stopRestTimer();haptic([120,80,120]);}},1000);
}
function adjustRestTimer(delta){restLeft=Math.max(0,restLeft+delta);paintRestTimer();if(restLeft===0)stopRestTimer();}
function stopRestTimer(){if(restInterval)clearInterval(restInterval);restInterval=null;restLeft=0;document.getElementById('restTimer')?.classList.remove('show');}

function subScore(current,candidate){
 if(!current||!candidate||current.id===candidate.id)return -999;
 let score=0;
 if(current.pattern && candidate.pattern===current.pattern)score+=60;
 if(current.muscle===candidate.muscle)score+=35;
 if(current.equipment===candidate.equipment)score+=8;
 // close families that commonly substitute reasonably when the exact pattern is unavailable
 const families={horizontal_press:['incline_press','dip_press'],incline_press:['horizontal_press','vertical_press'],horizontal_pull:['vertical_pull'],vertical_pull:['horizontal_pull','shoulder_extension'],squat:['lunge'],lunge:['squat'],hip_extension:['hinge'],hinge:['hip_extension'],rear_delt:['horizontal_pull'],elbow_extension:['dip_press']};
 if((families[current.pattern]||[]).includes(candidate.pattern))score+=14;
 return score;
}
function substitutionReason(current,c){
 const bits=[];
 if(c.pattern===current.pattern)bits.push('same movement pattern');
 if(c.muscle===current.muscle)bits.push(`same primary muscle`);
 if(c.equipment===current.equipment)bits.push('same equipment');
 return bits.length?bits.join(' · '):`${c.muscle} alternative`;
}
function recommendedSubs(exerciseId,query=''){
 const cur=exById(exerciseId); if(!cur)return [];
 let arr=allExercises().filter(x=>x.id!==exerciseId);
 if(query){const q=query.toLowerCase();arr=arr.filter(x=>x.name.toLowerCase().includes(q)||x.muscle.toLowerCase().includes(q)||patternLabel(x.pattern).toLowerCase().includes(q));}
 return arr.map(x=>({x,score:subScore(cur,x)})).sort((a,b)=>b.score-a.score||a.x.name.localeCompare(b.x.name));
}

   <div class="picker-result-main">
     <div></div>
     <div class="iconbox">${equipmentIcon(x.equipment)}</div>
     <div class="picker-result-copy"><div class="exercise-name">${esc(x.name)}</div><div class="mini">${esc(x.muscle)} · ${esc(x.equipment)}<br>${esc(substitutionReason(cur,x))}</div></div>

       ?`<button class="btn small" onclick="swapWorkoutExercise(${index},'${x.id}',false)">Use Today</button><button class="btn small secondary" onclick="swapWorkoutExercise(${index},'${x.id}',true)">Use + Save to Routine</button>`
       :`<button class="btn small" onclick="swapRoutineExercise('${context}',${index},'${x.id}')">Use This Exercise</button>`}
   </div>
 </div>`).join('')||'<div class="empty">No matching exercises.</div>';
}

function setAddMovement(p){addPickerMovement=p;renderAddExercisePicker()}
function renderAddExercisePicker(){
 const host=document.getElementById('addExList');if(!host)return;
 const q=(document.getElementById('addExSearch')?.value||'').trim();
 if(q){host.innerHTML=`<div class="picker-section">Search results</div><div class="picker-result-list">${addPickerRows(allExercises().filter(x=>exerciseMatchesSearch(x,q)).slice(0,100))}</div>`;return;}
 if(addPickerCategory==='home'){
   const fav=allExercises().filter(x=>isFavorite(x.id)),recent=recentExerciseIds().map(exById).filter(Boolean);
   host.innerHTML=`${fav.length?`<div class="picker-section">★ Favorites</div><div class="picker-result-list">${addPickerRows(fav)}</div>`:''}
   ${recent.length?`<div class="picker-section">↺ Recently used</div><div class="picker-result-list">${addPickerRows(recent.slice(0,10))}</div>`:''}
   <div class="picker-section">Browse by muscle group</div><div class="category-grid">${muscleCategories().map(c=>`<button class="category-card" onclick="setAddCategory('${escAttr(c.name)}')"><b>${categoryIcon(c.name)} ${esc(c.name)}</b><span>${c.count} exercises</span></button>`).join('')}</div>`;
   return;
 }
 const inCat=allExercises().filter(x=>x.muscle===addPickerCategory);
 const patterns=[...new Set(inCat.map(x=>x.pattern))].sort((a,b)=>patternLabel(a).localeCompare(patternLabel(b)));
 const filtered=addPickerMovement?inCat.filter(x=>x.pattern===addPickerMovement):inCat;
 host.innerHTML=`<div class="breadcrumb"><button onclick="setAddCategory('home')">All categories</button><span>›</span><b>${esc(addPickerCategory)}</b></div>
 <div class="picker-chips"><button class="chip ${!addPickerMovement?'active':''}" onclick="setAddMovement('')">All</button>${patterns.map(p=>`<button class="chip ${addPickerMovement===p?'active':''}" onclick="setAddMovement('${p}')">${esc(patternLabel(p))}</button>`).join('')}</div>
 <div class="picker-result-list">${addPickerRows(filtered)}</div>`;
}
function refreshAddExercisePicker(){renderAddExercisePicker()}

function defaultWorkoutExerciseConfig(){
 return {
   sets:state.settings.defaultSets,
   minReps:state.settings.defaultMin,
   maxReps:state.settings.defaultMax,
   increment:state.settings.defaultIncrement,
   mode:'double',
   trainingGoal:'general',
   resetPercent:7.5,
   restSeconds:120
 };
}
function scrollToWorkoutExercise(index){
 setTimeout(()=>{
   const el=document.getElementById(`workoutExercise-${index}`);
   if(el)el.scrollIntoView({behavior:'smooth',block:'start'});
 },90);
}
function addExerciseToWorkout(exerciseId,permanent){
 const w=state.activeWorkout;if(!w)return;
 const ex=exById(exerciseId);if(!ex)return;
 const routine=state.routines.find(r=>r.id===w.routineId);
 const existingIndex=w.exercises.findIndex(e=>e.exerciseId===exerciseId);
 const routineIndex=routine?.exercises.findIndex(e=>e.exerciseId===exerciseId)??-1;

 // If it is already in today's workout, "Routine" can still promote a today-only addition.
 if(existingIndex>=0){
   if(permanent && routine && routineIndex<0){
     const cfg={...w.exercises[existingIndex].config};
     const savedCfg={
       exerciseId,
       sets:cfg.sets,
       minReps:cfg.minReps,
       maxReps:cfg.maxReps,
       increment:cfg.increment,
       mode:cfg.mode==='double'?'double':cfg.mode,
       trainingGoal:cfg.trainingGoal||'general',
       resetPercent:cfg.resetPercent||7.5,
       restSeconds:cfg.restSeconds||120
     };
     routine.exercises.push(savedCfg);
     w.exercises.forEach((e,i)=>e.expanded=i===existingIndex);
     w.exercises[existingIndex].routineIndex=routine.exercises.length-1;
     save();haptic([20,30,20]);closeModal();renderWorkout();
     showToast(`${ex.name} saved to routine`);
     scrollToWorkoutExercise(existingIndex);
     return;
   }
   showToast(`${ex.name} is already in this workout`);
   return;
 }

 const cfg=defaultWorkoutExerciseConfig();
 let newRoutineIndex=null;

 if(permanent && routine){
   if(routineIndex<0){
     routine.exercises.push({exerciseId,...cfg});
     newRoutineIndex=routine.exercises.length-1;
   }else{
     newRoutineIndex=routineIndex;
   }
 }

 const prev=previousExercise(exerciseId);
 const rec=buildRecommendation(cfg,prev,exerciseId);
 const entry={
   exerciseId,
   routineIndex:newRoutineIndex,
   config:{...cfg},
   targetOverride:null,
   expanded:true,
   sets:Array.from({length:cfg.sets},(_,i)=>({
     weight:rec.weights?.[i]??rec.weight??0,
     reps:rec.targetReps?.[i]??cfg.minReps,
     done:false,
     rir:''
   })),
   notes:''
 };
 w.exercises.forEach(e=>e.expanded=false);
 w.exercises.push(entry);
 const newIndex=w.exercises.length-1;
 save();haptic([20,30,20]);closeModal();renderWorkout();
 showToast(permanent?`${ex.name} added + saved to routine`:`${ex.name} added for today`);
 scrollToWorkoutExercise(newIndex);
}



function convertStoredUnits(fromUnit,toUnit){
 if(fromUnit===toUnit)return;
 const factor=fromUnit==='lb'&&toUnit==='kg'?0.45359237:
              fromUnit==='kg'&&toUnit==='lb'?2.2046226218:1;
 const cv=v=>Math.round((Number(v)||0)*factor*100)/100;
 state.settings.defaultIncrement=cv(state.settings.defaultIncrement);
 state.routines.forEach(r=>r.exercises.forEach(e=>{e.increment=cv(e.increment)}));
 state.sessions.forEach(s=>s.exercises.forEach(e=>e.sets.forEach(set=>{set.weight=cv(set.weight)})));
 (state.bodyweight||[]).forEach(x=>{x.value=cv(x.value)});
 if(state.activeWorkout){
   state.activeWorkout.exercises.forEach(e=>{
     e.config.increment=cv(e.config.increment);
     e.sets.forEach(set=>{set.weight=cv(set.weight)});
     if(e.targetOverride)e.targetOverride.weight=cv(e.targetOverride.weight);
   });
 }
}

function openSettings(){
 openModal('Settings & backup',`
 <div class="field"><label>Your name</label><input id="pName" value="${escAttr(state.profile.name||'')}" placeholder="Jake"></div>
 <div class="field"><label>Units</label><select id="pUnit"><option value="lb" ${state.profile.unit==='lb'?'selected':''}>Pounds (lb)</option><option value="kg" ${state.profile.unit==='kg'?'selected':''}>Kilograms (kg)</option></select><div class="native-note" style="margin-top:6px">Changing units converts your stored workout weights, bodyweight entries, and progression increments.</div></div>
 <div class="form-grid three">
   <div><label>Default sets</label><input type="number" id="dSets" value="${state.settings.defaultSets}"></div>
   <div><label>Min reps</label><input type="number" id="dMin" value="${state.settings.defaultMin}"></div>
   <div><label>Max reps</label><input type="number" id="dMax" value="${state.settings.defaultMax}"></div>
 </div>
 <div class="field"><label>Default weight jump</label><input type="number" step=".5" id="dInc" value="${state.settings.defaultIncrement}"></div>
 <div class="section-title"><h2>App feel</h2></div>
 <div class="card">
   <div class="setting-toggle"><div><b>Haptic feedback</b><div class="mini">Short vibrations for completed sets, PRs, and timers.</div></div><button id="hapticToggle" class="toggle ${state.ui?.haptics!==false?'on':''}" onclick="this.classList.toggle('on')"></button></div>
   <div class="setting-toggle" style="border-bottom:0"><div><b>Keep screen awake</b><div class="mini">Ask Android to keep the screen awake during an active workout when supported.</div></div><button id="awakeToggle" class="toggle ${state.ui?.keepAwake!==false?'on':''}" onclick="this.classList.toggle('on')"></button></div>
 </div>
 <div class="actions"><button class="btn" onclick="saveSettings()">Save settings</button></div>
 <div class="section-title"><h2>Coach behavior</h2></div>
 <div class="notice">The coach uses repeated logged performance, your optional RIR entries, and each exercise's selected goal. Stall and reset flags are intentionally conservative. They are suggestions, and manual session targets always remain available.</div>
 <div class="section-title"><h2>Backup</h2></div>
 <div class="notice"><b>Progression rule:</b> Double progression keeps the same weight while you add reps. Only after every programmed set reaches the top of its rep range will the app suggest exactly one configured weight increment.<br><br>Everything lives on this device. Export a backup occasionally so a lost phone or cleared browser storage doesn't wipe your history.</div>
 <div class="actions"><button class="btn secondary" onclick="exportBackup()">Export backup</button><label class="btn secondary" style="display:inline-block;margin:0">Import backup<input type="file" accept=".json" onchange="importBackup(this.files[0])" style="display:none"></label></div>
 <div class="actions"><button class="btn danger" onclick="resetAll()">Erase all local data</button></div>
 `);
}
function saveSettings(){
 const oldUnit=state.profile.unit;
 const newUnit=document.getElementById('pUnit').value;
 state.profile.name=document.getElementById('pName').value.trim();
 state.settings.defaultSets=+document.getElementById('dSets').value||3;
 state.settings.defaultMin=+document.getElementById('dMin').value||8;
 state.settings.defaultMax=+document.getElementById('dMax').value||12;
 state.settings.defaultIncrement=+document.getElementById('dInc').value||5;
 state.ui.haptics=document.getElementById('hapticToggle').classList.contains('on');
 state.ui.keepAwake=document.getElementById('awakeToggle').classList.contains('on');
 if(newUnit!==oldUnit)convertStoredUnits(oldUnit,newUnit);
 state.profile.unit=newUnit;
 save();haptic(15);closeModal();renderHome();showToast(newUnit!==oldUnit?`Converted workout data to ${newUnit}`:'Settings saved');
}
function exportBackup(){
 const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='swole-cat-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(a.href);
}
function importBackup(file){
 if(!file)return; const r=new FileReader(); r.onload=()=>{try{state=Object.assign(freshState(),JSON.parse(r.result));save();closeModal();renderHome();alert('Backup imported.');}catch(e){alert('That backup file could not be read.')}}; r.readAsText(file);
}
function resetAll(){closeModal();confirmAction('Erase all local data?','This permanently removes every workout, routine, custom exercise, favorite, bodyweight entry, and setting stored on this device.',()=>{localStorage.removeItem(LSKEY);state=freshState();renderHome();showToast('Local data erased');setTimeout(onboarding,250);});}

function openModal(title,body){document.getElementById('modalTitle').innerHTML=title;document.getElementById('modalBody').innerHTML=body;document.getElementById('modal').classList.add('open')}
function closeModal(){document.getElementById('modal').classList.remove('open')}
function uid(){return 'id_'+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function escAttr(s){return esc(s)}

window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstallPrompt=e;updateInstallButton();});
window.addEventListener('appinstalled',()=>{deferredInstallPrompt=null;updateInstallButton();showToast('Swole Cat installed');});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&state.activeWorkout)requestWakeLock();});
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}
renderHome();populateMuscles();updateInstallButton();
if(state.activeWorkout){
 confirmAction('Resume workout?','You have an unfinished workout saved on this device.',()=>{requestWakeLock();renderWorkout();go('workout');});
} else if(!state.ui?.onboardingDone){
 setTimeout(onboarding,180);
}
</script>
